x;background:{{ b.fill }};opacity:0.55\"><\/div>\n          <\/sc-for>\n          <div style=\"position:absolute;left:0;width:16px;bottom:0;height:{{ fp.indH }}px;background:#2E5F8A\"><\/div>\n          <sc-for list=\"{{ fp.ticks }}\" as=\"tk\" hint-placeholder-count=\"2\">\n            <div style=\"position:absolute;right:-8px;top:{{ tk.y }}px;width:7px;height:3px;background:{{ tk.c }}\"><\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size:9px;color:#55524c\">{{ fp.loT }}<\/div>\n      <\/div>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center\">\n        <div style=\"display:flex;align-items:baseline;gap:6px\"><div style=\"font-size:24px;font-weight:700\">{{ fp.pvT }}<\/div><div style=\"font-size:11px;color:#55524c\">{{ fp.eu }}<\/div><\/div>\n        <div style=\"font-size:10.5px;color:#55524c\">INDICATION ONLY — DATAACQ (DACA)<\/div>\n        <div style=\"font-size:10.5px;color:#55524c\">RANGE {{ fp.loT }} – {{ fp.hiT }} {{ fp.eu }}<\/div>\n        <div style=\"font-size:10px;font-weight:700;color:#7a1a00;height:12px\">{{ fp.noteT }}<\/div>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ fp.isMotor }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:10px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"width:86px;text-align:center;padding:10px 0;font-size:15px;font-weight:700;background:{{ fp.stBg }};color:{{ fp.stFg }};border:2px solid #55524c\">{{ fp.stT }}<\/div>\n        <div style=\"font-size:11px;color:#3c3c3c;line-height:1.5\">CMD: <b>{{ fp.cmdT }}<\/b><br />FEEDBACK: <b>{{ fp.fbT }}<\/b><\/div>\n      <\/div>\n      <div style=\"display:flex;gap:4px\">\n        <div style=\"flex:1;text-align:center;padding:6px 0;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ fp.start }}\">START<\/div>\n        <div style=\"flex:1;text-align:center;padding:6px 0;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ fp.stop }}\">STOP<\/div>\n      <\/div>\n      <div style=\"font-size:10.5px;color:{{ fp.permFg }};font-weight:700\">{{ fp.permT }}<\/div>\n      <div style=\"font-size:10px;color:#55524c\">DEVCTL · uncommanded stop raises TRIP (Urgent); failed start raises CMDFAIL (High)<\/div>\n    <\/div>\n    <\/sc-if>\n\n    <div style=\"display:flex;gap:3px;padding:0 8px 8px 8px\">\n      <div style=\"flex:1;text-align:center;padding:3px 0;font-size:10.5px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ fp.sil }}\">SILENCE<\/div>\n      <div style=\"flex:1;text-align:center;padding:3px 0;font-size:10.5px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ fp.ack }}\">ACK<\/div>\n      <div style=\"flex:1;text-align:center;padding:3px 0;font-size:10.5px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ fp.detail }}\">DETAIL<\/div>\n      <div style=\"flex:1;text-align:center;padding:3px 0;font-size:10.5px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ fp.sigPath }}\">SIG PATH<\/div>\n    <\/div>\n    <div style=\"padding:0 8px 6px 8px;font-size:10px;color:#55524c;display:flex;gap:8px\"><div>{{ fp.modeLine }}<\/div><div style=\"flex:1\"><\/div><div style=\"font-weight:700;color:#31548F\">{{ fp.initT }}<\/div><\/div>\n  <\/div>\n<\/sc-for>\n\n<sc-if value=\"{{ db.on }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-drill-banner=\"true\" style=\"position:absolute;bottom:8px;left:10px;z-index:850;background:#41608A;color:#FFFFFF;padding:5px 10px;display:flex;gap:12px;align-items:center;border:1px solid #22344e;box-shadow:2px 2px 8px rgba(0,0,0,0.4)\">\n    <div style=\"font-size:11px;font-weight:700\">DRILL IN PROGRESS · {{ db.tm }} · {{ db.sourceT }}<\/div>\n    <div style=\"font-size:10px;padding:2px 8px;background:#D4D0C8;color:#000;font-weight:700;cursor:pointer\" onClick=\"{{ db.end }}\">END<\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ dg.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;z-index:900;background:rgba(30,30,30,0.18)\">\n  <div style=\"position:absolute;left:50%;top:12%;transform:translateX(-50%);width:{{ dg.w }}px;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #5E5E5E #5E5E5E #FFFFFF;box-shadow:6px 6px 16px rgba(0,0,0,0.45)\">\n    <div style=\"display:flex;align-items:center;background:#41608A;color:#FFFFFF;padding:4px 8px\">\n      <div style=\"font-weight:700;font-size:12px;flex:1\">{{ dg.title }}<\/div>\n      <div style=\"padding:1px 7px;font-weight:700;cursor:pointer;background:#D4D0C8;color:#000;border:1px solid #FFFFFF\" onClick=\"{{ dg.close }}\">✕<\/div>\n    <\/div>\n    <div style=\"padding:12px;max-height:70vh;overflow-y:auto\">\n\n      <sc-if value=\"{{ dg.isLogon }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Current security level: <b>{{ secT }}<\/b><\/div>\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:8px;line-height:1.5\">{{ dg.logonNote }}<\/div>\n        <sc-if value=\"{{ dg.logonIsOper }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n            <div style=\"font-size:12px;width:66px\">Operator:<\/div>\n            <input value=\"{{ dg.name }}\" onChange=\"{{ dg.nameChange }}\" onKeyDown=\"{{ dg.pwKey }}\" placeholder=\"{{ dg.operCur }}\" style=\"width:150px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n            <div style=\"font-size:11px;color:#55524c\">current: {{ dg.operCur }}<\/div>\n          <\/div>\n        <\/sc-if>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n          <div style=\"font-size:12px;width:66px\">Password:<\/div>\n          <input type=\"password\" value=\"{{ dg.pw }}\" onChange=\"{{ dg.pwChange }}\" onKeyDown=\"{{ dg.pwKey }}\" style=\"width:150px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.pwGo }}\">ENTER<\/div>\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.signOff }}\">SIGN OFF<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;line-height:1.5\">Operator-based security: a name plus a level password. Training defaults: <b>oper<\/b>, <b>supv<\/b>, <b>engr<\/b>, <b>mngr<\/b>. Sign Off drops to View Only. Tuning and trip-point changes require ENGR or above (signed); disabling alarms for an asset requires MNGR (signed).<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isShelve }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Shelve alarm: <b>{{ dg.shelfTag }}<\/b><\/div>\n        <div style=\"display:flex;gap:6px;margin-bottom:10px\">\n          <sc-for list=\"{{ dg.durs }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <div style=\"padding:5px 14px;font-weight:700;cursor:pointer;background:{{ d.bg }};border:2px solid;border-color:{{ d.bc }}\" onClick=\"{{ d.cb }}\">{{ d.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size:12px;margin-bottom:4px\">Reason (required):<\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px\">\n          <sc-for list=\"{{ dg.reasons }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;background:{{ r.bg }};border:2px solid;border-color:{{ r.bc }}\" onClick=\"{{ r.cb }}\">{{ r.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:10px\">\n          <div style=\"font-size:12px\">Detail:<\/div>\n          <input value=\"{{ dg.reason }}\" onChange=\"{{ dg.reasonChange }}\" placeholder=\"free text — required when OTHER is chosen\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.shelfGo }}\">SHELVE<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">A shelved alarm stops annunciating and moves to the SHELVED view until the timer expires or it is unshelved; if the condition is still present when the timer runs out it re-annunciates. Maximum 60 min in this simulator. A record is kept in the Event and Message Summaries. Shelve nuisance alarms only — not a substitute for fixing them.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isComment }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Comment on alarm: <b>{{ dg.shelfTag }}<\/b><\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-bottom:6px\">Current: {{ dg.commentCur }}<\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:10px\">\n          <input value=\"{{ dg.reason }}\" onChange=\"{{ dg.reasonChange }}\" onKeyDown=\"{{ dg.commentKey }}\" placeholder=\"what was seen, what was done, who was told\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.commentGo }}\">STORE<\/div>\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.close }}\">CANCEL<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">The comment is stored on the alarm record (shown as C in the summary and in the Alarm Help pane) and written to the Event Summary as an operator event. OPER or above.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isDrills }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:10px;line-height:1.5\">Process drills (D-series): <b>CANONICAL<\/b> loads the named initial condition before arming; <b>LIVE STATE<\/b> intentionally uses the plant exactly as it stands. A fault is injected 8–15 s after start (no announcement). Respond as an operator: <b>Silence → Ack → read condition → check trend → act → verify<\/b>. Scored on detection, action, trip avoidance, stabilization, and diagnosis.<\/div>\n        <sc-for list=\"{{ dg.drills }}\" as=\"d\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;padding:6px 8px;border:1px solid #B6B6B2;background:#CFCFCB;margin-bottom:4px\">\n            <div style=\"width:36px;font-weight:700\">{{ d.id }}<\/div>\n            <div style=\"flex:1;font-size:12px\">{{ d.name }}<\/div>\n            <div style=\"font-size:10px;color:#55524c;margin-right:6px\">{{ d.presetT }}<\/div>\n            <div style=\"padding:3px 10px;font-weight:700;cursor:pointer;background:#B8C4D4;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ d.canonicalCb }}\">CANONICAL<\/div>\n            <div style=\"padding:3px 10px;margin-left:4px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ d.liveCb }}\">LIVE STATE<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"display:flex;justify-content:flex-end;margin-top:6px\">\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.randomDrill }}\">RANDOM · CANONICAL<\/div>\n        <\/div>\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin:12px 0 8px 0;line-height:1.5\">Architecture drills (A1–A12): a hidden failure in the conceptual FIELD → INFORMATION path. Start loads the drill's initial condition and opens ARCH in Diagnose. Mark evidence, pin a comparison, name the failure domain, verify. Learn is hidden while a drill is running — it shows the answer.<\/div>\n        <sc-for list=\"{{ dg.archDrills }}\" as=\"ad\" hint-placeholder-count=\"12\">\n          <div style=\"display:flex;align-items:center;padding:6px 8px;border:1px solid #B6B6B2;background:#CFCFCB;margin-bottom:4px\">\n            <div style=\"width:36px;font-weight:700\">{{ ad.id }}<\/div>\n            <div style=\"flex:1;font-size:12px\">{{ ad.name }}<\/div>\n            <div style=\"padding:3px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ ad.cb }}\">START<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isDebrief }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-weight:700;font-size:13px;margin-bottom:2px\">{{ dg.dbName }}<\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-bottom:10px\">{{ dg.dbReason }}<\/div>\n        <sc-for list=\"{{ dg.dbRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;padding:3px 6px;font-size:12px;border-bottom:1px solid #B6B6B2\"><div style=\"width:280px;color:#3c3c3c\">{{ r.k }}<\/div><div style=\"font-weight:700;color:{{ r.fg }}\">{{ r.v }}<\/div><\/div>\n        <\/sc-for>\n        <sc-if value=\"{{ dg.dbGuideOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:8px;padding:6px 8px;font-size:11.5px;line-height:1.45;color:#1f2a3c;background:#E6E4DE;border:1px solid #B6B6B2\">{{ dg.dbGuide }}<\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ dg.dbAsk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;font-size:12px;font-weight:700\">{{ dg.dbQ }}<\/div>\n          <sc-for list=\"{{ dg.dbOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"margin-top:4px;padding:5px 8px;font-size:12px;cursor:pointer;background:{{ o.bg }};border:2px solid;border-color:{{ o.bc }}\" onClick=\"{{ o.cb }}\">{{ o.label }}<\/div>\n          <\/sc-for>\n          <div style=\"display:flex;justify-content:flex-end;margin-top:10px\">\n            <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.dbSubmit }}\">SUBMIT<\/div>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ dg.dbScored }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;display:flex;align-items:baseline;gap:12px\"><div style=\"font-size:26px;font-weight:700\">{{ dg.dbScore }}/100<\/div><div style=\"font-size:14px;font-weight:700;color:{{ dg.dbGradeFg }}\">{{ dg.dbGrade }}<\/div><div style=\"font-size:11px;color:#55524c\">{{ dg.dbOper }}<\/div><\/div>\n          <div style=\"font-size:11px;color:#55524c;margin-bottom:6px\">{{ dg.dbPassT }}<\/div>\n          <div style=\"display:flex;padding:3px 6px;font-size:11px;font-weight:700;background:#C8C5BE;border:1px solid #B6B6B2\"><div style=\"width:220px\">Scoring element<\/div><div style=\"width:70px\">Points<\/div><div style=\"flex:1\">Basis<\/div><\/div>\n          <sc-for list=\"{{ dg.dbBreak }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;padding:3px 6px;font-size:12px;border-bottom:1px solid #B6B6B2\"><div style=\"width:220px;color:#3c3c3c\">{{ b.label }}<\/div><div style=\"width:70px;font-weight:700;color:{{ b.fg }}\">{{ b.pts }}<\/div><div style=\"flex:1;color:#55524c\">{{ b.note }}<\/div><\/div>\n          <\/sc-for>\n          <div style=\"font-size:10.5px;color:#55524c;margin-top:6px;line-height:1.4\">Weights 20 / 25 / 20 / 15 / 10 / 10: acknowledge within 30 s scores full marks; the correct action within 3 min scores full marks; alarm load during the drill is measured by the KPI module (≤ 1 per 10 min full marks, ≥ 10 none). 'Trip avoided' covers the drill's own equipment; a trip elsewhere during the drill deducts 10 points each (at most 20). The result is stored in the Training record under the trainee's logon name.<\/div>\n        <\/sc-if>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isEsig }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:6px\">Action: <b>{{ dg.esigDesc }}<\/b><\/div>\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:8px\">Signer: {{ dg.esigWho }} · required level: <b>{{ dg.esigNeed }}<\/b><\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n          <div style=\"font-size:12px;width:70px\">Password:<\/div>\n          <input type=\"password\" value=\"{{ dg.pw }}\" onChange=\"{{ dg.pwChange }}\" onKeyDown=\"{{ dg.esigKey }}\" style=\"width:150px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:10px\">\n          <div style=\"font-size:12px;width:70px\">Reason:<\/div>\n          <input value=\"{{ dg.reason }}\" onChange=\"{{ dg.reasonChange }}\" onKeyDown=\"{{ dg.esigKey }}\" placeholder=\"required — why this change is made\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.esigGo }}\">SIGN<\/div>\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.close }}\">CANCEL<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">An electronic signature re-enters the password for a level at or above the one required and records a reason. The action executes only after a valid signature; the signature, the operator name, the level and the reason are written to the Event Summary, and the change itself appears in the change log (CONFIG). Refused signatures are journaled too.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isRecord }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ dg.recOpers }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;font-size:11.5px;padding:2px 0\"><div style=\"width:140px;font-weight:700\">{{ o.oper }}<\/div><div style=\"flex:1;color:#3c3c3c\">{{ o.txt }}<\/div><\/div>\n        <\/sc-for>\n        <div style=\"display:flex;padding:3px 6px;margin-top:8px;font-size:11px;font-weight:700;background:#C8C5BE;border:1px solid #B6B6B2\"><div style=\"width:130px\">Date / Time<\/div><div style=\"width:110px\">Trainee<\/div><div style=\"flex:1\">Drill<\/div><div style=\"width:60px\">Score<\/div><div style=\"width:90px\">Result<\/div><\/div>\n        <sc-for list=\"{{ dg.recRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"padding:3px 6px;font-size:12px;border-bottom:1px solid #B6B6B2\">\n            <div style=\"display:flex\"><div style=\"width:130px\">{{ r.t }}<\/div><div style=\"width:110px;font-weight:700\">{{ r.oper }}<\/div><div style=\"flex:1\">{{ r.drill }}<\/div><div style=\"width:60px;font-weight:700\">{{ r.score }}<\/div><div style=\"width:90px;font-weight:700;color:{{ r.fg }}\">{{ r.res }}<\/div><\/div>\n            <div style=\"font-size:10.5px;color:#55524c\">{{ r.detail }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <sc-if value=\"{{ dg.recEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 0;font-size:12px;color:#55524c\">No drill has been scored yet this session. Run a drill (Drills menu) and submit the debrief question.<\/div><\/sc-if>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">{{ dg.recNote }}<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isCoverage }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:8px;line-height:1.5\">{{ dg.covSummary }}<\/div>\n        <sc-for list=\"{{ dg.covGroups }}\" as=\"g\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;padding:3px 6px;margin-top:6px;font-size:11px;font-weight:700;background:#C8C5BE;border:1px solid #B6B6B2\"><div style=\"flex:1\">{{ g.name }}<\/div><div>{{ g.count }}<\/div><\/div>\n          <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;padding:2px 6px;font-size:11.5px;border-bottom:1px solid #B6B6B2\"><div style=\"width:22px;font-weight:700;color:{{ r.fg }}\">{{ r.tick }}<\/div><div style=\"width:290px;font-weight:{{ r.fw }};color:{{ r.fg }}\">{{ r.label }}<\/div><div style=\"width:150px;color:#3c3c3c\">{{ r.drills }}<\/div><div style=\"flex:1;color:#55524c;font-size:10.5px\">{{ r.features }}<\/div><\/div>\n          <\/sc-for>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:8px;line-height:1.4\">Our own task inventory for this simulator, grouped the way an operator course is; not a vendor curriculum. Columns: tick when performed this session · drills that exercise the task · features that carry it.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isHelp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.7\">\n          <b>Shortcut keys (representative)<\/b><br />F1 Silence · F2 Acknowledge · F3 Alarm Summary · F4 Point Detail of selected point<br />\n          In an entry field: type a value + Enter to store, Esc to cancel, ▲/▼ arrow keys to raise/lower.<br /><br />\n          <b>Operating rules<\/b><br />SP changes in AUTO only · OP changes in MAN only · CAS setpoint comes from the primary.<br />\n          Auto-selection: AUTO selects SP, MAN selects OP (RAISE/LOWER act on it).<br />\n          Entries outside SPHILM/SPLOLM or OPHILM/OPLOLM are rejected.<br /><br />\n          <b>Alarm response<\/b><br />Silence → Acknowledge → read condition → check trend → check related points → act → verify. Triage floods by priority; shelve only known nuisance alarms.<br /><br />\n          <b>Alarm states (ISA-18.2)<\/b><br />UNACK flashes with horn · ACKED steady · RTNUN inverse flash (returned to normal, not yet acknowledged) · SHLVD / DSUPR / OOSRV never annunciate.<br /><br />\n          <b>Alarm Summary<\/b><br />Location pane filters by unit or equipment (counts are active / unacknowledged) · ACK PAGE acts on the visible rows only · Cnt is the repeat count within 10 min · C marks a stored comment (COMMENT… button) · ALARM HELP opens the rationalisation pane · command <b>KPI<\/b> opens the alarm performance display · Help → Alarm and display philosophy (command <b>PHILOSOPHY<\/b>) explains the colours, states and the limit ladder; switching the colour philosophy (Station menu) needs SUPV and is journaled as a CONFIG change.<br /><br />\n          <b>Plant orientation<\/b><br />Help → Plant orientation — what the units make… (command <b>PROCESS<\/b>, also <b>OVERVIEW<\/b> / <b>PLANT<\/b>) says what this plant makes, the route through it, each unit's hazards and how good the numbers are. PIP reads the same text. Our own prose about a plant that does not exist.<br /><br />\n          <b>PIP cloud credential<\/b><br />Help → PIP cloud credential… (command <b>CLOUDKEY<\/b>, or the KEY button on the Ops Assistant) enters an API key for the cloud coach through a masked field. The key goes only to the local sidecar, is held in its memory for this session, and is never journaled, snapshotted, logged or shown to the model. FORGET KEY returns PIP to the local model. SUPV or above.<br /><br />\n          <b>Instructor station<\/b><br />Command <b>INSTR<\/b>, Drills → Instructor Station…, or the SIM link in the status bar. Needs the instructor or manager password: run control (freeze / step / fast time), snapshots, initial conditions, backtrack, upsets (optionally hidden), plant variables, action journal with replay, live drill assessment.<br /><br />\n          <b>Training and audit<\/b><br />Logon takes an operator name; it goes on every journal entry. Messages flagged CONFIRM count in the status bar (blinking MSG) until confirmed in the Message Summary. Critical changes (trip point, priority, out of service, PID tuning, disabling an asset's alarms, snapshot restore during a drill) need an electronic signature — password and reason. Every configuration change is a CONFIG event: command <b>MOC<\/b> opens the change log. Drills are scored against the 80 % mark ({{ dg.dbPassT }}); commands <b>RECORD<\/b> and <b>COVERAGE<\/b> open the training record and the operator task coverage matrix.\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isPhil }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.6\">\n          <sc-for list=\"{{ dg.phil.sections }}\" as=\"sec\" hint-placeholder-count=\"6\">\n            <div style=\"font-weight:700;margin-top:8px;margin-bottom:2px\">{{ sec.title }}<\/div>\n            <div>{{ sec.body }}<\/div>\n          <\/sc-for>\n          <div style=\"font-weight:700;margin-top:10px;margin-bottom:4px\">The ladder, outermost first<\/div>\n          <sc-for list=\"{{ dg.phil.ladder }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;font-size:11.5px;border-bottom:1px solid #B6B6B2;padding:2px 0\"><div style=\"width:110px;font-weight:700\">{{ r.level }}<\/div><div style=\"width:64px;color:#55524c\">{{ r.param }}<\/div><div style=\"flex:1\">{{ r.meaning }}<\/div><\/div>\n          <\/sc-for>\n          <div style=\"font-weight:700;margin-top:10px;margin-bottom:4px\">Sources (public documents, cited by name; no text is reproduced)<\/div>\n          <sc-for list=\"{{ dg.phil.sources }}\" as=\"src\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;font-size:11.5px;padding:2px 0\"><div style=\"width:230px;font-weight:700\">{{ src.name }}<\/div><div style=\"flex:1;color:#3c3c3c\">{{ src.use }}<\/div><\/div>\n          <\/sc-for>\n          <div style=\"margin-top:10px;display:flex;gap:6px;align-items:center;font-size:11.5px\">\n            <div>Colour philosophy:<\/div>\n            <sc-for list=\"{{ dg.phil.palettes }}\" as=\"pp\" hint-placeholder-count=\"2\">\n              <div style=\"padding:3px 10px;font-weight:700;cursor:pointer;background:{{ pp.bg }};border:2px solid;border-color:{{ pp.bc }}\" onClick=\"{{ pp.cb }}\">{{ pp.label }}<\/div>\n            <\/sc-for>\n            <sc-for list=\"{{ dg.phil.swatches }}\" as=\"sw\" hint-placeholder-count=\"4\">\n              <div style=\"padding:2px 6px;font-size:10px;font-weight:700;background:{{ sw.bg }};color:{{ sw.fg }};border:1px solid {{ sw.bd }}\">{{ sw.label }}<\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"margin-top:4px;font-size:10.5px;color:#55524c\">Switching the colour philosophy is a station-wide display configuration: SUPV or above, recorded as a CONFIG (MOC) change.<\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isCloudKey }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:8px;line-height:1.5\">{{ dg.ck.status }}<\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n          <div style=\"font-size:12px;width:80px\">API key:<\/div>\n          <input type=\"password\" autocomplete=\"new-password\" value=\"{{ dg.ck.key }}\" onChange=\"{{ dg.ck.keyChange }}\" onKeyDown=\"{{ dg.ck.keyKey }}\" placeholder=\"paste the key — it is never shown\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n          <div style=\"font-size:12px;width:80px\">Model:<\/div>\n          <input value=\"{{ dg.ck.model }}\" onChange=\"{{ dg.ck.modelChange }}\" placeholder=\"claude-opus-5 (default)\" style=\"width:220px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap\">\n          <div style=\"padding:5px 14px;font-weight:700;cursor:pointer;background:#B8C4D4;border:2px solid;border-color:#31548F\" onClick=\"{{ dg.ck.save }}\">SAVE KEY · USE CLOUD<\/div>\n          <div style=\"padding:5px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ dg.ck.useLocal }}\">USE LOCAL MODEL<\/div>\n          <div style=\"padding:5px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ dg.ck.forget }}\">FORGET KEY<\/div>\n          <div style=\"padding:5px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ dg.close }}\">CANCEL<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;line-height:1.5\">{{ dg.ck.note }}<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isProcess }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.55\">\n          <div style=\"font-size:10.5px;color:#55524c;margin-bottom:6px\">{{ dg.proc.lede }}<\/div>\n          <sc-for list=\"{{ dg.proc.sections }}\" as=\"sec\" hint-placeholder-count=\"14\">\n            <div style=\"font-weight:700;margin-top:10px;margin-bottom:2px\">{{ sec.title }}<\/div>\n            <div style=\"white-space:pre-wrap\">{{ sec.body }}<\/div>\n          <\/sc-for>\n          <div style=\"font-weight:700;margin-top:12px;margin-bottom:4px\">Published models this plant rests on (cited by name; no text is reproduced)<\/div>\n          <sc-for list=\"{{ dg.proc.sources }}\" as=\"src\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;font-size:11.5px;padding:2px 0\"><div style=\"width:230px;font-weight:700\">{{ src.name }}<\/div><div style=\"flex:1;color:#3c3c3c\">{{ src.use }}<\/div><\/div>\n          <\/sc-for>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isCE }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.5\">\n          <div style=\"font-size:10.5px;color:#55524c;margin-bottom:8px\">{{ dg.ce.note }}<\/div>\n          <div style=\"overflow-x:auto\">\n            <div style=\"display:flex;font-weight:700;font-size:10.5px;color:#55524c;border-bottom:1px solid #B6B6B2;padding-bottom:3px\">\n              <div style=\"width:150px\">Cause<\/div><div style=\"width:120px\">Trip point<\/div><div style=\"width:110px\">Reset<\/div>\n              <sc-for list=\"{{ dg.ce.cols }}\" as=\"col\" hint-placeholder-count=\"7\"><div style=\"width:82px;text-align:center\">{{ col.id }}<\/div><\/sc-for>\n            <\/div>\n            <sc-for list=\"{{ dg.ce.rows }}\" as=\"row\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex;font-size:11.5px;padding:3px 0;border-bottom:1px solid #CFCFCB\">\n                <div style=\"width:150px;font-weight:700\">{{ row.src }} {{ row.cond }}<\/div>\n                <div style=\"width:120px\">{{ row.trip }}<\/div>\n                <div style=\"width:110px\">{{ row.reset }}<\/div>\n                <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"7\"><div style=\"width:82px;text-align:center;font-weight:700\">{{ cell.mark }}<\/div><\/sc-for>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"font-weight:700;margin-top:12px;margin-bo
