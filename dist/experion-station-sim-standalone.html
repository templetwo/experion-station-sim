document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const reader = ds.readable.getReader();

            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"cb5343e5-9259-4461-a501-fb8edfa409d3\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\nhtml,body{margin:0;padding:0;height:100%;background:#8f8f8f;overflow:hidden}\n*{box-sizing:border-box}\na{color:#1a4a7a;text-decoration:none}a:hover{color:#0a3a6a;text-decoration:underline}\ninput,select,button{font-family:Tahoma,Verdana,'Segoe UI',sans-serif}\n::-webkit-scrollbar{width:14px;height:14px;background:#D4D0C8}\n::-webkit-scrollbar-thumb{background:#B4B0A8;border:2px solid #D4D0C8}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position:fixed;inset:0;display:flex;flex-direction:column;font:12px Tahoma,Verdana,'Segoe UI',sans-serif;background:#D4D0C8;color:#000;font-variant-numeric:tabular-nums\" sc-camel-on-mouse-move=\"{{ rootMove }}\" sc-camel-on-mouse-up=\"{{ rootUp }}\">\n\n<div style=\"display:flex;align-items:center;gap:2px;padding:1px 4px;border-bottom:1px solid #9a968e;user-select:none\">\n  <sc-for list=\"{{ menus }}\" as=\"m\" hint-placeholder-count=\"5\">\n    <div style=\"position:relative\">\n      <div style=\"padding:3px 9px;cursor:default;background:{{ m.bg }};color:{{ m.fg }}\" sc-camel-on-click=\"{{ m.toggle }}\">{{ m.name }}<\u002Fdiv>\n      <sc-if value=\"{{ m.open }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;top:100%;left:0;z-index:800;min-width:230px;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF;box-shadow:3px 3px 6px rgba(0,0,0,0.35);padding:2px\">\n          <sc-for list=\"{{ m.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <sc-if value=\"{{ it.sep }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"height:1px;background:#9a968e;margin:3px 6px\"><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ it.label }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:4px 18px;cursor:default;white-space:nowrap\" style-hover=\"background:#31548F;color:#FFFFFF\" sc-camel-on-click=\"{{ it.cb }}\">{{ it.label }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <sc-if value=\"{{ showBadge }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"font-size:10px;color:#5c5850;padding-right:4px\">INDEPENDENT TRAINING SIMULATOR — representative of Experion® conventions · not a Honeywell product<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:stretch;gap:3px;padding:3px 4px;border-bottom:1px solid #9a968e;user-select:none;flex-wrap:nowrap\">\n  <sc-for list=\"{{ tbtns }}\" as=\"b\" hint-placeholder-count=\"8\">\n    <sc-if value=\"{{ b.sep }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:1px;background:#9a968e;margin:1px 2px\"><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ b.label }}\" hint-placeholder-val=\"{{ false }}\">\n      <div title=\"{{ b.title }}\" style=\"padding:4px 8px;background:{{ b.bg }};border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF;font-size:11px;font-weight:700;color:#2c2c2c;cursor:pointer;white-space:nowrap;display:flex;align-items:center\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;background:#C8C4BC\" sc-camel-on-click=\"{{ b.cb }}\">{{ b.label }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:2px solid #9a968e;user-select:none\">\n  <div style=\"font-size:11px;color:#3c3c3c\">Command:<\u002Fdiv>\n  <input value=\"{{ cmdVal }}\" sc-camel-on-change=\"{{ onCmd }}\" sc-camel-on-key-down=\"{{ onCmdKey }}\" spellcheck=\"false\" style=\"width:170px;padding:3px 5px;font-size:12px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\">\n  <div style=\"width:270px;padding:4px 6px;background:#C9C5BD;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;font-size:11px;color:#7a1a00;font-weight:700;height:24px;overflow:hidden;white-space:nowrap\">{{ msgTxt }}<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;padding:0 6px;background:{{ al.bg }};color:{{ al.fg }};border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;font-size:12px;font-weight:700;height:24px;overflow:hidden;white-space:nowrap;cursor:pointer\" sc-camel-on-click=\"{{ al.click }}\">{{ al.txt }}<\u002Fdiv>\n  <div style=\"display:flex;gap:3px;align-items:center;font-size:10px;font-weight:700\">\n    <div style=\"padding:2px 6px;background:#FF0000;color:#FFFFFF;border:1px solid #7a0000\">U {{ cU }}<\u002Fdiv>\n    <div style=\"padding:2px 6px;background:{{ hcol }};color:#000000;border:1px solid #7a6a00\">H {{ cH }}<\u002Fdiv>\n    <div style=\"padding:2px 6px;background:#00D8D8;color:#000000;border:1px solid #006a6d\">L {{ cL }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1;display:flex;align-items:stretch;overflow:hidden;background:#BFBFBF\" sc-camel-on-mouse-down=\"{{ closeMenus }}\">\n<div style=\"flex:1;position:relative;overflow:hidden;min-width:0\">\n\n<sc-if value=\"{{ isG1 }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Unit 01 Graphic\" style=\"position:absolute;inset:0;display:flex;flex-direction:column\">\n<div style=\"display:flex;align-items:center;gap:3px;padding:4px 8px;background:#C4C1BA;border-bottom:1px solid #9a968e;user-select:none\">\n  <sc-for list=\"{{ utabs }}\" as=\"u\" hint-placeholder-count=\"3\">\n    <div style=\"padding:3px 14px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid;border-color:{{ u.bc }};background:{{ u.bg }}\" sc-camel-on-click=\"{{ u.cb }}\">{{ u.label }}<\u002Fdiv>\n  <\u002Fsc-for>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"font-size:10px;color:#6a665e\">CONTINUOUS TRAIN — TANK / REACTOR / HX / FLASH DRUM<\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box th:2.5;fill:none\"><\u002Fpath>\n\n  <rect x=\"490\" y=\"368\" width=\"180\" height=\"198\" fill=\"none\" stroke=\"#7a7a7a\" stroke-width=\"3\"><\u002Frect>\n  <rect x=\"500\" y=\"310\" width=\"160\" height=\"250\" rx=\"10\" fill=\"#CDCDCD\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\u002Frect>\n  <rect x=\"565\" y=\"284\" width=\"30\" height=\"26\" fill=\"#CDCDCD\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\u002Frect>\n  <path d=\"M580,310 V440 M558,440 H602 M564,455 H596\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <text x=\"505\" y=\"586\" style=\"font:700 10px Tahoma;fill:#55524c\">R-201 REACTOR (JACKETED)<\u002Ftext>\n  <text x=\"516\" y=\"250\" style=\"font:700 15px Tahoma;fill:#CC0000;opacity:{{ gfx.rTripOp }}\">▲ HI-TEMP TRIP<\u002Ftext>\n  <text x=\"64\" y=\"140\" style=\"font:700 12px Tahoma;fill:#CC0000;opacity:{{ gfx.ovfOp }}\">▲ HI-HI TRIP<\u002Ftext>\n\n  <path d=\"M368,640 H396\" style=\"stroke:#4a6a8a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <path d=\"M444,640 H470 V530 H490\" style=\"stroke:#4a6a8a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <text x=\"330\" y=\"644\" style=\"font:700 10px Tahoma;fill:#4a6a8a\">CWS<\u002Ftext>\n  <path d=\"M670,530 H710 V640 H748\" style=\"stroke:#4a6a8a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <polygon points=\"742,635 752,640 742,645\" fill=\"#4a6a8a\"><\u002Fpolygon>\n  <text x=\"756\" y=\"644\" style=\"font:700 10px Tahoma;fill:#4a6a8a\">CWR<\u002Ftext>\n\n  <path d=\"M660,390 H750\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <rect x=\"750\" y=\"360\" width=\"130\" height=\"60\" fill=\"#CDCDCD\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\u002Frect>\n  <path d=\"M750,390 L775,372 L800,408 L825,372 L850,408 L880,390\" style=\"stroke:#6a6a6a;stroke-width:1.6;fill:none\"><\u002Fpath>\n  <text x=\"752\" y=\"356\" style=\"font:700 10px Tahoma;fill:#55524c\">E-301<\u002Ftext>\n  <path d=\"M815,420 V470 M815,518 V552\" style=\"stroke:#8a6a3a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <text x=\"790\" y=\"568\" style=\"font:700 10px Tahoma;fill:#8a6a3a\">HTM<\u002Ftext>\n\n  <path d=\"M880,390 H1060\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <rect x=\"1060\" y=\"270\" width=\"120\" height=\"280\" rx=\"16\" fill=\"#CDCDCD\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\u002Frect>\n  <rect x=\"1062\" y=\"{{ gfx.drumY }}\" width=\"116\" height=\"{{ gfx.drumH }}\" fill=\"#93A8B8\"><\u002Frect>\n  <text x=\"1064\" y=\"264\" style=\"font:700 10px Tahoma;fill:#55524c\">V-401 FLASH DRUM<\u002Ftext>\n  <text x=\"1186\" y=\"264\" style=\"font:700 12px Tahoma;fill:#CC0000;opacity:{{ gfx.psvOp }}\">▲ PSV LIFTED<\u002Ftext>\n\n  <path d=\"M1120,270 V150 H1226\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <path d=\"M1274,150 H1352\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <polygon points=\"1346,145 1356,150 1346,155\" fill=\"#4a4a4a\"><\u002Fpolygon>\n  <text x=\"1300\" y=\"142\" style=\"font:700 10px Tahoma;fill:#4a4a4a\">VENT<\u002Ftext>\n  <path d=\"M1120,550 V620 H1226\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <path d=\"M1274,620 H1352\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\u002Fpath>\n  <polygon points=\"1346,615 1356,620 1346,625\" fill=\"#4a4a4a\"><\u002Fpolygon>\n  <text x=\"1290\" y=\"612\" style=\"font:700 10px Tahoma;fill:#4a4a4a\">PRODUCT<\u002Ftext>\n\n  <sc-for list=\"{{ vlist }}\" as=\"v\" hint-placeholder-count=\"5\">\n    <g transform=\"translate({{ v.x }},{{ v.y }}) rotate({{ v.rot }})\">\n      <polygon points=\"-16,-11 -16,11 0,0\" fill=\"{{ v.fill }}\" stroke=\"#3a3a3a\" stroke-width=\"1.6\"><\u002Fpolygon>\n      <polygon points=\"16,-11 16,11 0,0\" fill=\"{{ v.fill }}\" stroke=\"#3a3a3a\" stroke-width=\"1.6\"><\u002Fpolygon>\n    <\u002Fg>\n    <text x=\"{{ v.tx }}\" y=\"{{ v.ty }}\" style=\"font:10px Tahoma;fill:#3a3a3a\">{{ v.label }} {{ v.pos }}<\u002Ftext>\n  <\u002Fsc-for>\n\n  <sc-for list=\"{{ gvList =\"flex:1;text-align:center;padding:3px 0;font-size:10.5px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ fp.detail }}\">DETAIL<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 8px 6px 8px;font-size:10px;color:#55524c;display:flex;gap:8px\"><div>{{ fp.modeLine }}<\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><div style=\"font-weight:700;color:#31548F\">{{ fp.initT }}<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-for>\n\n<sc-if value=\"{{ db.on }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;top:8px;right:10px;z-index:850;background:#41608A;color:#FFFFFF;padding:5px 10px;display:flex;gap:12px;align-items:center;border:1px solid #22344e;box-shadow:2px 2px 8px rgba(0,0,0,0.4)\">\n    <div style=\"font-size:11px;font-weight:700\">DRILL IN PROGRESS · {{ db.tm }}<\u002Fdiv>\n    <div style=\"font-size:10px;padding:2px 8px;background:#D4D0C8;color:#000;font-weight:700;cursor:pointer\" sc-camel-on-click=\"{{ db.end }}\">END<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ dg.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;z-index:900;background:rgba(30,30,30,0.18)\">\n  <div style=\"position:absolute;left:50%;top:12%;transform:translateX(-50%);width:{{ dg.w }}px;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #5E5E5E #5E5E5E #FFFFFF;box-shadow:6px 6px 16px rgba(0,0,0,0.45)\">\n    <div style=\"display:flex;align-items:center;background:#41608A;color:#FFFFFF;padding:4px 8px\">\n      <div style=\"font-weight:700;font-size:12px;flex:1\">{{ dg.title }}<\u002Fdiv>\n      <div style=\"padding:1px 7px;font-weight:700;cursor:pointer;background:#D4D0C8;color:#000;border:1px solid #FFFFFF\" sc-camel-on-click=\"{{ dg.close }}\">✕<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:12px;max-height:70vh;overflow-y:auto\">\n\n      <sc-if value=\"{{ dg.isLogon }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Current security level: <b>{{ secT }}<\u002Fb><\u002Fdiv>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n          <div style=\"font-size:12px\">Password:<\u002Fdiv>\n          <input type=\"password\" value=\"{{ dg.pw }}\" sc-camel-on-change=\"{{ dg.pwChange }}\" sc-camel-on-key-down=\"{{ dg.pwKey }}\" style=\"width:150px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\">\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.pwGo }}\">ENTER<\u002Fdiv>\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.signOff }}\">SIGN OFF<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#55524c;line-height:1.5\">Station-based security. Training defaults: <b>oper<\u002Fb>, <b>supv<\u002Fb>, <b>engr<\u002Fb>, <b>mngr<\u002Fb>. Sign Off drops to View Only. Tuning and trip-point changes require ENGR or above; alarm disable requires MNGR.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isShelve }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Shelve alarm: <b>{{ dg.shelfTag }}<\u002Fb><\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-bottom:10px\">\n          <sc-for list=\"{{ dg.durs }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <div style=\"padding:5px 14px;font-weight:700;cursor:pointer;background:{{ d.bg }};border:2px solid;border-color:{{ d.bc }}\" sc-camel-on-click=\"{{ d.cb }}\">{{ d.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:10px\">\n          <div style=\"font-size:12px\">Reason:<\u002Fdiv>\n          <input value=\"{{ dg.reason }}\" sc-camel-on-change=\"{{ dg.reasonChange }}\" placeholder=\"e.g. nuisance during washdown\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\">\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.shelfGo }}\">SHELVE<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">Shelving auto-acknowledges and silences the alarm and removes it from the main summary until the period expires or it is unshelved. A record is kept in the Message Summary. Shelve nuisance alarms only — not a substitute for fixing them.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isDrills }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:10px;line-height:1.5\">A fault is injected 8–15 s after start (no announcement). Respond as an operator: <b>Silence → Ack → read condition → check trend → act → verify<\u002Fb>. Scored on detection, action, trip avoidance, stabilization, and diagnosis.<\u002Fdiv>\n        <sc-for list=\"{{ dg.drills }}\" as=\"d\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;padding:6px 8px;border:1px solid #B6B6B2;background:#CFCFCB;margin-bottom:4px\">\n            <div style=\"width:36px;font-weight:700\">{{ d.id }}<\u002Fdiv>\n            <div style=\"flex:1;font-size:12px\">{{ d.name }}<\u002Fdiv>\n            <div style=\"padding:3px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ d.cb }}\">START<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;justify-content:flex-end;margin-top:6px\">\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.randomDrill }}\">RANDOM DRILL<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isInstr }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;font-weight:700;margin-bottom:6px\">MALFUNCTION INJECTION<\u002Fdiv>\n        <sc-for list=\"{{ dg.faults }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:3px 4px;font-size:12px\">\n            <input type=\"checkbox\" checked=\"{{ f.on }}\" sc-camel-on-change=\"{{ f.cb }}\">\n            <div style=\"flex:1\">{{ f.label }}<\u002Fdiv>\n            <div style=\"font-size:10px;color:#55524c\">{{ f.state }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"height:1px;background:#9a968e;margin:10px 0\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px\">\n          <div style=\"font-size:12px;font-weight:700\">SIM SPEED:<\u002Fdiv>\n          <sc-for list=\"{{ dg.speeds }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"padding:3px 12px;font-weight:700;cursor:pointer;background:{{ s.bg }};border:2px solid;border-color:{{ s.bc }}\" sc-camel-on-click=\"{{ s.cb }}\">{{ s.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"padding:4px 12px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.resetGo }}\">RESET PROCESS<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isDebrief }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-weight:700;font-size:13px;margin-bottom:2px\">{{ dg.dbName }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:#55524c;margin-bottom:10px\">{{ dg.dbReason }}<\u002Fdiv>\n        <sc-for list=\"{{ dg.dbRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;padding:3px 6px;font-size:12px;border-bottom:1px solid #B6B6B2\"><div style=\"width:280px;color:#3c3c3c\">{{ r.k }}<\u002Fdiv><div style=\"font-weight:700;color:{{ r.fg }}\">{{ r.v }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ dg.dbAsk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;font-size:12px;font-weight:700\">{{ dg.dbQ }}<\u002Fdiv>\n          <sc-for list=\"{{ dg.dbOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"margin-top:4px;padding:5px 8px;font-size:12px;cursor:pointer;background:{{ o.bg }};border:2px solid;border-color:{{ o.bc }}\" sc-camel-on-click=\"{{ o.cb }}\">{{ o.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;justify-content:flex-end;margin-top:10px\">\n            <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.dbSubmit }}\">SUBMIT<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ dg.dbScored }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;display:flex;align-items:baseline;gap:12px\"><div style=\"font-size:26px;font-weight:700\">{{ dg.dbScore }}/100<\u002Fdiv><div style=\"font-size:14px;font-weight:700;color:#31548F\">{{ dg.dbGrade }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isHelp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.7\">\n          <b>Shortcut keys (representative)<\u002Fb><br>F1 Silence · F2 Acknowledge · F3 Alarm Summary · F4 Point Detail of selected point<br>\n          In an entry field: type a value + Enter to store, Esc to cancel, ▲/▼ arrow keys to raise/lower.<br><br>\n          <b>Operating rules<\u002Fb><br>SP changes in AUTO only · OP changes in MAN only · CAS setpoint comes from the primary.<br>\n          Auto-selection: AUTO selects SP, MAN selects OP (RAISE/LOWER act on it).<br>\n          Entries outside SPHILM/SPLOLM or OPHILM/OPLOLM are rejected.<br><br>\n          <b>Alarm response<\u002Fb><br>Silence → Acknowledge → read condition → check trend → check related points → act → verify. Triage floods by priority; shelve only known nuisance alarms.\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.7\">\n          <b>Operator Station Training Simulator<\u002Fb><br>\n          An independent, browser-based training aid reproducing the conventions of an Experion PKS Console/Flex Station: HMIWeb-style gray graphics, four alarm priorities (Journal/Low/High/Urgent), PID faceplates with MAN/AUTO/CAS, Point Detail with Experion parameter names (K, T1, T2 in minutes; SPHILM/OPHILM; SHEDHOLD…), alarm shelving, event journal, trends, and three live units: a continuous train with an exothermic CSTR, a semi-batch polymerization reactor with an SCM-driven sequence, and a fired-heater fixed-bed reactor. A rule-based Ops Assistant panel provides live diagnosis and coaching.<br><br>\n          Not a Honeywell product; contains no Honeywell software, artwork, or manual text. High-priority yellow, summary columns, and key legends are representative defaults — sites configure these. Experion® is a trademark of Honeywell International Inc.\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isReset }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:12px\">Reset the process to steady state? Alarms and events will be cleared.<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.resetYes }}\">RESET<\u002Fdiv>\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ dg.close }}\">CANCEL<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ dg.isSysMenu }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\">\n          <sc-for list=\"{{ dg.sysLinks }}\" as=\"l\" hint-placeholder-count=\"6\">\n            <div style=\"padding:10px;font-weight:700;font-size:12px;cursor:pointer;text-align:center;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" sc-camel-on-click=\"{{ l.cb }}\">{{ l.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ asst.on }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Ops Assistant\" style=\"width:302px;flex:none;display:flex;flex-direction:column;background:#CCC8C0;border-left:2px solid #9a968e;min-height:0\">\n  <div style=\"display:flex;align-items:center;gap:6px;padding:5px 8px;background:#41608A;color:#FFFFFF\">\n    <div style=\"font-weight:700;font-size:12px;flex:1\">OPS ASSISTANT<\u002Fdiv>\n    <div style=\"font-size:9px;border:1px solid #FFFFFF;padding:1px 5px\">TRAINING AID<\u002Fdiv>\n    <div style=\"padding:1px 7px;font-weight:700;cursor:pointer;background:#D4D0C8;color:#000;border:1px solid #FFFFFF\" sc-camel-on-click=\"{{ asst.close }}\">✕<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;min-height:0\">\n    <div style=\"padding:6px 8px 2px 8px;font-size:10px;font-weight:700;color:#55524c\">LIVE DIAGNOSIS<\u002Fdiv>\n    <sc-for list=\"{{ asst.issues }}\" as=\"i\" hint-placeholder-count=\"3\">\n      <div style=\"margin:4px 8px;background:#D4D0C8;border:1px solid #9a968e\">\n        <div style=\"display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:pointer\" sc-camel-on-click=\"{{ i.click }}\">\n          <div style=\"font-size:9px;font-weight:700;padding:1px 5px;background:{{ i.sevBg }};color:{{ i.sevFg }}\">{{ i.sev }}<\u002Fdiv>\n          <div style=\"flex:1;font-size:11px;font-weight:700;line-height:1.25\">{{ i.title }}<\u002Fdiv>\n          <div style=\"font-size:10px;color:#55524c\">{{ i.arrow }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ i.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:2px 8px 8px 8px;border-top:1px solid #B6B6B2\">\n            <div style=\"font-size:10.5px;color:#3c3c3c;line-height:1.45;margin:4px 0 6px 0\">{{ i.why }}<\u002Fdiv>\n            <sc-for list=\"{{ i.steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0\">\n                <div style=\"font-size:10.5px;font-weight:700;width:14px\">{{ st.n }}<\u002Fdiv>\n                <div style=\"flex:1;font-size:10.5px;line-height:1.4\">{{ st.txt }}<\u002Fdiv>\n                <sc-if value=\"{{ st.hasGo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:9px;font-weight:700;padding:2px 7px;cursor:pointer;background:#B8C4D4;border:1px solid #6E6E6E\" sc-camel-on-click=\"{{ st.go }}\">GO<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"padding:8px 8px 2px 8px;font-size:10px;font-weight:700;color:#55524c;border-top:1px solid #B6B6B2;margin-top:6px\">ASK ABOUT A PROBLEM<\u002Fdiv>\n    <div style=\"padding:4px 8px\">\n      <input value=\"{{ asst.q }}\" sc-camel-on-change=\"{{ asst.qChange }}\" placeholder=\"e.g. why is my SP entry rejected?\" style=\"width:100%;padding:4px 6px;font-size:11px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\">\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 6px 8px\">\n      <sc-for list=\"{{ asst.chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div style=\"font-size:9.5px;padding:2px 7px;cursor:pointer;background:#D4D0C8;border:1px solid #9a968e\" style-hover=\"background:#B8C4D4\" sc-camel-on-click=\"{{ c.cb }}\">{{ c.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-for list=\"{{ asst.hits }}\" as=\"h\" hint-placeholder-count=\"1\">\n      <div style=\"margin:4px 8px;padding:6px 8px;background:#EDEDE8;border:1px solid #9a968e\">\n        <div style=\"font-size:11px;font-weight:700;margin-bottom:3px\">{{ h.t }}<\u002Fdiv>\n        <div style=\"font-size:10.5px;line-height:1.45;color:#3c3c3c\">{{ h.a }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ asst.hitsNone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin:4px 8px;font-size:10.5px;color:#55524c\">No matching topic — try the chips above, or Help → Shortcut Keys.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <di n&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showBadge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = { tk:0, blink:true, unit:'U1', assist:true, assistSel:'', assistQ:'', display:'graphic', hist:[{d:'graphic'}], hi:0, sec:'OPER', msg:'', msgT:0, cmd:'', fps:[], entry:null, entryText:'', sel:null, selAlm:null, aud:true, silenced:true, shelfView:'MAIN', evtFilter:'ALL', detailTag:'FIC102', detailTab:'main', tg:'TG01', span:15, menu:null, dlg:null, dlgPw:'', dlgReason:'', debAns:-1, drill:null, drag:null, speed:1 };\n\n  componentDidMount(){\n    if(!this.L) this.initSim();\n    this.iv = setInterval(()=>this.tick(), 500);\n    this.kd = (e)=>this.onKey(e);\n    window.addEventListener('keydown', this.kd);\n  }\n  componentWillUnmount(){ clearInterval(this.iv); window.removeEventListener('keydown', this.kd); }\n\n  initSim(){\n    const now = Date.now();\n    const P = (o)=>Object.assign({kind:'pid',mode:'AUTO',modeAttr:'OPERATOR',T2:0,ophilm:100,oplolm:0,opexhi:105,opexlo:-5,safeop:0,shed:'SHEDHOLD',badPv:false,init:false,dec:1,_as:{}}, o);\n    this.L = {\n      FI100: {kind:'ind',tag:'FI100',desc:'UNIT FEED SUPPLY FLOW',eu:'M3/H',lo:0,hi:150,dec:1,pv:60,cm:'CM0_FI100',alm:{},_as:{}},\n      LIC101:P({tag:'LIC101',desc:'FEED TANK TK-101 LEVEL',eu:'%',lo:0,hi:100,pv:50,sp:50,op:50,K:1.5,T1:3,act:'DIR',sphilm:95,splolm:5,slave:'FIC102',cm:'CM1_LIC101',alm:{PVLL:[10,'Urgent'],PVLO:[20,'Low'],PVHI:[80,'High'],PVHH:[90,'Urgent']}}),\n      FIC102:P({tag:'FIC102',desc:'TK-101 OUTLET / REACTOR FEED FLOW',eu:'M3/H',lo:0,hi:120,pv:60,sp:60,op:50,K:0.4,T1:0.15,act:'REV',mode:'CAS',master:'LIC101',sphilm:110,splolm:0,cm:'CM2_FIC102',alm:{PVLL:[5,'Urgent'],PVLO:[15,'Low'],PVHI:[95,'High'],PVHH:[110,'Urgent']}}),\n      P101:  {kind:'motor',tag:'P101',desc:'FEED PUMP P-101',eu:'',lo:0,hi:1,dec:0,pv:1,cm:'CM2A_P101',      PI214: {kind:'ind',tag:'PI214',desc:'R-202 VAPOR PRESSURE',eu:'KPA',lo:0,hi:600,dec:0,pv:100,cm:'CM13_PI214',alm:{PVHI:[420,'High'],PVHH:[520,'Urgent']},_as:{}},\n      LI215: {kind:'ind',tag:'LI215',desc:'R-202 BATCH LEVEL',eu:'%',lo:0,hi:100,dec:1,pv:12,cm:'CM14_LI215',alm:{PVHI:[85,'High']},_as:{}},\n      M202:  {kind:'motor',tag:'M202',desc:'R-202 AGITATOR',eu:'',lo:0,hi:1,dec:0,pv:1,cm:'CM15_M202',run:true,cmd:'START',lock:0,trip:false,alm:{},_as:{}},\n      FIC310:P({tag:'FIC310',desc:'R-310 FRESH FEED FLOW',eu:'M3/H',lo:0,hi:80,pv:40,sp:40,op:50,K:0.4,T1:0.15,act:'REV',sphilm:70,splolm:0,cm:'CM16_FIC310',alm:{PVLO:[10,'Low'],PVHI:[65,'High']}}),\n      TIC311:P({tag:'TIC311',desc:'H-310 PREHEATER OUTLET TEMP',eu:'DEG C',lo:0,hi:500,dec:0,pv:320,sp:320,op:40,K:1.0,T1:2.5,T2:0.2,act:'REV',sphilm:380,splolm:150,cm:'CM17_TIC311',alm:{PVLO:[260,'Low'],PVHI:[360,'High'],PVHH:[400,'Urgent']}}),\n      TI312: {kind:'ind',tag:'TI312',desc:'R-310 CATALYST BED HOTSPOT',eu:'DEG C',lo:0,hi:600,dec:0,pv:380,cm:'CM18_TI312',alm:{PVHI:[440,'High'],PVHH:[480,'Urgent']},_as:{}},\n      FIC313:P({tag:'FIC313',desc:'R-310 QUENCH FLOW',eu:'M3/H',lo:0,hi:40,pv:10,sp:10,op:25,K:0.5,T1:0.2,act:'REV',sphilm:38,splolm:0,cm:'CM19_FIC313',alm:{PVLO:[4,'Low'],PVLL:[2,'Urgent']}})\n    };\n    for(const k in this.L){ const l=this.L[k]; if(l.kind==='pid'){ l.I=l.op; l.lastPv=l.pv; } }\n    this.V = { FV102:{pos:.5,stuck:false,fail:0}, TV202:{pos:.74,stuck:false,fail:1}, TV301:{pos:.5,stuck:false,fail:0}, PV401:{pos:.4,stuck:false,fail:1}, LV401:{pos:.73,stuck:false,fail:0}, MV211:{pos:0,stuck:false,fail:0}, JV213:{pos:.45,stuck:false,fail:0}, FV310:{pos:.5,stuck:false,fail:0}, FV311:{pos:.4,stuck:false,fail:0}, QV313:{pos:.25,stuck:false,fail:1} };\n    this.P = { t:now, qin:60, tankL:50, flow:60, conc:1, rT:150, Tj:40, Tcw:8, hxT:180, drumL:45, drumP:600, foulF:1, up:0, trips:{}, faults:{}, faultT:{}, b:{phase:'IDLE',pt:0,Cm:0,lvl:12,T:25,Tj:20,mf:0}, h:{f:40,pre:320,bed:380,q:10} };\n    this.alarms=[]; this.events=[]; this.msgs=[]; this.hist={}; this.aid=1; this.eid=1;\n    ['FI100','LIC101','FIC102','TIC201','TIC202','TIC301','LIC401','PIC401','FIC211','TIC212','TIC213','PI214','LI215','FIC310','TIC311','TI312','FIC313'].forEach(t=>this.hist[t]=[]);\n    this.addEvent('SYSTEM','STN01','OPERATOR STATION STARTED — SIMULATION MODE','','');\n  }\n\n  // ---------- helpers ----------\n  rank(l){ return {VIEW:0,OPER:1,SUPV:2,ENGR:3,MNGR:4}[l]??0; }\n  can(need){ if(this.rank(this.state.sec)>=this.rank(need)) return true; this.msgZone('HIGHER SECURITY LEVEL REQUIRED ('+need+')'); return false; }\n  msgZone(t){ this.setState({msg:t, msgT:this.P.t}); }\n  fmt(v,dec){ return (v==null||isNaN(v))?'—':Number(v).toFixed(dec); }\n  fT(ms){ const d=new Date(ms); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2); }\n  fD(ms){ const d=new Date(ms); const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return ('0'+d.getDate()).slice(-2)+'-'+M[d.getMonth()]+'-'+String(d.getFullYear()).slice(-2); }\n  addEvent(type,src,desc,oldV,newV){ this.events.unshift({id:this.eid++, t:this.P?this.P.t:Date.now(), type, src, desc, oldV:oldV===undefined?'':String(oldV), newV:newV===undefined?'':String(newV), lvl:this.state.sec}); if(this.events.length>600) this.events.length=600; }\n  prioColor(p){ return {Urgent:'#FF0000', High:(this.props.highColor??'#FFE000'), Low:'#00D8D8', Journal:'#909090'}[p]; }\n  prioDark(p){ return {Urgent:'#A00000', High:'#7a6400', Low:'#00696d', Journal:'#666666'}[p]; }\n\n  raiseA(src,cond,prio,val,eu,desc){\n    if(prio==='Journal'){ this.addEvent('ALARM',src,cond+' (JOURNAL) '+this.fmt(val,1),'',''); return; }\n    const key=src+'.'+cond; let a=this.alarms.find(x=>x.key===key);\n    if(a){ if(!a.active){ a.active=true; a.ack=false; a.t=this.P.t; a.val=val; if(!a.shelved){ this.hornNew(); } this.addEvent('ALARM',src,cond+' ALARM '+prio.toUpperCase(),'',this.fmt( (P.up/120) + n(0.6) + (F.surge?50:0);\n    if(F.surge && P.t-P.faultT.surge>480000){ F.surge=false; }\n    if(P.trips.ovf) qin=0;\n    P.qin=qin;\n    // valves\n    const tgt = { FV102:(P.trips.rx?0:L.FIC102.op/100), TV202:L.TIC202.op/100, TV301:L.TIC301.op/100, PV401:L.PIC401.op/100, LV401:L.LIC401.op/100, MV211:(P.trips.batch?0:L.FIC211.op/100), JV213:(P.trips.batch?0:L.TIC213.op/100), FV310:L.FIC310.op/100, FV311:(P.trips.bed?0:L.TIC311.op/100), QV313:L.FIC313.op/100 };\n    for(const k in V){ const v=V[k]; let g=F.air?v.fail:tgt[k]; if(v.stuck) g=v.pos; v.pos += (g-v.pos)*dt/3; v.pos=Math.max(0,Math.min(1,v.pos)); }\n    // pump + flow\n    const pumpF = L.P101.run?1:0;\n    const flowSS = 120*V.FV102.pos*pumpF*Math.sqrt(Math.max(P.tankL,0)/50);\n    P.flow += (flowSS-P.flow)*dt/4; if(P.flow<0.05&&flowSS===0)P.flow=0;\n    // tank\n    P.tankL += (qin-P.flow)*0.0023148*dt; P.tankL=Math.max(0,Math.min(100,P.tankL));\n    if(P.tankL>=98 && !P.trips.ovf){ P.trips.ovf=true; this.raiseA('TK-101','HIHI TRIP','Urgent',P.tankL,'%','FEED TANK OVERFLOW PROTECTION — FEED ISOLATED'); this.dTrip(); }\n    if(P.trips.ovf && P.tankL<90){ P.trips.ovf=false; this.clearA('TK-101','HIHI TRIP'); }\n    if(P.tankL<2 && L.P101.run){ this.tripMotor('P101','CAVITATION — LOW SUCTION LEVEL'); }\n    // reactor\n    P.conc += (Math.min(P.flow/60,1.6)-P.conc)*dt/45; P.conc=Math.max(0,P.conc);\n    let eEff = F.cool ? ((P.t-P.faultT.cool>300000)?0.75:0) : 1;\n    const e = 0.9*Math.sqrt(Math.max(V.TV202.pos,0))*eEff;\n    const TjSS = P.Tcw*e + P.rT*(1-e);\n    P.Tj += (TjSS-P.Tj)*dt/15;\n    const Qr = 213700*Math.exp(-1600/(P.rT+273))*P.conc*(F.rxn?1.15:1);\n    P.rT += (Qr - 30*(P.rT-P.Tj) - 0.2*P.flow*(P.rT-40) - 2*(P.rT-25))*dt/20000;\n    if(P.rT>=185 && !P.trips.rx){ P.trips.rx=true; this.raiseA('R-201','HI TEMP TRIP','Urgent',P.rT,'DEG C','REACTOR HIGH TEMPERATURE TRIP — FEED VALVE CLOSED'); this.dTrip(); }\n    if(P.trips.rx && P.rT<160){ P.trips.rx=false; this.clearA('R-201','HI -201 temperature rising — runaway risk',why:'Reaction heat rises exponentially with temperature while jacket cooling is only linear. Act before the 185 °C trip.',steps:[{t:'Check TV-202 position against TIC202 output.',go:gFp('TIC202')},{t:'Cut feed — FIC102 to MAN, reduce OP.',go:gFp('FIC102')},{t:'Track the exotherm on trend TG01.',go:gTg('TG01')}]});\n    if(!P.trips.bed && P.h.bed>435) out.push({id:'risk.bed',sev:'WARN',title:'R-310 bed hotspot climbing ('+Math.round(P.h.bed)+' °C)',why:'The bed exotherm grows with temperature; the fuel trip operates at 480 °C.',steps:[{t:'Raise quench flow FIC313.',go:gFp('FIC313')},{t:'Lower the preheater SP at TIC311.',go:gFp('TIC311')}]});\n    if(!L.M202.trip && !L.M202.run && (P.b.phase==='FEED'||P.b.Cm>15)) out.push({id:'risk.acc',sev:'URGENT',title:'Agitator stopped — monomer accumulating',why:'With no mixing the reaction nearly stops but feed keeps charging monomer, which will react all at once when mixing resumes.',steps:[{t:'HOLD the sequence / stop the FIC211 feed.',go:gFp('FIC211')},{t:'Restart M-202 only after the feed is stopped.',go:gFp('M202')}]});\n    for(const k in L){ const l=L[k]; if(l.badPv) out.push({id:'badpv.'+k,sev:'WARN',title:k+' PV is BAD — loop shed to MAN',why:'The transmitter signal failed. Shed option '+l.shed+' put the loop in MAN holding the last good output (crosshatch on the graphic).',steps:[{t:'Keep the loop in MAN; control on related measurements.',go:gFp(k)},{t:'Review the input on Point Detail.',go:gDet(k)},{t:'Have maintenance check the transmitter — the PV restores here when the fault clears.'}]}); }\n    const vmap={FIC102:'FV102',TIC202:'TV202',TIC301:'TV301',PIC401:'PV401',LIC401:'LV401',FIC211:'MV211',TIC213:'JV213',FIC310:'FV310',TIC311:'FV311',FIC313:'QV313'};\n    if(!P.faults.air){ for(const k in vmap){ const l=L[k], v=V[vmap[k]]; if(l&&v&&v.stuck&&Math.abs(l.op/100-v.pos)>0.12) out.push({id:'stuck.'+k,sev:'WARN',title:vmap[k]+' not following '+k+' output',why:'The controller output is moving but the valve (and PV) is not responding — classic stiction or a jammed actuator.',steps:[{t:'Compare OP vs PV on the trend.',go:gTg(this.unitOf(k)==='U2'?'TG04':this.unitOf(k)==='U3'?'TG05':'TG01')},{t:'Put '+k+' in MAN and stroke the output firmly (±10%).',go:gFp(k)},{t:'If it will not move, flag the valve for maintenance.'}]}); } }\n    for(const k in L){ const l=L[k]; if(l.kind==='pid'&&l.mode!=='MAN'&&!l.badPv&&(l.op>=l.ophilm-0.2||l.op<=l.oplolm+0.2)){ const inAlm=Object.keys(l.alm).some(c=>l._as[c]); if(inAlm) out.push({id:'sat.'+k,sev:'WARN',title:k+' output saturated at '+Math.round(l.op)+'%',why:'The controller has no more range — the disturbance exceeds this loop. Windup is prevented, but the PV cannot be held.',steps:[{t:'Address the disturbance at its source (feed rate, heat input).'},{t:'Consider MAN with a sensible fixed output while conditions recover.',go:gFp(k)}]}); } }\n    for(const k in L){ const l=L[k]; if(l.kind==='pid'&&l.slave&&l.init) out.push({id:'init.'+k,sev:'INFO',title:k+' in INITMAN — cascade broken',why:'Its secondary '+l.slave+' is not in CAS, so the primary is initialized and tracks for a bumpless return.',steps:[{t:'Return '+l.slave+' to CAS when ready.',go:gFp(l.slave)}]}); }\n    const un=this.alarms.filter(a=>!a.ack&&!a.shelved).length;\n    if(un>=6) out.push({id:'flood',sev:'WARN',title:'Alarm flood — '+un+' unacknowledged',why:'Do not blind-acknowledge. Triage by priority: Urgent first, then High. Look for a common cause.',steps:[{t:'Silence the horn (F1).'},{t:'Work the summary Urgent-first.',go:()=>gAlm()},{t:'Check for a common cause: pump, air, cooling.'}]});\n    if(P.faults.air) out.push({id:'air',sev:'URGENT',title:'Instrument air loss — valves at fail positions',why:'All control valves have driven to their fail-safe states; controllers are ineffective until air returns.',steps:[{t:'Recognize the common cause — do not chase individual loops.'},{t:'Note which valves failed open vs closed on the graphics.'},{t:'Triage alarms by priority.',go:()=>gAlm()}]});\n    if(L.PIC401.mode==='MAN'&&P.drumP>700) out.push({id:'man401',sev:'WARN',title:'PIC401 in MAN while pressure rises',why:'The vent will not move in MAN.',steps:[{t:'Put PIC401 back in AUTO.',go:gFp('PIC401')}]});\n    for(const mt of ['P101','M202']){ const m=L[mt]; if(!m.trip&&!m.run&&m.lock>0) out.push({id:'lock.'+mt,sev:'INFO',title:(mt==='P101'?'P-101':'M-202')+' restart lockout — '+Math.ceil(m.lock)+' s remaining',why:'A lockout timer protects the motor after a stop or trip.',steps:[{t:'Wait for the lockout, then START from the faceplate.',go:gFp(mt)}]}); }\n    const sevR={URGENT:2,WARN:1,INFO:0};\n    out.sort((a,b)=>sevR[b.sev]-sevR[a.sev]);\n    if(!out.length) out.push({id:'ok',sev:'INFO',title:'No abnormal conditions detected',why:'All loops near setpoint, no trips, no bad measurements. Use the Drills menu to practice an upset, or start a batch on Unit 02.',steps:[{t:'Review trends for slow drift.',go:gTg('TG01')},{t:'Start a scored drill.',go:()=>this.setState({dlg:{type:'drills'}})}]});\n    return out.slice(0,8);\n  }\n  topics(){ return [\n    {k:['op','output','invalid mode','man','change op'],t:'Why can I not change OP?',a:'OP entry is only permitted in MAN. In AUTO the PID computes OP; in CAS the SP comes from the primary. Click MAN on the faceplate first — the Message Zone shows INVALID MODE when the rule blocks you.'},\n    {k:['sp','setpoint','rejected','limit','entry'],t:'SP entry rejected',a:'SP must be inside SPLOLM…SPHILM and the loop must be in AUTO (CAS setpoints are primary- or program-driven). Out-of-range entries are rejected with the limits shown in the Message Zone. Limits live on Point Detail → Loop Tune (ENGR to change).'},\n    {k:['initman','init','cascade','track','bkcal'],t:'What is INITMAN?',a:'When a cascade secondary leaves CAS, the primary initializes (INITMAN) and its output tracks the secondary SP via back-calculation, so the return to CAS is bumpless. Fix: put the secondary back in CAS.'},\n    {k:['crosshatch','bad','badpv','hatch','stale','quality'],t:'PV shows crosshatch',a:'Crosshatch means bad or uncertain PV quality. A BADPV alarm raises and the PID sheds per its option — default SHEDHOLD: MODE to MAN, output held at the last good value. Keep it in MAN until the input is repaired.'},\n    {k:['shelve','shelving','nuisance','hide'],t:'How do I shelve an alarm?',a:'Select the alarm row, press SHELVE, pick a duration and reason. Shelving auto-acknowledges and silences it and removes it from the summary until the timer expires (or UNSHELVE). A record stays in the Message Summary. Shelve nuisance alarms only.'},\n    {k:['pump','start','won','lockout','permissive','agitator','motor'],t:'Motor will not start',a:'Check the Message Zone: a start needs its permissive met (P-101 needs tank level above 5%) and the restart lockout expired (30 s after a trip, 15 s after a stop). Failed starts raise CMDFAIL.'},\n    {k:['color','colours','flash','red','yellow','cyan','blink'],t:'What do alarm colors mean?',a:'Urgent = red, High = yellow (representative), Low = cyan. Flashing = unacknowledged; steady = acknowledged with the cause still present; inverse flashing = returned to normal but never acknowledged. Journal alarms only log to the journal.'},\n    {k:['ack','silence','acknowledge','horn'],t:'Ack vs Silence',a:'SILENCE (F1) stops the horn only. ACK (F2) claims the alarm: flashing stops and it goes steady while the cause remains, or drops off the summary if it already returned to normal. Sequence: Silence → Ack → read → trend → act → verify.'},\n    {k:['tuning','tune','gain','t1','t2','engr','action'],t:'Cannot change tuning',a:'K, T1, T2, limits and control action need ENGR level or above: Station menu → Security Level, password engr. Experion PID uses overall gain K with T1 and T2 in minutes.'},\n    {k:['batch','sequence','scm','phase','stuck','hold','charge'],t:'Batch sequence control',a:'SCM202 on Unit 02 runs CHARGE → HEATUP → FEED → REACT → COOL → DRAIN. START begins a batch; HOLD stops the monomer feed without losing the phase; ABORT forces COOL. During FEED the FIC211 SP is program-driven (MODEATTR = PROGRAM).'},\n    {k:['raise','lower','arrow','keys','select'],t:'RAISE / LOWER keys',a:'The raise/lower buttons act on the auto-selected target: SP in AUTO, OP in MAN (dashed highlight on the faceplate). In an entry field, arrow keys nudge the typed value; Enter stores, Esc cancels.'},\n    {k:['drill','score','practice','scenario'],t:'Running drills',a:'Drills menu → Start Drill. A fault injects unannounced 8–15 s later. You are scored on time to acknowledge, correct action, trip avoidance, stabilization and diagnosis; the debrief shows your timeline.'},\n    {k:['runaway','exotherm','cooling','reactor','temperature','hot'],t:'Reactor temperature runaway',a:'Reaction heat grows exponentially with temperature; cooling only linearly. If cooling is lost: maximize what cooling remains, CUT FEED to remove the heat source, and never raise SP to chase the PV. Trips: R-201 at 185 °C, R-202 at 110 °C, R-310 fuel at 480 °C.'},\n    {k:['assistant','guide','coach','panel'],t:'About this assistant',a:'It watches live process state and lists detected issues with step-by-step guidance (GO jumps to the right display). It is a training aid — on a real console, follow site procedures and your shift supervisor.'}\n  ]; }\n  pids(dt){\n    const L=this.L;\n    const casMap = { FIC102:(op)=>op*1.2, TIC202:(op)=>10+0.6*op, TIC213:(op)=>op*1.3 };\n    const invMap = { FIC102:(sp)=>sp/1.2, TIC202:(sp)=>(sp-10)/0.6, TIC213:(sp)=>sp/1.3 };\n    for(const k of ['LIC101','TIC201','TIC212','FIC102','TIC202','TIC213','TIC301','LIC401','PIC401','FIC211','FIC310','TIC311','FIC313']){\n      const l=L[k]; if(l.kind!=='pid') continue;\n      if(l.slave){ const s=L[l.slave]; l.init = s.mode!=='CAS';\n        if(l.init){ l.op = Math.max(l.oplolm,Math.min(l.ophilm, invMap[l.slave](s.sp))); l.I=l.op; l.lastPv=l.pv; continue; } }\n      if(l.mode==='CAS' && l.master){ const m=L[l.master]; l.sp = Math.max(l.splolm,Math.min(l.sphilm, casMap[k](m.op))); }\n      if(l.mode==='MAN' || l.badPv){ l.I=l.op; l.lastPv=l.pv; continue; }\n      const span=l.hi-l.lo;\n      const e=((l.act==='DIR'?(l.pv-l.sp):(l.sp-l.pv))/span)*100;\n      const Pt=l.K*e;\n      if(l.T1>0) l.I += l.K*e*dt/(l.T1*60);\n      const dpv=((l.pv-l.lastPv)/span)*100;\n      const D=(l.T2>0)? -l.K*l.T2*60*dpv/dt : 0;\n      let op=Pt+l.I+D;\n      if(op>l.ophilm){ op=l.ophilm; l.I=op-Pt-D; }\n      if(op<l.oplolm){ op=l.oplolm; l.I=op-Pt-D; }\n      l.op=op; l.lastPv=l.pv;\n    }\n  }\n\n  applyShed(l){\n    if(l.shed==='NOSHED') return;\n    const old=l.mode; l.mode='MAN';\n    if(l.shed==='SHEDLOW') l.op=l.opexlo; else if(l.shed==='SHEDHIGH') l.op=l.opexhi; else if(l.shed==='SHEDSAFE') l.op=l.safeop;\n    if(old!=='MAN') this.addEvent('SYSTEM',l.tag,'BAD PV — SHED '+l.shed.replace('SHED','')+' · MODE '+old+' → MAN','','');\n  }\n\n  scan(){\n    const L=this.L;\n    for(const k in L){ const l=L[k];\n      for(const cond in l.alm){\n        const [tp,prio]=l.alm[cond]; const span=(l.hi-l.lo)||1; const db=span*0.01;\n        let act=l._as[cond]||false; let v=l.pv;\n        if(cond==='PVHI'||cond==='PVHH'){ if(v>=tp) act=true; else if(v<tp-db) act=false; }\n        else if(cond==='PVLO'||cond==='PVLL'){ if(v<=tp) act=true; else if(v>tp+db) act=false; }\n        else if(cond==='DEVHI'){ const d=l.pv-l.sp; if(d>=tp) act=true; else if(d<tp-db) act=false; }\n        if(act && !l._as[cond]) this.raiseA(l.tag,cond,prio,v,l.eu,l.desc);\n        if(!act && l._as[cond]) this.clearA(l.tag,cond);\n        l._as[cond]=act;\n      }\n    }\n    for(const mt of ['P101','M202']){ const m=L[mt];\n      if(m.trip && !m._as.TRIP){ this.raiseA(mt,'TRIP','Urgent',0,'',m.desc+' — '+(m.tripWhy||'TRIP')); m._as.TRIP=true; }\n      if(!m.trip && m._as.TRIP){ this.clearA(mt,'TRIP'); m._as.TRIP=false; }\n    }\n  }\n\n  shelfScan(){\n    for(const a of [...this.alarms]){\n      if(a.shelved && this.P.t>=a.until){\n        a.shelved=false;\n        if(a.active){ a.ack=false; this.addEvent('SYSTEM',a.tag,'SHELVE PERIOD EXPIRED — ALARM RE-ANNUNCIATED','',''); this.hornNew(); }\n        else this.alarms=this.alarms.filter(x=>x!==a);\n      }\n    }\n  }\n\n  tripMotor(tag,why){\n    const m=this.L[tag]; if(!m||!m.run) return;\n    m.run=false; m.trip=true; m.tripWhy=why; m.lock=30;\n    this.addEvent('SYSTEM',tag,(tag==='P101'?'PUMP':'AGITATOR')+' TRIPPED — '+why,'RUN','STOP');\n  }\n\n  // ---------- drills ----------\n  drillDefs(){\n    return [\n      {id:'D1',name:'Flow transmitter failure (FIC102)',fault:'xmtr',rel:['FIC102'],act:'ACK',stable:'contain',\n       q:'FIC102 PV went BAD. What did the PID do (shed option SHEDHOLD)?',opts:['Shed to MAN and held OP at the last good value','Drove OP to SAFEOP and stayed in AUTO','Closed the valve immediately','Kept controlling on the bad PV'],a:0},\n      {id:'D2',name:'Feed surge — tank level rising',fault:'surge',rel:['LIC101','FIC102','TK-101'],act:'OUTFLOW',stable:'alarms',peak:'tankL',\n       q:'Best first control action for rising level?',opts:['Increase outlet flow (raise FIC102/LIC101 output)','Shelve the level alarms','Stop the feed pump','Lower the outlet flow setpoint'],a:0},\n      {id:'D3',name:'Feed pump trip',fault:'pump',rel:['P101','FIC102','LIC101','TK-101'],act:'START',stable:'alarms',\n       q:'Correct restart sequence?',opts:['FIC102 to MAN / OP 0, START P-101 after lockout, restore AUTO','Immediately drive FIC102 OP to 100%','Repeatedly press START until it holds','Shelve the TRIP alarm and wait'],a:0},\n      {id:'D4',name:'Cooling water loss — exotherm',fault:'cool',rel:['TIC201','TIC202','R-201'],act:'CUTFEED',stable:'alarms',peak:'rT',\n       q:'Reactor temperature climbing with no cooling. Best action?',opts:['Cut feed (FIC102 to MAN, OP low) to remove reaction heat','Raise TIC201 SP to reduce the error','Put TIC202 in MAN with OP 0','Acknowledge the alarms and monitor'],a:0},\n      {id:'D6',name:'Stuck coolant valve (stiction)',fault:'stick',rel:['TIC202','TIC201'],act:'MAN202',stable:'alarms',peak:'rT',\n       q:'TIC202 OP moves but jacket temperature does not. Root cause?',opts:['Control valve TV-202 stuck (stiction)','Transmitter failure on the jacket RTD','Wrong control action configured','Cascade initialization error'],a:0},\n      {id:'D9',name:'Flash drum pressure high',fault:'vap',rel:['PIC401','V-401'],act:'AUTO401',stable:'alarms',peak:'drumP',\n       q:'PIC401 did not respond to rising pressure. Why?',opts:['It had been left in MAN — the vent never moved','The vent valve was stuck','The setpoint was too high','Transmitter drift'],a:0},\n      {id:'D11',name:'Agitator trip during semi-batch feed (Unit 02)',fault:'agit',needBatch:true,when:(P)=>P.b.phase==='FEED'&&P.b.Cm>8,rel:['M202','TIC212','R-202','FIC211','SCM202'],act:'CUTMONO',stable:'alarms',peak:'T212',\n       q:'The agitator tripped during monomer feed. Why is restarting it later dangerous?',opts:['Accumulated monomer reacts at once when mixing resumes — stop feed and max cooling before restart','It will trip the breaker again','The jacket cannot heat without agitation','It pulls a vacuum in the reactor'],a:0},\n      {id:'D12',name:'Catalyst activity surge — bed overtemp (Unit 03)',fault:'bedact',rel:['TI312','TIC311','FIC313','R-310'],act:'QUENCH',stable:'alarms',peak:'bed',\n       q:'Bed temperature climbing at constant preheat. Correct response?',opts:['Raise quench flow and/or lower the preheater SP — the fuel trips at 480 °C','Raise the preheater SP to burn off deposits','Put FIC313 in MAN and close the quench','Increase feed to sweep the heat out'],a:0}\n    ];\n  }\n  startDrill(d){\n    if(this.state.drill){ this.msgZone('DRILL ALREADY ACTIVE'); return; }\n    if(d.needBatch && this.P.b.phase==='IDLE') this.seqCmd('START',true);\n    const delay=8000+Math.random()*7000;\n    this.setState({drill:{def:d,t0:this
