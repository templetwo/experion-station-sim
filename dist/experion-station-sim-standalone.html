ILL IN PROGRESS · {{ db.tm }}<\/div>\n    <div style=\"font-size:10px;padding:2px 8px;background:#D4D0C8;color:#000;font-weight:700;cursor:pointer\" onClick=\"{{ db.end }}\">END<\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ dg.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;z-index:900;background:rgba(30,30,30,0.18)\">\n  <div style=\"position:absolute;left:50%;top:12%;transform:translateX(-50%);width:{{ dg.w }}px;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #5E5E5E #5E5E5E #FFFFFF;box-shadow:6px 6px 16px rgba(0,0,0,0.45)\">\n    <div style=\"display:flex;align-items:center;background:#41608A;color:#FFFFFF;padding:4px 8px\">\n      <div style=\"font-weight:700;font-size:12px;flex:1\">{{ dg.title }}<\/div>\n      <div style=\"padding:1px 7px;font-weight:700;cursor:pointer;background:#D4D0C8;color:#000;border:1px solid #FFFFFF\" onClick=\"{{ dg.close }}\">✕<\/div>\n    <\/div>\n    <div style=\"padding:12px;max-height:70vh;overflow-y:auto\">\n\n      <sc-if value=\"{{ dg.isLogon }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Current security level: <b>{{ secT }}<\/b><\/div>\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:8px;line-height:1.5\">{{ dg.logonNote }}<\/div>\n        <sc-if value=\"{{ dg.logonIsOper }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n            <div style=\"font-size:12px;width:66px\">Operator:<\/div>\n            <input value=\"{{ dg.name }}\" onChange=\"{{ dg.nameChange }}\" onKeyDown=\"{{ dg.pwKey }}\" placeholder=\"{{ dg.operCur }}\" style=\"width:150px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n            <div style=\"font-size:11px;color:#55524c\">current: {{ dg.operCur }}<\/div>\n          <\/div>\n        <\/sc-if>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n          <div style=\"font-size:12px;width:66px\">Password:<\/div>\n          <input type=\"password\" value=\"{{ dg.pw }}\" onChange=\"{{ dg.pwChange }}\" onKeyDown=\"{{ dg.pwKey }}\" style=\"width:150px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.pwGo }}\">ENTER<\/div>\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.signOff }}\">SIGN OFF<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;line-height:1.5\">Operator-based security: a name plus a level password. Training defaults: <b>oper<\/b>, <b>supv<\/b>, <b>engr<\/b>, <b>mngr<\/b>. Sign Off drops to View Only. Tuning and trip-point changes require ENGR or above (signed); disabling alarms for an asset requires MNGR (signed).<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isShelve }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Shelve alarm: <b>{{ dg.shelfTag }}<\/b><\/div>\n        <div style=\"display:flex;gap:6px;margin-bottom:10px\">\n          <sc-for list=\"{{ dg.durs }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <div style=\"padding:5px 14px;font-weight:700;cursor:pointer;background:{{ d.bg }};border:2px solid;border-color:{{ d.bc }}\" onClick=\"{{ d.cb }}\">{{ d.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size:12px;margin-bottom:4px\">Reason (required):<\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px\">\n          <sc-for list=\"{{ dg.reasons }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;background:{{ r.bg }};border:2px solid;border-color:{{ r.bc }}\" onClick=\"{{ r.cb }}\">{{ r.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:10px\">\n          <div style=\"font-size:12px\">Detail:<\/div>\n          <input value=\"{{ dg.reason }}\" onChange=\"{{ dg.reasonChange }}\" placeholder=\"free text — required when OTHER is chosen\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.shelfGo }}\">SHELVE<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">A shelved alarm stops annunciating and moves to the SHELVED view until the timer expires or it is unshelved; if the condition is still present when the timer runs out it re-annunciates. Maximum 60 min in this simulator. A record is kept in the Event and Message Summaries. Shelve nuisance alarms only — not a substitute for fixing them.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isComment }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:8px\">Comment on alarm: <b>{{ dg.shelfTag }}<\/b><\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-bottom:6px\">Current: {{ dg.commentCur }}<\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:10px\">\n          <input value=\"{{ dg.reason }}\" onChange=\"{{ dg.reasonChange }}\" onKeyDown=\"{{ dg.commentKey }}\" placeholder=\"what was seen, what was done, who was told\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.commentGo }}\">STORE<\/div>\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.close }}\">CANCEL<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">The comment is stored on the alarm record (shown as C in the summary and in the Alarm Help pane) and written to the Event Summary as an operator event. OPER or above.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isDrills }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:10px;line-height:1.5\">A fault is injected 8–15 s after start (no announcement). Respond as an operator: <b>Silence → Ack → read condition → check trend → act → verify<\/b>. Scored on detection, action, trip avoidance, stabilization, and diagnosis.<\/div>\n        <sc-for list=\"{{ dg.drills }}\" as=\"d\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;padding:6px 8px;border:1px solid #B6B6B2;background:#CFCFCB;margin-bottom:4px\">\n            <div style=\"width:36px;font-weight:700\">{{ d.id }}<\/div>\n            <div style=\"flex:1;font-size:12px\">{{ d.name }}<\/div>\n            <div style=\"padding:3px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ d.cb }}\">START<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"display:flex;justify-content:flex-end;margin-top:6px\">\n          <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.randomDrill }}\">RANDOM DRILL<\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isDebrief }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-weight:700;font-size:13px;margin-bottom:2px\">{{ dg.dbName }}<\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-bottom:10px\">{{ dg.dbReason }}<\/div>\n        <sc-for list=\"{{ dg.dbRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;padding:3px 6px;font-size:12px;border-bottom:1px solid #B6B6B2\"><div style=\"width:280px;color:#3c3c3c\">{{ r.k }}<\/div><div style=\"font-weight:700;color:{{ r.fg }}\">{{ r.v }}<\/div><\/div>\n        <\/sc-for>\n        <sc-if value=\"{{ dg.dbGuideOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:8px;padding:6px 8px;font-size:11.5px;line-height:1.45;color:#1f2a3c;background:#E6E4DE;border:1px solid #B6B6B2\">{{ dg.dbGuide }}<\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ dg.dbAsk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;font-size:12px;font-weight:700\">{{ dg.dbQ }}<\/div>\n          <sc-for list=\"{{ dg.dbOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"margin-top:4px;padding:5px 8px;font-size:12px;cursor:pointer;background:{{ o.bg }};border:2px solid;border-color:{{ o.bc }}\" onClick=\"{{ o.cb }}\">{{ o.label }}<\/div>\n          <\/sc-for>\n          <div style=\"display:flex;justify-content:flex-end;margin-top:10px\">\n            <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.dbSubmit }}\">SUBMIT<\/div>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ dg.dbScored }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px;display:flex;align-items:baseline;gap:12px\"><div style=\"font-size:26px;font-weight:700\">{{ dg.dbScore }}/100<\/div><div style=\"font-size:14px;font-weight:700;color:{{ dg.dbGradeFg }}\">{{ dg.dbGrade }}<\/div><div style=\"font-size:11px;color:#55524c\">{{ dg.dbOper }}<\/div><\/div>\n          <div style=\"font-size:11px;color:#55524c;margin-bottom:6px\">{{ dg.dbPassT }}<\/div>\n          <div style=\"display:flex;padding:3px 6px;font-size:11px;font-weight:700;background:#C8C5BE;border:1px solid #B6B6B2\"><div style=\"width:220px\">Scoring element<\/div><div style=\"width:70px\">Points<\/div><div style=\"flex:1\">Basis<\/div><\/div>\n          <sc-for list=\"{{ dg.dbBreak }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;padding:3px 6px;font-size:12px;border-bottom:1px solid #B6B6B2\"><div style=\"width:220px;color:#3c3c3c\">{{ b.label }}<\/div><div style=\"width:70px;font-weight:700;color:{{ b.fg }}\">{{ b.pts }}<\/div><div style=\"flex:1;color:#55524c\">{{ b.note }}<\/div><\/div>\n          <\/sc-for>\n          <div style=\"font-size:10.5px;color:#55524c;margin-top:6px;line-height:1.4\">Weights 20 / 25 / 20 / 15 / 10 / 10: acknowledge within 30 s scores full marks; the correct action within 3 min scores full marks; alarm load during the drill is measured by the KPI module (≤ 1 per 10 min full marks, ≥ 10 none). 'Trip avoided' covers the drill's own equipment; a trip elsewhere during the drill deducts 10 points each (at most 20). The result is stored in the Training record under the trainee's logon name.<\/div>\n        <\/sc-if>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isEsig }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:6px\">Action: <b>{{ dg.esigDesc }}<\/b><\/div>\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:8px\">Signer: {{ dg.esigWho }} · required level: <b>{{ dg.esigNeed }}<\/b><\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:8px\">\n          <div style=\"font-size:12px;width:70px\">Password:<\/div>\n          <input type=\"password\" value=\"{{ dg.pw }}\" onChange=\"{{ dg.pwChange }}\" onKeyDown=\"{{ dg.esigKey }}\" style=\"width:150px;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:10px\">\n          <div style=\"font-size:12px;width:70px\">Reason:<\/div>\n          <input value=\"{{ dg.reason }}\" onChange=\"{{ dg.reasonChange }}\" onKeyDown=\"{{ dg.esigKey }}\" placeholder=\"required — why this change is made\" style=\"flex:1;padding:3px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n        <\/div>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.esigGo }}\">SIGN<\/div>\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.close }}\">CANCEL<\/div>\n        <\/div>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">An electronic signature re-enters the password for a level at or above the one required and records a reason. The action executes only after a valid signature; the signature, the operator name, the level and the reason are written to the Event Summary, and the change itself appears in the change log (CONFIG). Refused signatures are journaled too.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isRecord }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ dg.recOpers }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;font-size:11.5px;padding:2px 0\"><div style=\"width:140px;font-weight:700\">{{ o.oper }}<\/div><div style=\"flex:1;color:#3c3c3c\">{{ o.txt }}<\/div><\/div>\n        <\/sc-for>\n        <div style=\"display:flex;padding:3px 6px;margin-top:8px;font-size:11px;font-weight:700;background:#C8C5BE;border:1px solid #B6B6B2\"><div style=\"width:130px\">Date / Time<\/div><div style=\"width:110px\">Trainee<\/div><div style=\"flex:1\">Drill<\/div><div style=\"width:60px\">Score<\/div><div style=\"width:90px\">Result<\/div><\/div>\n        <sc-for list=\"{{ dg.recRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"padding:3px 6px;font-size:12px;border-bottom:1px solid #B6B6B2\">\n            <div style=\"display:flex\"><div style=\"width:130px\">{{ r.t }}<\/div><div style=\"width:110px;font-weight:700\">{{ r.oper }}<\/div><div style=\"flex:1\">{{ r.drill }}<\/div><div style=\"width:60px;font-weight:700\">{{ r.score }}<\/div><div style=\"width:90px;font-weight:700;color:{{ r.fg }}\">{{ r.res }}<\/div><\/div>\n            <div style=\"font-size:10.5px;color:#55524c\">{{ r.detail }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <sc-if value=\"{{ dg.recEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 0;font-size:12px;color:#55524c\">No drill has been scored yet this session. Run a drill (Drills menu) and submit the debrief question.<\/div><\/sc-if>\n        <div style=\"font-size:11px;color:#55524c;margin-top:8px;line-height:1.5\">{{ dg.recNote }}<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isCoverage }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:11.5px;color:#3c3c3c;margin-bottom:8px;line-height:1.5\">{{ dg.covSummary }}<\/div>\n        <sc-for list=\"{{ dg.covGroups }}\" as=\"g\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;padding:3px 6px;margin-top:6px;font-size:11px;font-weight:700;background:#C8C5BE;border:1px solid #B6B6B2\"><div style=\"flex:1\">{{ g.name }}<\/div><div>{{ g.count }}<\/div><\/div>\n          <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;padding:2px 6px;font-size:11.5px;border-bottom:1px solid #B6B6B2\"><div style=\"width:22px;font-weight:700;color:{{ r.fg }}\">{{ r.tick }}<\/div><div style=\"width:290px;font-weight:{{ r.fw }};color:{{ r.fg }}\">{{ r.label }}<\/div><div style=\"width:150px;color:#3c3c3c\">{{ r.drills }}<\/div><div style=\"flex:1;color:#55524c;font-size:10.5px\">{{ r.features }}<\/div><\/div>\n          <\/sc-for>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:8px;line-height:1.4\">Our own task inventory for this simulator, grouped the way an operator course is; not a vendor curriculum. Columns: tick when performed this session · drills that exercise the task · features that carry it.<\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isHelp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.7\">\n          <b>Shortcut keys (representative)<\/b><br />F1 Silence · F2 Acknowledge · F3 Alarm Summary · F4 Point Detail of selected point<br />\n          In an entry field: type a value + Enter to store, Esc to cancel, ▲/▼ arrow keys to raise/lower.<br /><br />\n          <b>Operating rules<\/b><br />SP changes in AUTO only · OP changes in MAN only · CAS setpoint comes from the primary.<br />\n          Auto-selection: AUTO selects SP, MAN selects OP (RAISE/LOWER act on it).<br />\n          Entries outside SPHILM/SPLOLM or OPHILM/OPLOLM are rejected.<br /><br />\n          <b>Alarm response<\/b><br />Silence → Acknowledge → read condition → check trend → check related points → act → verify. Triage floods by priority; shelve only known nuisance alarms.<br /><br />\n          <b>Alarm states (ISA-18.2)<\/b><br />UNACK flashes with horn · ACKED steady · RTNUN inverse flash (returned to normal, not yet acknowledged) · SHLVD / DSUPR / OOSRV never annunciate.<br /><br />\n          <b>Alarm Summary<\/b><br />Location pane filters by unit or equipment (counts are active / unacknowledged) · ACK PAGE acts on the visible rows only · Cnt is the repeat count within 10 min · C marks a stored comment (COMMENT… button) · ALARM HELP opens the rationalisation pane · command <b>KPI<\/b> opens the alarm performance display · Help → Alarm and display philosophy (command <b>PHILOSOPHY<\/b>) explains the colours, states and the limit ladder; switching the colour philosophy (Station menu) needs SUPV and is journaled as a CONFIG change.<br /><br />\n          <b>Instructor station<\/b><br />Command <b>INSTR<\/b>, Drills → Instructor Station…, or the SIM link in the status bar. Needs the instructor or manager password: run control (freeze / step / fast time), snapshots, initial conditions, backtrack, upsets (optionally hidden), plant variables, action journal with replay, live drill assessment.<br /><br />\n          <b>Training and audit<\/b><br />Logon takes an operator name; it goes on every journal entry. Messages flagged CONFIRM count in the status bar (blinking MSG) until confirmed in the Message Summary. Critical changes (trip point, priority, out of service, PID tuning, disabling an asset's alarms, snapshot restore during a drill) need an electronic signature — password and reason. Every configuration change is a CONFIG event: command <b>MOC<\/b> opens the change log. Drills are scored against the 80 % mark ({{ dg.dbPassT }}); commands <b>RECORD<\/b> and <b>COVERAGE<\/b> open the training record and the operator task coverage matrix.\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isPhil }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.6\">\n          <sc-for list=\"{{ dg.phil.sections }}\" as=\"sec\" hint-placeholder-count=\"6\">\n            <div style=\"font-weight:700;margin-top:8px;margin-bottom:2px\">{{ sec.title }}<\/div>\n            <div>{{ sec.body }}<\/div>\n          <\/sc-for>\n          <div style=\"font-weight:700;margin-top:10px;margin-bottom:4px\">The ladder, outermost first<\/div>\n          <sc-for list=\"{{ dg.phil.ladder }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;font-size:11.5px;border-bottom:1px solid #B6B6B2;padding:2px 0\"><div style=\"width:110px;font-weight:700\">{{ r.level }}<\/div><div style=\"width:64px;color:#55524c\">{{ r.param }}<\/div><div style=\"flex:1\">{{ r.meaning }}<\/div><\/div>\n          <\/sc-for>\n          <div style=\"font-weight:700;margin-top:10px;margin-bottom:4px\">Sources (public documents, cited by name; no text is reproduced)<\/div>\n          <sc-for list=\"{{ dg.phil.sources }}\" as=\"src\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;font-size:11.5px;padding:2px 0\"><div style=\"width:230px;font-weight:700\">{{ src.name }}<\/div><div style=\"flex:1;color:#3c3c3c\">{{ src.use }}<\/div><\/div>\n          <\/sc-for>\n          <div style=\"margin-top:10px;display:flex;gap:6px;align-items:center;font-size:11.5px\">\n            <div>Colour philosophy:<\/div>\n            <sc-for list=\"{{ dg.phil.palettes }}\" as=\"pp\" hint-placeholder-count=\"2\">\n              <div style=\"padding:3px 10px;font-weight:700;cursor:pointer;background:{{ pp.bg }};border:2px solid;border-color:{{ pp.bc }}\" onClick=\"{{ pp.cb }}\">{{ pp.label }}<\/div>\n            <\/sc-for>\n            <sc-for list=\"{{ dg.phil.swatches }}\" as=\"sw\" hint-placeholder-count=\"4\">\n              <div style=\"padding:2px 6px;font-size:10px;font-weight:700;background:{{ sw.bg }};color:{{ sw.fg }};border:1px solid {{ sw.bd }}\">{{ sw.label }}<\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"margin-top:4px;font-size:10.5px;color:#55524c\">Switching the colour philosophy is a station-wide display configuration: SUPV or above, recorded as a CONFIG (MOC) change.<\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;line-height:1.7\">\n          <b>Operator Station Training Simulator<\/b><br />\n          An independent, browser-based training aid reproducing the conventions of an Experion PKS Console/Flex Station: HMIWeb-style gray graphics, four alarm priorities (Journal/Low/High/Urgent), PID faceplates with MAN/AUTO/CAS, Point Detail with Experion parameter names (K, T1, T2 in minutes; SPHILM/OPHILM; SHEDHOLD…), alarm shelving, event journal, trends, and three live units: a continuous train with an exothermic CSTR, a semi-batch polymerization reactor with an SCM-driven sequence, and a fired-heater fixed-bed reactor. A rule-based Ops Assistant panel provides live diagnosis and coaching.<br /><br />\n          Not a Honeywell product; contains no Honeywell software, artwork, or manual text. High-priority yellow, summary columns, and key legends are representative defaults — sites configure these. Experion® is a trademark of Honeywell International Inc.\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isReset }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;margin-bottom:12px\">Reset the process to steady state? Alarms and events will be cleared.<\/div>\n        <div style=\"display:flex;gap:6px;justify-content:flex-end\">\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.resetYes }}\">RESET<\/div>\n          <div style=\"padding:5px 18px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ dg.close }}\">CANCEL<\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ dg.isSysMenu }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px\">\n          <sc-for list=\"{{ dg.sysLinks }}\" as=\"l\" hint-placeholder-count=\"6\">\n            <div style=\"padding:10px;font-weight:700;font-size:12px;cursor:pointer;text-align:center;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ l.cb }}\">{{ l.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n      <\/sc-if>\n\n    <\/div>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<\/div>\n\n<sc-if value=\"{{ asst.on }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Ops Assistant\" style=\"width:302px;flex:none;display:flex;flex-direction:column;background:#CCC8C0;border-left:2px solid #9a968e;min-height:0\">\n  <div style=\"display:flex;align-items:center;gap:6px;padding:5px 8px;background:#41608A;color:#FFFFFF\">\n    <div style=\"font-weight:700;font-size:12px;flex:1\">OPS ASSISTANT<\/div>\n    <div style=\"font-size:9px;border:1px solid #FFFFFF;padding:1px 5px\">TRAINING AID<\/div>\n    <div style=\"padding:1px 7px;font-weight:700;cursor:pointer;background:#D4D0C8;color:#000;border:1px solid #FFFFFF\" onClick=\"{{ asst.close }}\">✕<\/div>\n  <\/div>\n  <div style=\"flex:1;overflow-y:auto;min-height:0\">\n    <div style=\"padding:6px 8px 2px 8px;font-size:10px;font-weight:700;color:#55524c\">LIVE DIAGNOSIS<\/div>\n    <sc-for list=\"{{ asst.issues }}\" as=\"i\" hint-placeholder-count=\"3\">\n      <div style=\"margin:4px 8px;background:#D4D0C8;border:1px solid #9a968e\">\n        <div style=\"display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:pointer\" onClick=\"{{ i.click }}\">\n          <div style=\"font-size:9px;font-weight:700;padding:1px 5px;background:{{ i.sevBg }};color:{{ i.sevFg }}\">{{ i.sev }}<\/div>\n          <div style=\"flex:1;font-size:11px;font-weight:700;line-height:1.25\">{{ i.title }}<\/div>\n          <div style=\"font-size:10px;color:#55524c\">{{ i.arrow }}<\/div>\n        <\/div>\n        <sc-if value=\"{{ i.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:2px 8px 8px 8px;border-top:1px solid #B6B6B2\">\n            <div style=\"font-size:10.5px;color:#3c3c3c;line-height:1.45;margin:4px 0 6px 0\">{{ i.why }}<\/div>\n            <sc-for list=\"{{ i.steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0\">\n                <div style=\"font-size:10.5px;font-weight:700;width:14px\">{{ st.n }}<\/div>\n                <div style=\"flex:1;font-size:10.5px;line-height:1.4\">{{ st.txt }}<\/div>\n                <sc-if value=\"{{ st.hasGo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:9px;font-weight:700;padding:2px 7px;cursor:pointer;background:#B8C4D4;border:1px solid #6E6E6E\" onClick=\"{{ st.go }}\">GO<\/div>\n                <\/sc-if>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n    <\/sc-for>\n    <div style=\"padding:8px 8px 2px 8px;font-size:10px;font-weight:700;color:#55524c;border-top:1px solid #B6B6B2;margin-top:6px\">ASK ABOUT A PROBLEM<\/div>\n    <div style=\"padding:4px 8px\">\n      <input value=\"{{ asst.q }}\" onChange=\"{{ asst.qChange }}\" placeholder=\"e.g. why is my SP entry rejected?\" style=\"width:100%;padding:4px 6px;font-size:11px;background:#FFFFFF;border:2px solid;border-color:#6E6E olor:#55524c\">|<\/div><div style=\"font-weight:700;color:{{ cUnFg }}\">UNACK {{ cUn }}<\/div><div style=\"color:#55524c\">OOS {{ cOos }}<\/div>\n  <sc-if value=\"{{ msgOn }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"cursor:pointer;padding:1px 8px;font-weight:700;background:{{ msgBg }};color:{{ msgFg }};border:1px solid #7a1a00\" onClick=\"{{ msgGo }}\">MSG {{ cMsg }}<\/div><\/sc-if>\n  <sc-if value=\"{{ disOn }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:1px 8px;font-weight:700;background:#C08000;color:#000000;border:1px solid #6E4000\" title=\"{{ disT }}\">ALARMS DISABLED: {{ cDis }}<\/div><\/sc-if>\n  <div style=\"flex:1\"><\/div>\n  <div style=\"cursor:pointer;color:#31548F;font-weight:700\" onClick=\"{{ instrOpen }}\">SIM {{ spdT }}<\/div>\n  <div style=\"cursor:pointer;font-weight:700\" onClick=\"{{ audCb }}\">HORN: {{ audT }}<\/div>\n  <div style=\"color:#55524c\">|<\/div>\n  <div style=\"cursor:pointer;padding:1px 10px;font-weight:700;background:#B8C4D4;border:1px solid #6E6E6E\" onClick=\"{{ secCb }}\">{{ secT }}<\/div>\n  <div>{{ dateT }}<\/div><div style=\"font-weight:700;width:60px\">{{ timeT }}<\/div>\n<\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props=\"{&quot;highColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;#FFE000&quot;,&quot;#FFA500&quot;],&quot;default&quot;:&quot;#FFE000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Representative defaults&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;representative&quot;,&quot;isa101&quot;],&quot;default&quot;:&quot;representative&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Representative defaults&quot;},&quot;audible&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showBadge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot NK',depth:2,unit:'U1',tags:['FI100','LIC101','P101','TK-101']},\n      {id:'R-201',label:'R-201 REACTOR',depth:2,unit:'U1',tags:['FIC102','TIC201','AI205','TIC202','R-201']},\n      {id:'V-401',label:'V-401 FLASH DRUM',depth:2,unit:'U1',tags:['TIC301','LIC401','PIC401','V-401']},\n      {id:'U2',label:'UNIT 02 BATCH',depth:1,unit:'U2'},\n      {id:'R-202',label:'R-202 BATCH RX',depth:2,unit:'U2',tags:['FIC211','TIC212','TIC213','PI214','LI215','TI216','M202','R-202','SCM202']},\n      {id:'U3',label:'UNIT 03 FIRED RX',depth:1,unit:'U3'},\n      {id:'H-310',label:'H-310 PREHEATER',depth:2,unit:'U3',tags:['FIC310','TIC311','TI314','TI315','AI316','H-310']},\n      {id:'R-310',label:'R-310 FIXED BED',depth:2,unit:'U3',tags:['TI312','FIC313','R-310']}\n    ];\n  }\n  assetOf(tag){ const n=this.assetTree().find(x=>x.tags&&x.tags.includes(tag)); return n?n.id:null; }\n  assetMatch(nodeId,tag){\n    if(!nodeId||nodeId==='PLANT') return true;\n    const n=this.assetTree().find(x=>x.id===nodeId); if(!n) return true;\n    if(n.tags) return n.tags.includes(tag);\n    return this.unitOf(tag)===n.unit;\n  }\n  // active = annunciated live alarms (UNACK/ACKED); unack = UNACK + RTNUN, matching the status-bar counter\n  assetCounts(){\n    const out={}; const recs=this.alarmEngine.list();\n    for(const n of this.assetTree()){\n      let active=0, unack=0;\n      for(const a of recs){ if(!this.assetMatch(n.id,a.tag)) continue; if(a.state==='UNACK'||a.state==='ACKED') active++; if(a.state==='UNACK'||a.state==='RTNUN') unack++; }\n      out[n.id]={active,unack};\n    }\n    return out;\n  }\n  // Live value column: the point PV (PV−SP for DEVHI); equipment trips read the model variable they protect.\n  liveValueOf(a){\n    const l=this.L[a.tag], P=this.P;\n    if(l){ if(l.kind==='motor') return l.run?1:0; return a.cond==='DEVHI'?(l.pv-l.sp):l.pv; }\n    if(a.tag==='H-310' && a.cond==='TUBE SKIN TRIP') return Math.max(P.h.ts1,P.h.ts2);\n    return ({'TK-101':P.tankL,'R-201':P.rT,'V-40 he raise/rtn/ack log (ESS.Kpi; exida and alarm-performance-analyser thresholds, RESOURCES 2.7, 2.8) ----------\n  kpiSpans(){ return [10,30,60,0]; }   // minutes; 0 = whole session\n  kpiMetrics(span){\n    if(span==null) span=this.state.kpiSpan;\n    const t1=this.P.t, t0=span>0?t1-span*60000:this.t0;\n    // stale threshold scaled for a training session: 10 min standing instead of the 24 h plant figure\n    return ESS.Kpi.computeMetrics(this.alarmLog,{t0,t1,staleAfterMs:10*60000});\n  }\n  // Alarm Tracker (RESOURCES 2.2): raises per minute per unit over the last `mins` minutes\n  trackerLanes(mins){\n    const t1=this.P.t, t0=t1-mins*60000, lanes={U1:[],U2:[],U3:[]};\n    for(const u in lanes) lanes[u]=new Array(mins).fill(0);\n    for(const e of this.alarmLog){ if(e.type!=='raise'||e.prio==='Journal'||e.t<t0||e.t>t1) continue; const u=this.unitOf(e.tag); if(!lanes[u]) continue; const i=Math.min(mins-1,Math.floor((e.t-t0)/60000)); lanes[u][i]++; }\n    return lanes;\n  }\n  // Dynamic Alarm Suppression map (Experion Alarming PIN, RESOURCES 2.2): a live trigger parks its consequential alarms in DSUPR.\n  // Dynamic Alarm Suppression map: trigger alarm key -> consequential alarm keys\n  // (Experion Alarming PIN, RESOURCES 2.2). Deviation from the v2 plan: the\n  // plan names FIC211 PVLO under M202 TRIP, but the monomer feed idles at zero\n  // flow outside the FEED phase, so a fixed PVLO would be a standing alarm.\n  // The agitator trip therefore suppresses the jacket-temperature consequence\n  // (TIC213 PVHI) until state-based limits arrive in B4.\n  dasRules(){\n    return {\n      'P101.TRIP':['FIC102.PVLO','FIC102.PVLL','LIC101.PVHI','LIC101.PVHH'],\n      'TK-101.HIHI TRIP':['LIC101.PVHI','LIC101.PVHH'],\n      'R-201.HI TEMP TRIP':['TIC201.DEVHI','TIC202.DEVHI','TIC202.PVHI','FIC102.PVLO','FIC102.PVLL'],\n      'R-202.HI TEMP TRIP':['TIC212.PVHI','TIC212.PVHH'],\n      'M202.TRIP':['TIC213.PVHI'],\n      'R-310.HI TEMP TRIP':['TIC311.PVLO']\n    };\n  }\n  // A source under a disabled asset is parked BEFORE the engine sees the raise: a condition with no record yet is created\n  // straight in OOSRV from the raise arguments, and the engine's raise on an OOSRV record only marks the condition live\n  // (no ALARM descriptor, so no horn, no ALARM journal line, no KPI alarm-log row); re-enable then annunciates it.\n  raiseA(src,cond,prio,val,eu,desc){\n    const spec={tag:src,cond,prio,subprio:this.subprioOf(src,cond),val,eu,desc,tripValue:this.tripPointOf(src,cond)};\n    const dis=this.assetDisabled(src); if(dis) this.parkDisabled(src,cond,'ASSET:'+dis,spec);\n    this.logAlarmEvents(this.alarmEngine.raise(Object.assign({t:this.P.t},spec)));\n  }\n  clearA(src,cond,val){ this.logAlarmEvents(this.alarmEngine.rtn(src,cond,this.P.t,val)); }\n  alarmTick(){ this.logAlarmEvents(this.alarmEngine.tick(this.P.t)); }\n  shelfScan(){ this.alarmTick(); }\n  // Journal every engine descriptor through addEvent: ALARM on entry, RTN on return (two events per alarm, RESOURCES 2.1)\n  // plus ACK / SHELVE / UNSHELVE / SUPPRESS / OOS. The horn re-arms only when something lands in UNACK.\n  logAlarmEvents(evs){\n    let horn=false;\n    for(const e of evs){\n      const P=e.prio.toUpperCase(), sub=e.journal?'':' '+e.subprio;\n      switch(e.type){\n        case 'ALARM': this.addEvent('ALARM',e.tag,e.cond+' ALARM '+P+sub+(e.journal?' (JOURNAL)':'')+(e.escalated?' ESCALATED':'')+(e.folded?' REPEAT':''),'',this.fmt(e.val,1)); break;\n        case 'RTN': if(e.from!=='OOSRV') this.addEvent('ALARM',e.tag,e.cond+' RETURN TO NORMAL','',this.fmt(e.val,1)); break;\n        case 'ACK': this.addEvent('OPERATOR',e.tag,e.cond+' ACKNOWLEDGED',e.from,e.to); break;\n        case 'SHELVE': this.addEvent('OPERATOR',e.tag,e.cond+' SHELVED '+Math.round(e.durationMs/60000)+' MIN — '+e.reason,e.from,'SHLVD'); break;\n        case 'UNSHELVE': if(e.auto) this.addEvent('SYSTEM',e.tag,e.cond+' SHELVE PERIOD EXPIRED — '+(e.to==='UNACK'?'ALARM RE-ANNUNCIATED':e.to== n reads HOLD (not RESUME) while the TI216 interlock holds the sequence: pressing it is the operator's\n  // hold order, so it is journaled and credited to a drill even though the interlock got there first; RESUME is not\n  // offered until the interlock releases (releaseTadShed), so it can never be refused.\n  confirmInterlockHold(){\n    this.msgZone('SEQUENCE ALREADY HELD — TI216 INTERLOCK, RESUME AFTER IT CLEARS');\n    this.addEvent('OPERATOR','SCM202','HOLD CONFIRMED — SEQUENCE ALREADY HELD BY TI216 INTERLOCK','','');\n    this.dAct('HOLD','SCM202','',0);\n  }\n  // Interlock ownership of FIC211 (operator stores refused with a callout while the TI216 shed stands).\n  interlockOwns(tag,param){\n    return tag==='FIC211' && this.tadShed && (param==='MODE'||param==='OP'||param==='SP');\n  }\n  // The SCM restores the mode of a loop it takes ownership of: when FIC211 becomes PROGRAM (FEED entered or resumed)\n  // and the loop was left in MAN (after a shed, or by the operator), the sequence puts it back in AUTO and journals it.\n  scmRestoreModes(){\n    const f=this.L.FIC211;\n    if(f.modeAttr!=='PROGRAM' || f.mode==='AUTO' || f.badPv || this.tadShed) return;\n    const r=ESS.Pid.transferMode(f,'AUTO',this.pidCtx());\n    if(r.ok) this.addEvent('SYSTEM','SCM202','FIC211 MODE RESTORED BY SEQUENCE ('+r.from+' → AUTO)',r.from,'AUTO');\n  }\n  // ---------- state-based alarm limits (ISA-TR18.2.6 pattern, InTech state-based limit table; RESOURCES 2.19, ISA-88 phases) ----------\n  // One limit set per SCM202 phase; HELD is its own state (feed stopped on purpose). A condition mapped to null is\n  // disabled for that phase (removed from the point, any active alarm returned to normal).\n  phaseSets(){\n    const T=(hi,hh)=>({PVHI:[hi,'High'],PVHH:[hh,'Urgent']});\n    return {\n      IDLE:  {TIC212:T(95,105), TIC213:{PVHI:[115,'High']}, LI215:{PVLO:null,PVHI:[85,'High']}, FIC211:{PVLO:null,PVHI:[8,'High']}, TI216:T(100,106)},\n      CHARGE:{TIC212:T(95,105), TIC213:{PVHI:[115,'High']}, LI215:{PVLO:null,PVHI:[85,'High']}, FIC211:{PVLO:null,PVHI:[8,'High']}, TI216:T(100,106)},\n      HEATUP:{TIC212:T(95,105), TIC213:{PVHI:[115,'High']}, LI215:{PVLO:[30,'Low'],PVHI:[85,'High']}, FIC211:{PVLO:null,PVHI:[8,'High']}, TI216:T(100,106)},\n      FEED:  {TIC212:T(90,102), TIC213:{PVHI:[100,'High']}, LI215:{PVLO:[30,'Low'],PVHI:[85,'High']}, FIC211:{PVLO:[8,'Low'],PVHI:[28,'High']}, TI216:T(100,106)},\n      HELD:  {TIC212:T(90,102), TIC213:{PVHI:[100,'High']}, LI215:{PVLO:[30,'Low'],PVHI:[85,'High']}, FIC211:{PVLO:null,PVHI:[8,'High']}, TI216:T(100,106)},\n      REACT: {TIC212:T(88,100), TIC213:{PVHI:[100,'High']}, LI215:{PVLO:[60,'Low'],PVHI:[85,'High']}, FIC211:{PVLO:null,PVHI:[8,'High']}, TI216:T(98,105)},\n      COOL:  {TIC212:T(95,105), TIC213:{PVHI:[115,'High']}, LI215:{PVLO:[60,'Low'],PVHI:[85,'High']}, FIC211:{PVLO:null,PVHI:[8,'High']}, TI216:T(100,106)},\n      DRAIN: {TIC212:T(95,105), TIC213:{PVHI:[115,'High']}, LI215:{PVLO:null,PVHI:[85,'High']}, FIC211:{PVLO:null,PVHI:[8,'High']}, TI216:T(100,106)}\n    };\n  }\n  phaseSetKey(){ const b=this.P.b; return (b.phase==='FEED'&&b.held)?'HELD':b.phase; }\n  phaseSetTags(){ return Object.keys(this.phaseSets().IDLE); }\n  syncPhaseSet(){ const k=this.phaseSetKey(); if(k!==this.phaseSet) this.applyPhaseSet(k,false); }\n  applyPhaseSet(key,silent){\n    const set=this.phaseSets()[key]; if(!set) return;\n    const prev=this.phaseSet; const parts=[];\n    for(const tag in set){ const l=this.L[tag]; if(!l) continue;\n      for(const cond in set[tag]){ const v=set[tag][cond];\n        if(v){ const old=l.alm[cond]||l.almOff[cond]; const sub=(old&&old[2]!=null)?old[2]:this.subprioDefault(cond); l.alm[cond]=[v[0],v[1],sub]; delete l.almOff[cond]; parts.push(tag+' '+cond+' '+this.fmt(v[0],l.dec)+' '+v[1][0]); }\n        else { if(l.alm[cond]){ l.almOff[cond]=l.alm[cond]; delete l.alm[cond]; } if(l._as[cond]){ this.clearA(tag,cond,l.pv); l._as[cond]=false; } if(l._am) delete l._am[cond]; parts.pu av('detail',tag);\n    const gAlm=()=>this.nav('alarms');\n    const gTg=(g)=>()=>{ this.setState({tg:g}); this.nav('trend'); };\n    const gSeq=()=>{ this.setState({unit:'U2'}); this.nav('graphic'); };   // SCM202 START / HOLD / ABORT live on the U2 graphic\n    const slope=(tag,sec)=>{ const hh=this.hist[tag]; if(!hh||hh.length<5) return 0; const nn=Math.min(hh.length-1,Math.round(sec*2)); const a=hh[hh.length-1-nn], b2=hh[hh.length-1]; const dts=(b2[0]-a[0])/1000; return dts>0?(b2[1]-a[1])/dts:0; };\n    if(P.trips.rx) out.push({id:'trip.rx',sev:'URGENT',title:'R-201 high-temperature trip active',why:'The reactor exceeded 185 °C and the trip closed feed valve FV-102. It resets below 160 °C.',steps:[{t:'Silence and acknowledge the trip alarms.',go:()=>gAlm()},{t:'Verify maximum cooling — TIC202 in CAS, TV-202 open.',go:gFp('TIC202')},{t:'Watch TIC201 fall on trend TG01.',go:gTg('TG01')},{t:'Re-establish feed slowly after the trip clears.',go:gFp('FIC102')}]});\n    if(P.trips.batch) out.push({id:'trip.b',sev:'URGENT',title:'R-202 batch overtemp trip',why:'Batch temperature reached 110 °C. Monomer feed is cut and the jacket driven full cold until T < 70 °C.',steps:[{t:'Acknowledge alarms; confirm monomer feed is zero.',go:gFp('FIC211')},{t:'Keep the agitator running for heat removal.',go:gFp('M202')},{t:'The sequence resumes in COOL when the trip clears.'}]});\n    if(P.trips.bed) out.push({id:'trip.bed',sev:'URGENT',title:'R-310 bed overtemp trip — fuel shut off',why:'The hotspot reached 480 °C; fuel gas is isolated until the bed cools below 400 °C.',steps:[{t:'Acknowledge; verify quench flow is available.',go:gFp('FIC313')},{t:'Lower the TIC311 SP before relight to avoid a repeat.',go:gFp('TIC311')}]});\n    if(P.trips.ovf) out.push({id:'trip.ovf',sev:'URGENT',title:'TK-101 overflow protection active',why:'Tank level reached 98% and unit feed was isolated.',steps:[{t:'Increase outlet flow to draw the level down.',go:gFp('FIC102')},{t:'Acknowledge alarms; feed restores below 90%.',go:()=>gAlm()}]});\n    if(P.trips.skin) out.push({id:'trip.skin',sev:'URGENT',title:'H-310 tube-skin trip — fuel shut off',why:'A tube skin (TI314 / TI315) reached its Urgent limit; fuel gas is isolated until both skins are below 400 °C. Keep feed flowing through the tubes so the metal cools.',steps:[{t:'Acknowledge; confirm FV-311 closed and FIC310 flow present.',go:gFp('FIC310')},{t:'Lower the TIC311 SP before relight; watch the skins on TG05.',go:gTg('TG05')}]});\n    if(this.tadShed) out.push({id:'shed.tad',sev:'URGENT',title:'Monomer feed shed by TI216'+(P.b.held?' — sequence HELD':''),why:'The adiabatic end temperature reached its Urgent limit ('+this.fmt(L.TI216.alm.PVHH?L.TI216.alm.PVHH[0]:106,0)+' °C): the unreacted monomer alone could carry the batch to the 110 °C trip. The interlock holds FIC211 in MAN with MV-211 closed and refuses RESUME until the Urgent alarm clears.',steps:[{t:'Confirm M-202 running and the jacket on full cooling.',go:gFp('TIC213')},{t:'Wait for the monomer inventory and TI216 to fall.',go:gTg('TG04')},{t:'When the Urgent alarm clears, RESUME the sequence — the SCM returns FIC211 to AUTO itself.',go:gSeq}]});\n    if(P.trips.psv) out.push({id:'trip.psv',sev:'URGENT',title:'V-401 relief valve lifted',why:'Drum pressure exceeded 950 kPa and is venting to flare.',steps:[{t:'Verify PIC401 is in AUTO and the vent is opening.',go:gFp('PIC401')},{t:'Reduce heat input at TIC301.',go:gFp('TIC301')}]});\n    for(const mt of ['P101','M202']){ const m=L[mt]; if(m.trip) out.push({id:'mtrip.'+mt,sev:'URGENT',title:(mt==='P101'?'P-101 pump tripped':'M-202 agitator tripped')+(m.lock>0?' — lockout '+Math.ceil(m.lock)+' s':''),why:(m.tripWhy||'Uncommanded stop')+'. '+(mt==='M202'?'Without agitation heat transfer collapses and unreacted monomer accumulates — it reacts all at once on restart.':'Downstream flow is lost and affected controllers wind up.'),steps: mt==='M202'?[{t:'Cut monomer feed first — HOLD the sequence (FIC211 is program-owned during FEED; its faceplate refuses MAN / OP stores).',go:gSeq},{t:'Watch TIC212 and the monomer inventory bar.',go:gFp('TIC212')},{t:'Restart the agitator only after the feed is stopped.',go:gFp('M202')}]:[{t:'Put FIC102 in MAN, OP 0 to prevent windup.',go:gFp('FIC102')},{t:'Wait out the lockout, then START.',go:gFp('P101')},{t:'Restore AUTO / CAS and bring flow back gently.'}]}); }\n    if(!P.trips.rx && P.rT>162 && slope('TIC201',20)>0.04) out.push({id:'risk.rx',sev:'URGENT',title:'R-201 temperature rising — runaway risk',why:'Reaction heat rises exponentially with temperature while jacket cooling is only linear. Act before the 185 °C trip.',steps:[{t:'Check TV-202 position against TIC202 output.',go:gFp('TIC202')},{t:'Cut feed — FIC102 to MAN, OP about 20 % — to arrest the exotherm.',go:gFp('FIC102')},{t:'Track the exotherm on trend TG01; wait for TIC201 to turn down.',go:gTg('TG01')},{t:'Feed cut fills TK-101: before LIC101 reaches high level (80 %) and once TIC201 is falling, restore feed — FIC102 OP back toward 60 % or CAS so LIC101 draws the tank down.',go:gFp('LIC101')},{t:'Confirm R-201 is cooling before returning TIC201 / TIC202 to normal operation.',go:gFp('TIC201')}]});\n    if(!P.trips.bed && P.h.bed>435) out.push({id:'risk.bed',sev:'WARN',title:'R-310 bed hotspot climbing ('+Math.round(P.h.bed)+' °C)',why:'The bed exotherm grows with temperature; the fuel trip operates at 480 °C.',steps:[{t:'Raise quench flow FIC313.',go:gFp('FIC313')},{t:'Lower the preheater SP at TIC311.',go:gFp('TIC311')}]});\n    if(!this.tadShed && !P.trips.batch && (P.b.phase==='FEED'||P.b.phase==='REACT') && L.TI216.alm.PVHI && P.b.Tad>L.TI216.alm.PVHI[0]-4) out.push({id:'risk.tad',sev:'WARN',title:'R-202 adiabatic end temperature '+Math.round(P.b.Tad)+' °C',why:'If cooling were lost now, the unreacted monomer would take the batch to about '+Math.round(P.b.Tad)+' °C. Reduce the inventory before it reaches the Urgent limit, where the station sheds the feed automatically.',steps:[{t:'Reduce the monomer feed or HOLD the sequence.',go:gFp('FIC211')},{t:'Confirm the agitator is running.',go:gFp('M202')},{t:'Watch TI216 against TIC212 on TG04.',go:gTg('TG04')}]});\n    const skinHi=Math.max(P.h.ts1,P.h.ts2);\n    if(!P.trips.skin && L.TI315.alm.PVHI && skinHi>L.TI315.alm.PVHI[0]) out.push({id:'risk.skin',sev:'WARN',title:'H-310 tube skin high ('+Math.round(skinHi)+' °C)',why:'Tube metal is running hotter than its continuous rating — usually firing raised faster than the feed can absorb, or low flow through the passes. The fuel trips at the Urgent limit.',steps:[{t:'Reduce the TIC311 setpoint or, in MAN, lower the output.',go:gFp('TIC311')},{t:'Confirm FIC310 feed flow through the tubes.',go:gFp('FIC310')},{t:'Watch TI314 / TI315 against the outlet on TG05.',go:gTg('TG05')}]});\n    if(L.AI316._as.PVLO) out.push({id:'o2.low',sev:'WARN',title:'H-310 excess O2 low — air register lagging',why:'Fuel was raised faster than the combustion air followed; sub-stoichiometric firing wastes fuel and drives the tube skins up.',steps:[{t:'Hold the TIC311 output until AI316 recovers above 2 %.',go:gFp('TIC311')},{t:'Watch the skins on TG05.',go:gTg('TG05')}]});\n    if(!L.M202.trip && !L.M202.run && (P.b.phase==='FEED'||P.b.Cm>15)) out.push({id:'risk.acc',sev:'URGENT',title:'Agitator stopped — monomer accumulating',why:'With no mixing the reaction nearly stops but feed keeps charging monomer, which will react all at once when mixing resumes.',steps:[{t:'HOLD the sequence to stop the FIC211 feed (program-owned during FEED).',go:gSeq},{t:'Restart M-202 only after the feed is stopped.',go:gFp('M202')}]});\n    for(const k in L){ const l=L[k]; if(l.badPv) out.push({id:'badpv.'+k,sev:'WARN',title:k+' PV is BAD — loop shed to MAN',why:'The transmitter signal failed. Shed option '+l.shed+' put the loop in MAN holding the last good output (crosshatch on the graphic).',steps:[{t:'Keep the loop in MAN; control on related measurements.',go:gFp(k)},{t:'Review the input on Point Detail.',go:gDet(k)},{t:'Have maintenance check the transmitter — the PV restores here once the signal is repaired.'}]}); }\n    const vmap={FIC102:'FV102',TIC202:'TV202',TIC301:'TV301',PIC401:'PV401',LIC401:'LV401',FIC211:'MV211',TIC213:'JV213',FIC310:'FV310',TIC311:'FV311',FIC313:'QV313'};\n    const lagging=this.laggingValves(), airLoss=lagging.length>=3;\n    if(!airLoss){ for(const k in vmap){ const l=L[k], v=V[vmap[k]]; if(l&&v&&(this.vLag[vmap[k]]||0)>=20) out.push({id:'stuck.'+k,sev:'WARN',title:vmap[k]+' not following '+k+' output',why:'The controller output is moving but the valve (and PV) is not responding — classic stiction or a jammed actuator.',steps:[{t:'Compare OP vs PV on the trend.',go:gTg(this.unitOf(k)==='U2'?'TG04':this.unitOf(k)==='U3'?'TG05':'TG01')},{t:'Put '+k+' in MAN and stroke the output firmly (±10%).',go:gFp(k)},{t:'If it will not move, flag the valve for maintenance.'}]}); } }\n    for(const k in L){ const l=L[k]; if(l.kind==='pid'&&l.mode!=='MAN'&&!l.badPv&&(l.op>=l.ophilm-0.2||l.op<=l.oplolm+0.2)){ const inAlm=Object.keys(l.alm).some(c=>l._as[c]); if(inAlm) out.push({id:'sat.'+k,sev:'WARN',title:k+' output saturated at '+Math.round(l.op)+'%',why:'The controller has no more range — the disturbance exceeds this loop. Windup is prevented, but the PV cannot be held.',steps:[{t:'Address the disturbance at its source (feed rate, heat input).'},{t:'Consider MAN with a sensible fixed output while conditions recover.',go:gFp(k)}]}); } }\n    for(const k in L){ const l=L[k]; if(l.kind==='pid'&&l.slave&&l.init) out.push({id:'init.'+k,sev:'INFO',title:k+' in INITMAN — cascade broken',why:'Its secondary '+l.slave+' is not in CAS, so the primary is initialized and tracks for a bumpless return.',steps:[{t:'Return '+l.slave+' to CAS when ready.',go:gFp(l.slave)}]}); }\n    const un=this.alarmEngine.counts().unack;\n    if(un>=6) out.push({id:'flood',sev:'WARN',title:'Alarm flood — '+un+' unacknowledged',why:'Do not blind-acknowledge. Triage by priority: Urgent first, then High. Look for a common cause.',steps:[{t:'Silence the horn (F1).'},{t:'Work the summary Urgent-first.',go:()=>gAlm()},{t:'Check for a common cause: pump, air, cooling.'}]});\n    if(airLoss) out.push({id:'air',sev:'URGENT',title:'Instrument air loss suspected — '+lagging.length+' valves not following their outputs',why:'Several control valves have stopped following their controllers at once and sit at their fail positions; a common cause (instrument air) is far more likely than several valve failures. Controllers are ineffective until air returns.',steps:[{t:'Recognize the common cause — do not chase individual loops.'},{t:'Note which valves failed open vs closed on the graphics.'},{t:'Triage alarms by priority.',go:()=>gAlm()}]});\n    if(L.PIC401.mode==='MAN'&&P.drumP>700) out.push({id:'man401',sev:'WARN',title:'PIC401 in MAN while pressure rises',why:'The vent will not move in MAN.',steps:[{t:'Put PIC401 back in AUTO.',go:gFp('PIC401')}]});\n    for(const mt of ['P101','M202']){ const m=L[mt]; if(!m.trip&&!m.run&&m.lock>0) out.push({id:'lock.'+mt,sev:'INFO',title:(mt==='P101'?'P-101':'M-202')+' restart lockout — '+Math.ceil(m.lock)+' s remaining',why:'A lockout timer protects the motor after a stop or trip.',steps:[{t:'Wait for the lockout, then START from the faceplate.',go:gFp(mt)}]}); }\n    const sevR={URGENT:2,WARN:1,INFO:0};\n    out.sort((a,b)=>sevR[b.sev]-sevR[a.sev]);\n    if(!out.length) out.push({id:'ok',sev:'INFO',title:'No abnormal conditions detected',why:'All loops near setpoint, no trips, no bad measurements. Use the Drills menu to practice an upset, or start a batch on Unit 02.',steps:[{t:'Review trends for slow drift.',go:gTg('TG01')},{t:'Start a scored drill.',go:()=>this.setState({dlg:{type:'drills'}})}]});\n    return out.slice(0,8);\n  }\n  topics(){ return [\n    {k:['op','output','invalid mode','man','change op'],t:'Why can I not change OP?',a:'OP entry is only permitted in MAN. In AUTO the PID computes OP; in CAS the SP comes from the primary. Click MAN on the faceplate first — the Message Zone shows INVALID MODE when the rule blocks you.'},\n    {k:['sp','setpoint','rejected','limit','entry'],t:'SP entry rejected',a:'SP must be inside SPLOLM…SPHILM and the loop must be in AUTO (CAS setpoints are primary- or program-driven). Out-of-range entries are rejected with the limits shown in the Message Zone. Limits live on Point Detail → Loop Tune (ENGR to change).'},\n    {k:['initman','init','cascade','track','bkcal'],t:'What is INITMAN?',a:'When a cascade secondary leaves CAS, the primary initializes (INITMAN) and its output tracks the secondary SP via back-calculation, so the return to CAS is bumpless. Fix: put the secondary back in CAS.'},\n    {k:['crosshatch','bad','badpv','hatch','stale','quality'],t:'PV shows crosshatch',a:'Crosshatch means bad or uncertain PV quality. A BADPV alarm raises and the PID sheds per its option — default SHEDHOLD: MODE to MAN, output held at the last good value. Keep it in MAN until the input is repaired.'},\n    {k:['shelve','shelving','nuisance','hide'],t:'How do I shelve an alarm?',a:'Select the alarm row, press SHELVE, pick a duration (max 60 min) and a reason — the reason is mandatory. The alarm goes SHLVD: silent, no flashing, listed under the SHELVED view with its remaining time. When the timer runs out it re-annunciates if the condition is still present. Shelve nuisance alarms only.'},\n    {k:['pump','start','won','lockout','permissive','agitator','motor'],t:'Motor will not start',a:'Check the Message Zone: a start needs its permissive met (P-101 needs tank level above 5%) and the restart lockout expired (30 s after a trip, 15 s after a stop). Failed starts raise CMDFAIL.'},\n    {k:['color','colours','flash','red','yellow','cyan','blink'],t:'What do alarm colors mean?',a:'Urgent = red, High = yellow (representative), Low = cyan. Flashing = UNACK; steady = ACKED with the cause still present; inverse flashing = RTNUN (returned to normal, never acknowledged). Grey = shelved, suppressed by DAS or out of service — those never sound. Journal alarms only log to the journal.'},\n    {k:['ack','silence','acknowledge','horn'],t:'Ack vs Silence',a:'SILENCE (F1) stops the horn only. ACK (F2) claims the alarm: flashing stops and it goes steady while the cause remains, or drops off the summary if it already returned to normal. Sequence: Silence → Ack → read → trend → act → verify.'},\n    {k:['tuning','tune','gain','t1','t2','engr','action'],t:'Cannot change tuning',a:'K, T1, T2, limits and control action need ENGR level or above: Station menu → Security Level, password engr. Experion PID uses overall gain K with T1 and T2 in minutes.'},\n    {k:['batch','sequence','scm','phase','stuck','hold','charge'],t:'Batch sequence control',a:'SCM202 on Unit 02 runs CHARGE → HEATUP → FEED → REACT → COOL → DRAIN. START begins a batch; HOLD stops the monomer feed without losing the phase; ABORT forces COOL. During FEED the FIC211 SP is program-driven (MODEATTR = PROGRAM).'},\n    {k:['raise','lower','arrow','keys','select'],t:'RAISE / LOWER keys',a:'The raise/lower buttons act on the auto-selected target: SP in AUTO, OP in MAN (dashed highlight on the faceplate). In an entry field, arrow keys nudge the typed value; Enter stores, Esc cancels.'},\n    {k:['drill','score','practice','scenario'],t:'Running drills',a:'Drills menu → Start Drill. An upset begins unannounced 8–15 s later. You are scored on time to acknowledge, correct action, trip avoidance, stabilization and diagnosis; the debrief shows your timeline.'},\n    {k:['runaway','exotherm','cooling','reactor','temperature','hot'],t:'Reactor temperature runaway',a:'Reaction heat grows exponentially with temperature; cooling only linearly. If cooling is lost: maximize what cooling remains, CUT FEED to remove the heat source, and never raise SP to chase the PV. Then, once the reactor is falling, restore feed before the feed tank reaches high level (a cut feed fills TK-101) and confirm the reactor keeps cooling. Trips: R-201 at 185 °C, R-202 at 110 °C, R-310 fuel at 480 °C.'},\n    {k:['program','modeattr','owned','sequence owns','rejected','callout'],t:'Write rejected — MODEATTR PROGRAM',a:'While SCM202 drives a loop its mode attribute is PROGRAM: the sequence owns SP, OP and MODE, so operator stores are rejected with a red callout on the faceplate and a journal entry. TIC212 is PROGRAM for the whole batch, FIC211 during FEED. HOLD the sequence to take the monomer feed back (the attribute returns to OPERATOR), or wait for the sequence to end.'},\n    {k:['pv tracking','pvtrack','track','bumpless','bump'],t:'PV tracking and bumpless transfer',a:'With PV tracking ON (Loop Tune, ENGR) the SP follows the PV while the loop is in MAN, so a return to AUTO starts at zero error and the output does not step. The integrator is re-initialised on every mode change so MAN → AUTO and AUTO → CAS are bumpless either way. Default ON for the cascade secondaries FIC102, TIC202 and TIC213.'},\n    {k:['state','phase set','limit set','state-based','disabled','batch alarm'],t:'State-based alarm limits',a:'Unit 02 alarm limits follow the SCM202 phase: the level low alarm is off during CHARGE, DRAIN and IDLE, the monomer flow low alarm is active only in FEED, and the temperature limits tighten in REACT. Every phase change journals the limit set applied; Point Detail → Alarms shows the phase set in force and any conditions it disabled.'},\n    {k:['assistant','guide','coach','panel'],t:'About this assistant',a:'It watches live process state and lists detected issues with step-by-step guidance (GO jumps to the right display). It is a training aid — on a real console, follow site procedures and your shift supervisor.'}\n  ]; }\n  // Cascade maps (master OP -> slave SP and the inverse for INITMAN back-calculation) shared by the PID step and mode transfers.\n  pidCtx(){\n    if(!this._pidCtx) this._pidCtx={ loops:this.L,\n      casMap:{ FIC102:(op)=>op*1.2, TIC202:(op)=>10+0.6*op, TIC213:(op)=>op*1.3 },\n      invMap:{ FIC102:(sp)=>sp/1.2, TIC202:(sp)=>(sp-10)/0.6, TIC213:(sp)=>sp/1.3 } };\n    if(this._pidCtx.loops!==this.L) this._pidCtx.loops=this.L;\n    return this._pidCtx;\n  }\n  pidOrder(){ return ['LIC101','TIC201','TIC212','FIC102','TIC202','TIC213','TIC301','LIC401','PIC401','FIC211','FIC310','TIC311','FIC313']; }\n  // ESS.Pid: anti-windup with integral back-calculation, INITMAN, PV tracking (Kantor CBE30338 PID notes, RESOURCES 4).\n  pids(dt){ const ctx=this.pidCtx(); for(const k of this.pidOrder()) ESS.Pid.stepPid(this.L[k],dt,ctx); }\n\n  applyShed(l){\n    if(l.shed==='NOSHED') return;\n    const old=l.mode; l.mode='MAN';\n    if(l.shed==='SHEDLOW') l.op=l.opexlo; else if(l.shed==='SHEDHIGH') l.op=l.opexhi; else if(l.shed==='SHEDSAFE') l.op=l.safeop;\n    if(old!=='MAN') this.addEvent('SYSTEM',l.tag,'BAD PV — SHED '+l.shed.replace('SHED','')+' · MODE '+old+' → MAN','','');\n  }\n\n  // Per-point deadband (EU, default 1 % of span, override l.almDb) and on-delay (s, override l.almDelay):\n  // flow loops 15 s, level loops 60 s, others 0, after the Siemens examples (RESOURCES 2.6); limit logic per loxalarm (2.9).\n  almDeadband(l){ return l.almDb!=null ? l.almDb : ((l.hi-l.lo)||1)*0.01; }\n  almDelay(l){ if(l.almDelay!=null) return l.almDelay; if(l.tag[0]==='F') return 15; if(l.tag[0]==='L') return 60; return 0; }\n  scan(dt){\n    if(dt==null) dt=0.5;\n    const L=this.L, E=this.alarmEngine;\n    for(const k in L){ const l=L[k];\n      if(!l._am) l._am={};\n      for(const cond in l.alm){\n        const [tp,prio]=l.alm[cond];\n        const isLo=cond==='PVLO'||cond==='PVLL';\n        const v=cond==='DEVHI'?(l.pv-l.sp):l.pv;\n        const memo=l._am[cond]||(l._am[cond]={raw:false,active:false,onT:0,offT:0});\n        const act=E.evaluateLimit({pv:v,trip:tp,kind:isLo?'LO':'HI',deadband:this.almDeadband(l),onDelaySec:this.almDelay(l),dt,memo}).active;\n        if(act && !l._as[cond]) this.raiseA(l.tag,cond,prio,l.pv,l.eu,l.desc);\n        if(!act && l._as[cond]) this.clearA(l.tag,cond,l.pv);\n        l._as[cond]=act;\n      }\n    }\n    for(const mt of ['P101','M202']){ const m=L[mt];\n      if(m.trip && !m._as.TRIP){ this.raiseA(mt,'TRIP','Urgent',0,'',m.desc+' — '+(m.tripWhy||'TRIP')); m._as.TRIP=true; }\n      if(!m.trip && m._as.TRIP){ this.clearA(mt,'TRIP'); m._as.TRIP=false; }\n    }\n  }\n\n  tripMotor(tag,why){\n    const m=this.L[tag]; if(!m||!m.run) return;\n    m.run=false; m.trip=true; m.tripWhy=why; m.lock=30;\n    this.addEvent('SYSTEM',tag,(tag==='P101'?'PUMP':'AGITATOR')+' TRIPPED — '+why,'RUN','STOP');\n  }\n\n  // ---------- drills ----------\n  drillDefs(){\n    return [\n      {id:'D1',name:'Flow transmitter failure (FIC102)',fault:'xmtr',rel:['FIC102'],act:'ACK',stable:'contain',\n       q:'FIC102 PV went BAD. What did the PID do (shed option SHEDHOLD)?',opts:['Shed to MAN and held OP at the last good value','Drove OP to SAFEOP and stayed in AUTO','Closed the valve immediately','Kept controlling on the bad PV'],a:0},\n      {id:'D2',name:'Feed surge — tank level rising',fault:'surge',rel:['LIC101','FIC102','TK-101'],trips:['ovf','rx'],act:'OUTFLOW',stable:'alarms',peak:'tankL',\n       q:'Best first control action for rising level?',opts:['Increase outlet flow (raise FIC102/LIC101 output)','Shelve the level alarms','Stop the feed pump','Lower the outlet flow setpoint'],a:0},\n      {id:'D3',name:'Feed pump trip',fault:'pump',rel:['P101','FIC102','LIC101','TK-101'],act:'START',stable:'alarms',\n       q:'Correct restart sequence?',opts:['FIC102 to MAN / OP 0, START P-101 after lockout, restore AUTO','Immediately drive FIC102 OP to 100%','Repeatedly press START until it holds','Shelve the TRIP alarm and wait'],a:0},\n      // D4: the reactor is the drill's equipment (trips:['rx']); LIC101 is related because cutting feed fills TK-101 and\n      // the trainee must restore feed before the tank reaches high level — a TK-101 trip is an 'other equipment' deduction\n      {id:'D4',name:'Cooling water loss — exotherm',fault:'cool',rel:['TIC201','TIC202','R-201','LIC101'],trips:['rx'],act:'CUTFEED',stable:'alarms',peak:'rT',\n       debrief:'Expected response: cut reactor feed (FIC102 to MAN, output about 20 %) to arrest the exotherm; when TIC201 is falling and before TK-101 reaches high level (LIC101 PVHI 80 %), restore feed — FIC102 output back toward 60 %, or return it to CAS so LIC101 draws the tank down — and confirm R-201 is cooling on TG01. Feed left cut fills the tank; feed restored while R-201 is still climbing re-lights the exotherm.',\n       q:'Reactor temperature climbing with no cooling. Best action?',opts:['Cut feed (FIC102 to MAN, OP low) to arrest the exotherm, then restore feed before TK-101 reaches high level and confirm R-201 is cooling','Raise TIC201 SP to reduce the error','Put TIC202 in MAN with OP 0','Acknowledge the alarms and monitor'],a:0},\n      {id:'D6',name:'Stuck coolant valve (stiction)',fault:'stick',rel:['TIC202','TIC201'],trips:['rx'],act:'MAN202',stable:'alarms',peak:'rT',\n       q:'TIC202 OP moves but jacket temperature does not. Root cause?',opts:['Control valve TV-202 stuck (stiction)','Transmitter failure on the jacket RTD','Wrong control action configured','Cascade initialization error'],a:0},\n      {id:'D9',name:'Flash drum pressure high',fault:'vap',rel:['PIC401','V-401'],trips:['psv'],act:'AUTO401',stable:'alarms',peak:'drumP',\n       setup:(c)=>{ const l=c.L.PIC401; if(l.mode!=='MAN'){ ESS.Pid.transferMode(l,'MAN',c.pidCtx()); c.addEvent('SYSTEM','PIC401','MODE LEFT IN MAN BY PREVIOUS SHIFT'+(c.instr.hidden?'':' (DRILL SETUP)'),'AUTO','MAN'); } },\n       q:'PIC401 did not respond to rising pressure. Why?',opts:['It had been left in MAN — the vent never moved','The vent valve was stuck','The setpoint was too high','Transmitter drift'],a:0},\n      {id:'D11',name:'Agitator trip during semi-batch feed (Unit 02)',fault:'agit',needBatch:true,when:(P)=>P.b.phase==='FEED'&&P.b.Cm>8,rel:['M202','TIC212','R-202','FIC211','SCM202'],trips:['batch'],act:'CUTMONO',stable:'alarms',peak:'T212',\n       q:'The agitator tripped during monomer feed. Why is restarting it later dangerous?',opts:['Accumulated monomer reacts at once when mixing resumes — stop feed and max cooling before restart','It will trip the breaker again','The jacket cannot heat without agitation','It pulls a vacuum in the reactor'],a:0},\n      {id:'D12',name:'Catalyst activity surge — bed overtemp (Unit 03)',fault:'bedact',rel:['TI312','TIC311','FIC313','R-310'],trips:['bed'],act:'QUENCH',stable:'alarms',peak:'bed',\n       q:'Bed temperature climbing at constant preheat. Correct response?',opts:['Raise quench flow and/or lower the preheater SP — the fuel trips at 480 °C','Raise the preheater SP to burn off deposits','Put FIC313 in MAN and close the quench','Increase feed to sweep the heat out'],a:0}\n    ];\n  }\n  startDrill(d){\n    if(this.state.drill){ this.msgZone('DRILL ALREADY ACTIVE'); return; }\n    if(d.needBatch && this.P.b.phase==='IDLE') this.seqCmd('START',true);\n    if(d.setup) d.setup(this);   // pre-existing condition the drill relies on (e.g. a loop left in MAN)\n    const delay=8000+this.modelCtx().rand()*7000;\n    this.setState({drill:{def:d,t0:this.P.t,ti:this.P.t+delay,injected:false,m:{},stableFor:0},dlg:null});\n    this.journal('DRILL',d.id,'',{instr:true});\n    this.instrNote('DRILL '+d.id+' ARMED — '+d.name.toUpperCase()+' — INJECTION AT '+this.fT(this.P.t+delay));\n    if(!this.instr.hidden) this.postMsg('INSTRUCTOR: drill '+d.id+' armed — confirm you are at the console',{confirm:true,src:'INSTR'});\n  }\n  // A snapshot carries the armed / running drill as plain data; the definition is looked up again on restore.\n  drillData(){ const d=this.state.drill; return d?{id:d.def.id,t0:d.t0,ti:d.ti,tInj:d.tInj||0,injected:d.injected,m:d.m,stableFor:d.stableFor}:null; }\n  drillFromData(x){ const def=x&&this.drillDefs().find(d=>d.id===x.id); return def?{def,t0:x.t0,ti:x.ti,tInj:x.tInj||0,injected:x.injected,m:x.m||{},stableFor:x.stableFor||0}:null; }\n  injectFault(k,on){\n    const P=this.P,V=this.V,L=this.L;\n    P.faults[k]=on; if(on) P.faultT[k]=P.t; else delete P.faultT[k];\n    if(k==='pump'){ if(on){ this.tripMotor('P101','UNCOMMANDED STOP'); P.faults.pump=false; } }\n    if(k==='agit'){ if(on){ this.tripMotor('M202','UNCOMMANDED STOP'); P.faults.agit=false; } }\n    if(k==='stick') V.TV202.stuck=on;   // the reaction load of the stuck valve lives in the model (PARAMS.U1.stickHeat)\n    if(k==='xmtr' && !on){ /* heal handled in step */ }\n  }\n  drillWatch(dt){\n    const d=this.state.drill; if(!d) return;\n    const P=this.P,L=this.L,m=d.m,def=d.def;\n    if(!d.injected && P.t>=d.ti && (!def.when || def.when(P))){ d.injected=true; d.tInj=P.t; this.injectFault(def.fault,true); }\n    // gated drills (a 'when' condition, e.g. D11 waiting for the FEED phase) count their 12-minute limit from the\n    // injection, so arming from IDLE still gives the trainee the full window; ungated drills count from arming as before\n    if(!d.injected){ if(def.when && P.t-d.t0>3600000) this.endDrill('INJECTION CONDITION NOT REACHED'); return; }\n    if(def.peak){ const v=this.peakOf(def.peak); m.peak=Math.max(m.peak||0,v); }\n    if(!m.tAlarm){ const a=this.alarmEngine.active().find(x=>def.rel.includes(x.tag)); if(a) m.tAlarm=a.lastT; }\n    if(m.tAlarm && !m.tStable){\n      let ok=false;\n      if(def.stable==='contain'){ ok = L.FIC102.mode==='MAN' && !this.alarmEngine.unacked().some(x=>def.rel.includes(x.tag)); }\n      else { ok = m.tAck && !this.alarmEngine.active().some(x=>def.rel.includes(x.tag)&&!x.shelved); }\n      d.stableFor = ok ? d.stableFor+dt : 0;\n      if(d.stableFor>=60){ m.tStable=P.t; this.endDrill('STABILIZED'); return; }\n    }\n    if(P.t-(def.when?(d.tInj||d.t0):d.t0)>720000) this.endDrill('TIME LIMIT REACHED');\n  }\n  dHook(kind,tag){\n    const d=this.state.drill; if(!d||!d.injected) return;\n    const m=d.m;\n    if(d.def.rel.includes(tag)||!tag){\n      if(kind==='SIL'&&!m.tSil&&m.tAlarm) m.tSil=this.P.t;\n      if(kind==='ACK'&&!m.tAck&&m.tAlarm){ m.tAck=this.P.t; if(d.def.act==='ACK'&&!m.tAct) m.tAct=this.P.t; }\n    }\n  }\n  dAct(type,tag,val,delta){\n    const d=this.state.drill; if(!d||!d.injected||d.m.tAct) return;\n    const A=d.def.act; let hit=false;\n    if(A==='OUTFLOW') hit=(tag==='FIC102'&&(type==='SP'||type==='OP')&&delta>0)||(tag==='LIC101'&&type==='SP'&&delta<0);\n    if(A==='CUTFEED') hit=(tag==='FIC102'&&(type==='OP'||type==='SP')&&val<=25);\n    if(A==='MAN202') hit=(tag==='TIC202'&&type==='MODE'&&val==='MAN');\n    if(A==='AUTO401') hit=(tag==='PIC401'&&type==='MODE'&&val==='AUTO');\n    if(A==='START') hit=(tag==='P101'&&type==='START');\n    if(A==='CUTMONO') hit=(tag==='FIC211'&&(type==='OP'||type==='SP')&&val<=2)||(tag==='SCM202'&&type==='HOLD');\n    if(A==='QUENCH') hit=(tag==='FIC313'&&(type==='SP'||type==='OP')&&delta>0)||(tag==='TIC311'&&type==='SP'&&delta<0);\n    if(hit) d.m.tAct=this.P.t;\n  }\n  // Equipment trip during a drill. A drill definition may list the trip keys of its own equipment (`trips`, e.g. D4 →\n  // ['rx']); a trip on that list is the drill's trip (the 'Trip avoided' criterion), any other trip is counted in\n  // m.otherTrips and deducted separately, so a trainee who floods TK-101 while handling an R-201 exotherm is not scored\n  // as if the reactor had tripped, and not rewarded either. Without a list every trip is the drill's trip.\n  tripKeyOf(src){ return ({'TK-101':'ovf','R-201':'rx','V-401':'psv','R-202':'batch','R-310':'bed','H-310':'skin'})[src]||src; }\n  dTrip(src,cond){\n    const d=this.state.drill; if(!d||!d.injected) return;\n    const key=this.tripKeyOf(src), rel=!d.def.trips||!src||d.def.trips.includes(key);\n    if(rel){ d.m.trip=true; return; }\n    d.m.otherTrips=(d.m.otherTrips||0)+1;\n    (d.m.otherTripList=d.m.otherTripList||[]).push(src+(cond?' '+cond:''));\n  }\n  endDrill(reason){\n    const d=this.state.drill; if(!d) return;\n    // every fault a drill can inject is cleared (drillFaults() is derived from the definitions, so a new drill fault\n    // cannot be left behind); 'stick' carries a reaction load in the model (PARAMS.U1.stickHeat), so it must go too\n    for(const k of this.drillFaults()) this.injectFault(k,false);\n    d.reason=reason; d.tEnd=this.P.t;\n    if(reason==='ENDED BY INSTRUCTOR') this.journal('DRILLEND',d.def.id,reason,{instr:true});   // automatic ends are reproduced by the replay itself\n    this.setState({drill:null, dlg:{type:'debrief',drill:d}, debAns:-1});\n    this.instrNote('DRILL '+d.def.id+' ENDED — '+reason);\n    if(!this.instr.hidden) this.postMsg('INSTRUCTOR: drill '+d.def.id+' ended — '+reason,{confirm:true,src:'INSTR'});   // hidden: the trainee sees only the debrief\n  }\n  drillFaults(){ const set=new Set(['rxn']); for(const d of this.drillDefs()) set.add(d.fault); return [...set]; }\n  // Standards-based scorer (ESS.Kpi.scoreDrill): acknowledge latency, correct action and latency, trip avoided,\n  // stabilisation, alarm load during the drill (KPI module over the alarm journal) and the debrief question.\n  // Returns {score, pass, passMark, passLabel, breakdown}; the pass mark is the sim's own 80 % (RESOURCES 2.7, 2.8, 2.12).\n  scoreDrill(d,ans){\n    const m=d.m, t0=d.t0, t1=d.tEnd||this.P.t;\n    const load=ESS.Kpi.computeMetrics(this.alarmLog,{t0,t1:Math.max(t1,t0+1)}).per10min.avg;\n    return ESS.Kpi.scoreDrill({tAlarm:m.tAlarm,tAck:m.tAck,tAct:m.tAct,tStable:m.tStable,trip:!!m.trip,otherTrips:m.otherTrips||0,actionCorrect:!!m.tAct,quizCorrect:ans===d.def.a,alarmsPer10min:load},{passMark:ESS.Training.PASS_MARK});\n  }\n  // Debrief submit: score, journal, training record (last 20 per session, keyed by the trainee's logon name).\n  submitDebrief(d,ans){\n    const sc=this.scoreDrill(d,ans);\n    this.setState({dlg:{...this.state.dlg,scored:true,score:sc.score,result:sc}});\n    this.addEvent('SYSTEM','STN01','DRILL '+d.def.id+' SCORE '+sc.score+'/100 — '+(sc.pass?'PASS':'NOT PASSED')+' ('+sc.passMark+' % MARK)','',this.operName());\n    ESS.Training.addRecord(this.trainingRecords,ESS.Training.recordFor(this.operName(),d.def.id,d.def.name,sc,d.tEnd||this.P.t,d.reason),20);\n    this.taskDone('abn.drill'); if(sc.pass) this.taskDone('abn.pass');\n    return sc;\n  }\n\n  // ---------- instructor station (Forge PTS instructor features, RESOURCES 2.14; seeded replay / snapshot / backtrack per the cstr-ots notes, RESOURCES 4) ----------\n  // Instructor state lives in this.instr, never in a trainee display. Entry needs the instructor password ('instr') or\n  // the MNGR level; a trainee at OPER / SUPV is sent to the logon dialog and the display falls back to the graphic.\n  instructorAllowed(){ return this.state.sec==='MNGR' || !!(this.instr&&this.instr.auth); }\n  openInstructor(){\n    if(this.instructorAllowed()){ this.nav('instr'); return; }\n    this.msgZone('INSTRUCTOR STATION — PASSWORD REQUIRED');\n    this.setState({dlg:{type:'logon',instr:true},dlgPw:'',menu:null});\n  }\n  lockInstructor(){\n    this.instr.auth=false;\n    ESS.Instructor.logAdd(this.instr,this.P.t,'INSTRUCTOR STATION LOCKED');\n    if(this.state.display==='instr') this.nav('graphic');\n  }\n  effDisplay(){ const d=this.state.display; return d==='instr'&&!this.instructorAllowed()?'graphic':d; }\n  // Instructor-only log; mirrored into the station journal only while upsets are not hidden.\n  instrLog(txt){\n    ESS.Instructor.logAdd(this.instr,this.P.t,txt);\n    if(!this.instr.hidden) this.addEvent('SYSTEM','INSTR',txt,'','');\n  }\n  // Instructor-only note: never mirrored. Instructor variables, magnitudes and the seed are plant conditions the\n  // trainee is not told about, whatever the hidden switch says.\n  instrNote(txt){ ESS.Instructor.logAdd(this.instr,this.P.t,txt); }\n  replaying(){ return !!(this.instr&&this.instr.replay); }\n  // --- run control: FREEZE stops the clock (speed 0), STEP advances exactly one 0.5 s tick, RUN / 2 / 5 / 10 set the speed\n  setSpeed(v){ this.setState({speed:v}); }\n  freeze(){ this.setSpeed(0); }\n  stepOnce(){ if(this.state.speed!==0) this.setState({speed:0}); this.step(0.5); this.setState(s=>({tk:s.tk+1})); }\n  setSeed(n){\n    const seed=(Number(n)>>>0)||ESS.Instructor.DEFAULT_SEED;\n    this.instr.seed=seed; this.seed=seed; this.rand=ESS.Models.createRand(seed);\n    this.instrNote('RANDOM SEED SET '+seed);\n    this.journal('SEED','',seed,{instr:true});\n    this.setState({instrSeedTxt:''});\n  }\n  // --- snapshots: the full process state (P, L, V, alarm records, interlock flags, seed and generator cursor)\n  // Returns null (and tells the instructor) when the process state holds a non-finite number; such a snapshot could\n  // not be restored faithfully.\n  snapshotData(name){\n    const r=this.rand;\n    try{\n      return ESS.Instructor.makeSnapshot({t:this.P.t,wall:Date.now(),P:this.P,L:this.L,V:this.V,alarms:this.alarmEngine.snapshot(),\n        eventsCount:this.events.length,journalSeq:this.instr.seq,tadShed:this.tadShed,phaseSet:this.phaseSet,disabledAssets:[...this.disabledAssets],\n        seed:(r&&r.seed)||this.seed,randState:(r&&r.getState)?r.getState():null,drill:this.drillData()},name);\n    }catch(err){ this.instrNote('SNAPSHOT REFUSED — '+String(err.message).toUpperCase()); this.msgZone('SNAPSHOT REFUSED: PROCESS STATE IS NOT FINITE'); return null; }\n  }\n  restoreSnapshot(snap,why){\n    const I=ESS.Instructor;\n    this.P=I.clone(snap.P); this.L=I.clone(snap.L); this.V=I.clone(snap.V);\n    this.alarmEngine.restore(snap.alarms);\n    this.restoreDisabledAssets(snap.disabledAssets);\n    this.tadShed=snap.tadShed; this.phaseSet=snap.phaseSet;\n    this.seed=snap.seed||this.seed; this.rand=ESS.Models.createRand(this.seed); if(snap.randState!=null) this.rand.setState(snap.randState);\n    this._ctx=null; this._pidCtx=null; this.callouts={}; this.vLag={}; this._lastPhase=this.P.b.phase;\n    const t=this.P.t;\n    for(const k in this.hist){ const h=this.hist[k]; while(h.length&&h[h.length-1][0]>t) h.pop(); }\n    this.events=this.events.filter(e=>e.t<=t); this.msgs=this.msgs.filter(m=>m.t<=t); this.alarmLog=this.alarmLog.filter(a=>a.t<=t);\n    I.trimAfter(this.instr,t,snap.journalSeq);\n    this.setState({drill:this.drillFromData(snap.drill),entry:null,selAlm:null,msg:''});\n    this.instrLog((why||'SNAPSHOT RESTORED')+' — SIM TIME '+this.fT(t));\n  }\n  // The disabled-asset set travels with the snapshot so it agrees with the restored records' disabledBy flags; a\n  // snapshot without the list (older ring entries) derives it from the flags. Any flag left over for an asset that is\n  // not disabled in the restored state is cleared and the record returned to service, so nothing stays parked unseen.\n  restoreDisabledAssets(list){\n    const E=this.alarmEngine;\n    const ids=Array.isArray(list)?list:E.list().filter(r=>r.disabledBy&&r.disabledBy.startsWith('ASSET:')).map(r=>r.disabledBy.slice(6));\n    this.disabledAssets=new Set(ids);\n    for(const r of E.list()){ if(!r.disabledBy) continue; const id=r.disabledBy.startsWith('ASSET:')?r.disabledBy.slice(6):''; if(!this.disabledAssets.has(id)){ r.disabledBy=''; E.rts(r,this.P.t); this.addEvent('SYSTEM',r.tag,r.cond+' RE-ENABLED — '+id+' NOT DISABLED IN RESTORED STATE','DISABLED',r.state); } }\n  }\n  saveSlot(i,name){\n    const nm=(name||'').trim()||('SNAP '+(i+1)+' '+this.fT(this.P.t));\n    const snap=this.snapshotData(nm); if(!snap) return;\n    this.instr.snapshots[i]=snap;\n    this.instrLog('SNAPSHOT SAVED: '+nm);\n    this.setState({instrSnapName:''});\n  }\n  // A restore during a drill discards the trainee's run so far, so it is signed. The request carries the instructor's\n  // own authority (instructorAllowed()): the station level is not pre-checked and 'instr' signs at manager rank.\n  restoreSlot(i){\n    const s=this.instr.snapshots[i]; if(!s){ this.msgZone('SNAPSHOT SLOT ' firm',v:String(pend)}]},\n        {title:'ALARM SYSTEM',led:this.disabledAssets.size?'#C08000':'#00A000',rows:[{k:'Alarms disabled',v:this.disabledAssets.size?[...this.disabledAssets].join(', ')+' ('+E.list().filter(r=>this.isDisabledRec(r)).length+' conditions)':'NONE'},{k:'Out of service',v:String(E.oos().length)},{k:'Config changes',v:this.mocCount+' SINCE STARTUP (MOC)'},{k:'Drill results kept',v:String(this.trainingRecords.length)}]},\n        {title:'CONTROLLER C300-SIM',led:'#00A000',rows:[{k:'CEE base cycle',v:'50 mS (EMULATED)'},{k:'CM period',v:'500 mS'},{k:'Redundancy',v:'PRIMARY / SYNCED'}]},\n        {title:'NETWORK FTE',led:'#00A000',rows:[{k:'FTE A',v:'OK'},{k:'FTE B',v:'OK'},{k:'Time source',v:'STATION CLOCK'}]},\n        {title:'SIMULATION ENGINE',led:'#31548F',rows:simRows},\n        {title:'RELEASE',led:'#00A000',rows:[{k:'Conventions',v:'R530-ERA (REPRESENTATIVE)'},{k:'Build',v:'TRAINING SIM v2.0.0'},{k:'License',v:'EDUCATIONAL'}]}\n      ],\n      ledSrv:'#00A000', ledCee:'#00A000',\n      spdT:S.speed===0?'FROZEN':S.speed+'×', instrOpen:()=>this.openInstructor(),\n      audT:((this.props.audible??true)&&S.aud)?'ON':'OFF', audCb:()=>this.setState({aud:!S.aud}),\n      secT:S.sec==='VIEW'?'VIEW ONLY':S.sec, secCb:setS({dlg:{type:'logon'}}),\n      dateT:this.fD(P.t), timeT:this.fT(P.t)\n    };\n  }\n  // KPI display view model. Thresholds are the exida / ISA-18.2 figures carried by ESS.Kpi (RESOURCES 2.7, 2.8).\n  kpiView(setS){\n    const S=this.state, m=this.kpiMetrics(), T=ESS.Kpi.thresholds, pc=(p)=>this.prioColor(p), pt=(p)=>this.prioText(p);\n    const vcol={GOOD:['#00A000','#FFFFFF'],ACCEPTABLE:['#B8C4D4','#000000'],MANAGEABLE:[pc('High'),pt('High')],OVERLOADED:[pc('Urgent'),pt('Urgent')]}[m.health.verdict]||['#D4D0C8','#000000'];\n    const mins=Math.max(0,m.window.minutes);\n    const tiles=[\n      {label:'Alarms in window',value:String(m.total),sub:m.journal+' journal-only',fg:'#000000'},\n      {label:'Avg per 10 min',value:this.fmt(m guide — RESOURCES 2.4, 2.11, 2.19)\n  philosophyView(){\n    const name=this.paletteName(), C=this.colours();\n    const ctx={paletteName:this.paletteLabel(name),urgentPct:5,highPct:10,lowPct:85,isaLow:80,isaHigh:15,isaUrgent:5,shelveMaxMin:60,defaultDeadbandPct:1};\n    return {sections:ESS.Philosophy.sections(ctx),sources:ESS.Philosophy.sources(),ladder:ESS.Philosophy.limitLadder(),\n      palettes:ESS.Palette.list().map(pn=>({label:this.paletteLabel(pn),bg:name===pn?'#B8C4D4':'#D4D0C8',bc:name===pn?'#31548F':'#FFFFFF #6E6E6E #6E6E6E #FFFFFF',cb:()=>this.setPalette(pn)})),\n      swatches:['Urgent','High','Low','Journal'].map(p=>({label:p.toUpperCase(),bg:C.prio[p],fg:C.prioText[p],bd:C.prioDim[p]}))};\n  }\n  // Step-response sparkline for the Loop Tune tab: PV, SP and OP over the last `mins` minutes of history on a 320×90 box.\n  stepSparkline(l,mins){\n    const h=this.hist[l.tag]||[], W=320, H=90, t1=this.P.t, t0=t1-mins*60000, span=(l.hi-l.lo)||1;\n    const start=Math.max(0,h.length-Math.ceil(mins*120)), stride=Math.max(1,Math.floor((h.length-start)/160));\n    const line=(idx,lo,sp)=>{ const pts=[]; for(let i=start;i<h.length;i+=stride){ const r=h[i]; if(r[0]<t0) continue; const x=(r[0]-t0)/(t1-t0)*W, y=H-((r[idx]-lo)/sp)*H; pts.push(x.toFixed(1)+','+Math.max(1,Math.min(H-1,y)).toFixed(1)); } return pts.join(' '); };\n    let lastStep=null; for(let i=Math.max(start,1);i<h.length;i++){ if(h[i][0]>=t0&&Math.abs(h[i][2]-h[i-1][2])>span*0.005) lastStep=h[i][0]; }\n    const note=h.length<4?'History is collecting — the response draws as samples arrive.':(lastStep?'Last SP step at '+this.fT(lastStep)+'; watch how PV settles against SP. Vertical axis is the PV range for PV/SP and 0–100 % for OP.':'No SP step in the window; change the SP (AUTO) to see a step response. Vertical axis is the PV range for PV/SP and 0–100 % for OP.');\n    return {span:mins+' MIN',pv:line(1,l.lo,span),sp:line(2,l.lo,span),op:line(3,0,100),note};\n  }\n  mmss(ms){ const s=Math.max(0,Math
