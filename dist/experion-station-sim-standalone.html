document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c0aee55e-13b8-5937-bc7c-745b064f0d5c\"><\/script>\n<script src=\"5e72f3e6-3420-5519-9879-60ef12e9ace8\"><\/script>\n<script src=\"6a79b040-1fc7-5a2b-8e50-89cb58f70026\"><\/script>\n<script src=\"c372eb14-5019-542e-a3ab-c1a5b70d81ff\"><\/script>\n<script src=\"3e1b45aa-0217-5c09-a124-6dead5d78d7a\"><\/script>\n<script src=\"9298b6b8-5034-51f9-a2ad-6384ceab24cf\"><\/script>\n<script src=\"a0b61971-d33b-57a0-b5b3-61ea2c3fa3b1\"><\/script>\n<script src=\"2d592a0d-108e-5b77-8b53-55ecb58c63d7\"><\/script>\n<script src=\"931c8de2-aae3-5f03-8eb6-5ec67356b21d\"><\/script>\n<script src=\"aa3b1aea-14b0-5d56-be30-cbb85dd1ee0f\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<template id=\"__bundler_thumbnail\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#41608A\"><\/rect><rect x=\"30\" y=\"34\" width=\"40\" height=\"26\" fill=\"#D4D0C8\"><\/rect><rect x=\"34\" y=\"38\" width=\"14\" height=\"8\" fill=\"#FF0000\"><\/rect><rect x=\"52\" y=\"38\" width=\"14\" height=\"8\" fill=\"#00D8D8\"><\/rect><rect x=\"34\" y=\"50\" width=\"32\" height=\"6\" fill=\"#41608A\"><\/rect><rect x=\"44\" y=\"60\" width=\"12\" height=\"6\" fill=\"#D4D0C8\"><\/rect><\/svg><\/template>\n<helmet>\n<style>\nhtml,body{margin:0;padding:0;height:100%;background:#8f8f8f;overflow:hidden}\n*{box-sizing:border-box}\na{color:#1a4a7a;text-decoration:none}a:hover{color:#0a3a6a;text-decoration:underline}\ninput,select,button{font-family:Tahoma,Verdana,'Segoe UI',sans-serif}\n::-webkit-scrollbar{width:14px;height:14px;background:#D4D0C8}\n::-webkit-scrollbar-thumb{background:#B4B0A8;border:2px solid #D4D0C8}\n<\/style>\n<\/helmet>\n<div style=\"position:fixed;inset:0;display:flex;flex-direction:column;font:12px Tahoma,Verdana,'Segoe UI',sans-serif;background:#D4D0C8;color:#000;font-v px\"><\/div><\/sc-if>\n    <sc-if value=\"{{ b.label }}\" hint-placeholder-val=\"{{ false }}\">\n      <div title=\"{{ b.title }}\" style=\"padding:4px 8px;background:{{ b.bg }};border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF;font-size:11px;font-weight:700;color:#2c2c2c;cursor:pointer;white-space:nowrap;display:flex;align-items:center\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;background:#C8C4BC\" onClick=\"{{ b.cb }}\">{{ b.label }}<\/div>\n    <\/sc-if>\n  <\/sc-for>\n<\/div>\n\n<div style=\"display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:2px solid #9a968e;user-select:none\">\n  <div style=\"font-size:11px;color:#3c3c3c\">Command:<\/div>\n  <input value=\"{{ cmdVal }}\" onChange=\"{{ onCmd }}\" onKeyDown=\"{{ onCmdKey }}\" spellcheck=\"false\" style=\"width:170px;padding:3px 5px;font-size:12px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n  <div style=\"width:270px;padding:4px 6px;background:#C9C5BD;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;font-size:11px;color:#7a1a00;font-weight:700;height:24px;overflow:hidden;white-space:nowrap\">{{ msgTxt }}<\/div>\n  <div style=\"flex:1;display:flex;align-items:center;padding:0 6px;background:{{ al.bg }};color:{{ al.fg }};border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;font-size:12px;font-weight:700;height:24px;overflow:hidden;white-space:nowrap;cursor:pointer\" onClick=\"{{ al.click }}\">{{ al.txt }}<\/div>\n  <div style=\"display:flex;gap:3px;align-items:center;font-size:10px;font-weight:700\">\n    <sc-for list=\"{{ cnts }}\" as=\"c\" hint-placeholder-count=\"3\">\n      <div title=\"{{ c.title }}\" style=\"padding:2px 6px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }}\">{{ c.label }} {{ c.n }}<\/div>\n    <\/sc-for>\n  <\/div>\n<\/div>\n\n<div style=\"flex:1;display:flex;align-items:stretch;overflow:hidden;background:#BFBFBF\" onMouseDown=\"{{ closeMenus }}\">\n v>\n  <\/sc-for>\n  <div style=\"flex:1\"><\/div>\n  <div style=\"font-size:10px;color:#6a665e\">FIRED PREHEATER + EXOTHERMIC FIXED-BED REACTOR<\/div>\n<\/div>\n<svg viewBox=\"0 0 1420 720\" style=\"width:100%;flex:1;min-height:0;user-select:none\" preserveAspectRatio=\"xMidYMid meet\">\n  <defs>\n    <pattern id=\"hatch3\" patternUnits=\"userSpaceOnUse\" width=\"7\" height=\"7\" patternTransform=\"rotate(45)\">\n      <rect width=\"7\" height=\"7\" fill=\"#C4C4C4\"><\/rect>\n      <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"7\" style=\"stroke:#A9A9A9;stroke-width:3.5\"><\/line>\n    <\/pattern>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"1420\" height=\"720\" fill=\"#BFBFBF\"><\/rect>\n  <text x=\"24\" y=\"38\" style=\"font:700 19px Tahoma;fill:#3c3c3c\">UNIT 03 — FIRED PREHEATER + FIXED-BED REACTOR<\/text>\n  <text x=\"24\" y=\"56\" style=\"font:10px Tahoma;fill:#6a665e\">H-310 FUEL-FIRED PREHEATER · R-310 EXOTHERMIC CATALYST BED · QUENCH TRAINING<\/text>\n  <path d=\"M20,400 H134\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\/path>\n  <text x=\"20\" y=\"392\" style=\"font:700 10px Tahoma;fill:#4a4a4a\">FEED<\/text>\n  <path d=\"M166,400 H260\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\/path>\n  <rect x=\"260\" y=\"300\" width=\"220\" height=\"220\" fill=\"#CDCDCD\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\/rect>\n  <path d=\"M280,340 H440 M280,375 H440 M280,410 H440\" style=\"stroke:#6a6a6a;stroke-width:2;fill:none\"><\/path>\n  <polygon points=\"300,505 312,470 324,505\" fill=\"#C06000\" opacity=\"{{ gfx3.flameOp }}\"><\/polygon>\n  <polygon points=\"356,505 368,470 380,505\" fill=\"#C06000\" opacity=\"{{ gfx3.flameOp }}\"><\/polygon>\n  <polygon points=\"412,505 424,470 436,505\" fill=\"#C06000\" opacity=\"{{ gfx3.flameOp }}\"><\/polygon>\n  <text x=\"264\" y=\"294\" style=\"font:700 10px Tahoma;fill:#55524c\">H-310 PREHEATER<\/text>\n  <rect x=\"440\" y=\"236\" width=\"34\" height=\"64\" fill=\"#CDCDCD\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\ 0 V656 H920\" style=\"stroke:#4a4a4a;stroke-width:2.5;fill:none\"><\/path>\n  <polygon points=\"914,651 924,656 914,661\" fill=\"#4a4a4a\"><\/polygon>\n  <text x=\"866\" y=\"648\" style=\"font:700 10px Tahoma;fill:#4a4a4a\">PRODUCT<\/text>\n  <text x=\"600\" y=\"282\" style=\"font:700 15px Tahoma;fill:#CC0000;opacity:{{ gfx3.tripOp }}\">{{ gfx3.tripT }}<\/text>\n  <sc-for list=\"{{ vl3 }}\" as=\"v\" hint-placeholder-count=\"3\">\n    <g transform=\"translate({{ v.x }},{{ v.y }}) rotate({{ v.rot }})\">\n      <polygon points=\"-16,-11 -16,11 0,0\" fill=\"{{ v.fill }}\" stroke=\"#3a3a3a\" stroke-width=\"1.6\"><\/polygon>\n      <polygon points=\"16,-11 16,11 0,0\" fill=\"{{ v.fill }}\" stroke=\"#3a3a3a\" stroke-width=\"1.6\"><\/polygon>\n    <\/g>\n    <text x=\"{{ v.tx }}\" y=\"{{ v.ty }}\" style=\"font:10px Tahoma;fill:#3a3a3a\">{{ v.label }} {{ v.pos }}<\/text>\n  <\/sc-for>\n  <sc-for list=\"{{ gv3 }}\" as=\"p\" hint-placeholder-count=\"4\">\n    <g style=\"cursor:pointer\" onClick=\"{{ p.click }}\" onDoubleClick=\"{{ p.dbl }}\">\n      <rect x=\"{{ p.x }}\" y=\"{{ p.y }}\" width=\"128\" height=\"46\" fill=\"#D8D8D8\" stroke=\"{{ p.bd }}\" stroke-width=\"{{ p.bw }}\"><\/rect>\n      <rect x=\"{{ p.x }}\" y=\"{{ p.y }}\" width=\"128\" height=\"46\" fill=\"url(#hatch3)\" opacity=\"{{ p.hatchOp }}\"><\/rect>\n      <sc-if value=\"{{ p.bandOn }}\" hint-placeholder-val=\"{{ true }}\">\n        <rect x=\"{{ p.bx }}\" y=\"{{ p.y }}\" width=\"5\" height=\"46\" fill=\"#D8D8D8\" stroke=\"#8a8a86\" stroke-width=\"0.6\"><\/rect>\n        <sc-for list=\"{{ p.band }}\" as=\"b\" hint-placeholder-count=\"5\">\n          <rect x=\"{{ p.bx }}\" y=\"{{ b.y }}\" width=\"5\" height=\"{{ b.h }}\" fill=\"{{ b.fill }}\" opacity=\"0.6\"><\/rect>\n        <\/sc-for>\n        <rect x=\"{{ p.bmx }}\" y=\"{{ p.bmy }}\" width=\"9\" height=\"2\" fill=\"{{ p.bmFill }}\"><\/rect>\n      <\/sc-if>\n      <text x=\"{{ p.tagX }}\" y=\"{{ p.tagY }}\" style=\"font:700 10px Tahoma;fill:#44413c\">{{ p.tag }}<\/text>\n      <text x=\"{{ p.pvX }}\" y=\"{{ p.pvY }}\" style=\"font:700 16px Tahoma;fill:#000000\">{{ p.pvT }}<\/text>\n      <text x=\"{{ p.euX }}\" y=\"{{ p.pvY }}\" style=\"font:9px Tahoma;fill:#55524c\">{{ p.euT }}<\/text>\n      <text x=\"{{ p.modeX }}\" y=\"{{ p.tagY }}\" style=\"font:700 10px Tahoma;fill:#31548F\">{{ p.modeT }}<\/text>\n      <rect x=\"{{ p.aX }}\" y=\"{{ p.aY }}\" width=\"14\" height=\"14\" fill=\"{{ p.aBg }}\" stroke=\"{{ p.aBd }}\" stroke-width=\"1\"><\/rect>\n      <text x=\"{{ p.aTx }}\" y=\"{{ p.aTy }}\" style=\"font:700 10px Tahoma;fill:{{ p.aFg }};text-anchor:middle\">{{ p.aTxt }}<\/text>\n    <\/g>\n  <\/sc-for>\n  <text x=\"24\" y=\"706\" style=\"font:10px Tahoma;fill:#6a665e\">TI312 is the bed hotspot (indication only). Fuel trips at 480 °C bed or at the TI314 / TI315 tube-skin Urgent limits — cool with quench FIC313 or lower the TIC311 preheat SP; AI316 shows excess O2.<\/text>\n<\/svg>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isAlarms }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Alarm Summary\" style=\"position:absolute;inset:0;display:flex;flex-direction:column\">\n  <div style=\"display:flex;align-items:center;gap:4px;padding:5px 8px;background:#CCC8C0;border-bottom:1px solid #9a968e;user-select:none\">\n    <div style=\"font-weight:700;font-size:13px;margin-right:8px\">ALARM SUMMARY<\/div>\n    <sc-for list=\"{{ av.filters }}\" as=\"f\" hint-placeholder-count=\"3\">\n      <div style=\"padding:3px 10px;font-size:11px;cursor:pointer;border:2px solid;border-color:{{ f.bc }};background:{{ f.bg }}\" onClick=\"{{ f.cb }}\">{{ f.label }}<\/div>\n    <\/sc-for>\n    <div style=\"margin-left:10px;padding:3px 10px;font-size:11px;cursor:pointer;border:2px solid;border-color:{{ av.helpBc }};background:{{ av.helpBg }}\" onClick=\"{{ av.helpToggle }}\">ALARM HELP<\/div>\n    <div style=\"flex:1\"><\/div>\n    <sc-for list=\"{{ av.btns }}\" as=\"b\" hint-placeholder-count=\"4\">\n      <div style=\"padding:3p h:110px\">Priority<\/div><div style=\"width:90px\">State<\/div><div style=\"width:70px\">Service<\/div><div style=\"flex:1\">Note<\/div>\n        <\/div>\n        <sc-for list=\"{{ dpt.almRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;padding:4px 8px;font-size:12.5px;background:#CFCFCB;border:1px solid #B6B6B2;border-top:none\">\n            <div style=\"width:100px;font-weight:700\">{{ r.cond }}<\/div>\n            <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:130px\"><input value=\"{{ entryText }}\" onChange=\"{{ entryChange }}\" onKeyDown=\"{{ entryKey }}\" ref=\"{{ entryRef }}\" style=\"width:100px;padding:2px 5px;font-weight:700;background:#FFFFFF;border:2px solid #31548F;outline:none\" /><\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ r.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:130px;font-weight:700;cursor:pointer;text-decoration:underline dotted\" onClick=\"{{ r.cb }}\">{{ r.tp }}<\/div>\n            <\/sc-if>\n            <div style=\"width:110px;cursor:pointer;font-weight:700;color:{{ r.prioFg }}\" onClick=\"{{ r.prioCb }}\">{{ r.prio }}<\/div>\n            <div style=\"width:90px;font-weight:700;color:{{ r.stFg }}\">{{ r.state }}<\/div>\n            <div style=\"width:70px\"><div style=\"display:inline-block;padding:1px 8px;font-size:11px;font-weight:700;cursor:pointer;background:{{ r.oosBg }};border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ r.oosCb }}\">{{ r.oosT }}<\/div><\/div>\n            <div style=\"flex:1;font-size:11px;color:#55524c\">{{ r.note }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <sc-for list=\"{{ dpt.almCfg }}\" as=\"r\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;align-items:center;padding:4px 8px;font-size:12px;background:#CFCFCB;border:1px solid #B6B6B2;border-top:none\">\n            <div style=\"width:100px;color:#3c3c3c\">{{ r.label }}<\/div>\n            <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:130px\"><input value=\"{{ entryText }}\" onChange=\"{{ entryChange }}\" onKeyDown=\"{{ entryKey }}\" ref=\"{{ entryRef }}\" style=\"width:100px;padding:2px 5px;font-weight:700;background:#FFFFFF;border:2px solid #31548F;outline:none\" /><\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ r.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:130px;font-weight:700;cursor:{{ r.cur }};text-decoration:{{ r.und }}\" onClick=\"{{ r.cb }}\">{{ r.value }}<\/div>\n            <\/sc-if>\n            <div style=\"flex:1;font-size:11px;color:#55524c\">{{ r.note }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"margin-top:10px;font-size:11px;color:#55524c\">Trip points and priorities are ENGR+ changes that need an electronic signature (password + reason) and are journaled as CONFIG entries; the number after the priority is the sub-priority (0–15, secondary sort key). OOS takes a condition out of service (ENGR+, signed): it never annunciates until RTS. Deadband and on-delay are ENGR-editable and journaled the same way. {{ dpt.almNote }} Journal alarms are logged only — no annunciation.<\/div>\n        <div style=\"margin-top:12px;background:#CFCFCB;border:1px solid #B6B6B2;padding:8px 10px\">\n          <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:6px\">\n            <div style=\"font-weight:700;font-size:12px;flex:1\">ALARM HELP<\/div>\n            <sc-for list=\"{{ dpt.helpConds }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"padding:2px 9px;font-size:11px;font-weight:700;cursor:pointer;background:{{ h.bg }};border:2px solid;border-color:{{ h.bc }}\" onClick=\"{{ h.cb }}\">{{ h.label }}<\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:11.5px;line-height:1.5\">\n            <sc-for list=\"{{ dpt.help.fields }}\" as=\"h\" hint-placeholder-count=\"6\">\n              <div style=\"font-weight:700;color:#55524c\">{{ h.k }}<\/div><div>{{ h.v }}<\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">Priority and setting come from the live point configuration; consequence, cause and action are this simulator's rationalisation for the condition.<\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ dpt.isTune }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:640px\">\n        <sc-for list=\"{{ dpt.tuneRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:center;padding:4px 8px;border-bottom:1px solid #B6B6B2;font-size:12.5px\">\n            <div style=\"width:230px;color:#3c3c3c\">{{ r.label }}<\/div>\n            <div style=\"width:110px;font-weight:700;color:#55524c;font-size:11px\">{{ r.param }}<\/div>\n            <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n              <input value=\"{{ entryText }}\" onChange=\"{{ entryChange }}\" onKeyDown=\"{{ entryKey }}\" ref=\"{{ entryRef }}\" style=\"width:100px;padding:2px 5px;font-weight:700;background:#FFFFFF;border:2px solid #31548F;outline:none\" />\n            <\/sc-if>\n            <sc-if value=\"{{ r.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:110px;font-weight:700;cursor:{{ r.cur }};text-decoration:{{ r.und }}\" onClick=\"{{ r.cb }}\">{{ r.value }}<\/div>\n            <\/sc-if>\n            <div style=\"flex:1;font-size:11px;color:#55524c\">{{ r.note }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"margin-top:10px;font-size:11px;color:#7a1a00;font-weight:700\">{{ dpt.tuneGate }}<\/div>\n        <div style=\"margin-top:4px;font-size:11px;color:#55524c\">Experion PID form: OP = K·e% + K/(T1·60)·∫e%·dt − K·T2·60·dPV%/dt, with back-calculation anti-windup and bumpless transfer. T1, T2 in minutes.<\/div>\n        <div style=\"margin-top:4px;font-size:11px;color:#55524c\">ISA standard form: OP = Kc·( e + (1/Ti)·∫e·dt + Td·de/dt ) with Kc = K, Ti = T1, Td = T2 (minutes); the parallel gains are Kp = K, Ki = K/(Ti·60) per second, Kd = K·Td·60 seconds.<\/div>\n        <div style=\"margin-top:12px;background:#CFCFCB;border:1px solid #B6B6B2;padding:8px\">\n          <div style=\"display:flex;font-size:11px;font-weight:700;margin-bottom:4px\"><div style=\"flex:1\">STEP RESPONSE — LAST {{ dpt.spark.span }}<\/div><div style=\"color:#C00000\">PV<\/div><div style=\"color:#0050C0;margin-left:8px\">SP<\/div><div style=\"color:#008000;margin-left:8px\">OP<\/div><\/div>\n          <svg viewBox=\"0 0 320 90\" preserveAspectRatio=\"none\" style=\"width:100%;height:90px;background:#FFFFFF;border:1px solid #9a968e;display:block\">\n            <line x1=\"0\" y1=\"45\" x2=\"320\" y2=\"45\" stroke=\"#DDDDDD\" stroke-width=\"1\"><\/line>\n            <polyline points=\"{{ dpt.spark.op }}\" fill=\"none\" stroke=\"#008000\" stroke-width=\"1.2\"><\/polyline>\n            <polyline points=\"{{ dpt.spark.sp }}\" fill=\"none\" stroke=\"#0050C0\" stroke-width=\"1.2\" stroke-dasharray=\"4,3\"><\/polyline>\n            <polyline points=\"{{ dpt.spark.pv }}\" fill=\"none\" stroke=\"#C00000\" stroke-width=\"1.6\"><\/polyline>\n          <\/svg>\n          <div style=\"font-size:10.5px;color:#55524c;margin-top:4px\">{{ dpt.spark.note }}<\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ dpt.isChart }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"height:100%;display:flex;flex-direction:column;gap:8px\">\n        <svg viewBox=\"0 0 1060 360\" style=\"width:100%;flex:1;min-height:220px;background:#FAFAF8;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" preserveAspectRatio=\"none\">\n          <sc-for list=\"{{ dpt.chartGrid }}\" as=\"gl\" hint-placeholder-count=\"5\">\n            <line x1=\"44\" x2=\"1050\" y1=\"{{ gl.y }}\" y2=\"{{ gl.y }}\" style=\"stroke:#DDDDD8;stroke-width:1\"><\/line>\n            <text x=\"8\" y=\"{{ gl.ty }}\" style=\"font:10px Tahoma;fill:#7a766e\">{{ gl.label }}<\/text>\n          <\/sc-for>\n          <sc-for list=\"{{ dpt.chartPens }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <polyline points=\"{{ p.pts }}\" style=\"fill:none;stroke-width:1.7;stroke:{{ p.color }};stroke-dasharray:{{ p.dash }}\"><\/polyline>\n          <\/sc-for>\n        <\/svg>\n        <div style=\"display:flex;gap:22px;font-size:12px;font-weight:700\">\n          <sc-for list=\"{{ dpt.chartPens }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:18px;height:4px;background:{{ p.color }}\"><\/div>{{ p.label }} = {{ p.val }}<\/div>\n          <\/sc-for>\n          <div style=\"flex:1\"><\/div><div style=\"color:#55524c;font-weight:400\">15 minute span · % of range<\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ dpt.isCm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:900px\">\n        <div style=\"font-weight:700;font-size:13px;margin-bottom:8px\">CONTROL MODULE {{ dpt.cm }} — chart view (as built in Control Builder)<\/div>\n        <svg viewBox=\"0 0 900 260\" style=\"width:100%;background:#EDEDE8;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\">\n          <rect x=\"10\" y=\"10\" width=\"880\" height=\"240\" fill=\"none\" stroke=\"#8a867e\" stroke-width=\"1.5\" stroke-dasharray=\"6,4\"><\/rect>\n          <text x=\"22\" y=\"32\" style=\"font:700 12px Tahoma;fill:#55524c\">CM: {{ dpt.cm }} · CEE 50 mS BASE · PERIOD 500 mS (SIM) · C300-SIM<\/text>\n          <sc-for list=\"{{ dpt.cmBlocks }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <rect x=\"{{ b.x }}\" y=\"90\" width=\"150\" height=\"90\" fill=\"#D8D8D4\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\/rect>\n            <text x=\"{{ b.lx }}\" y=\"112\" style=\"font:700 12px Tahoma;fill:#000\">{{ b.name }}<\/text>\n            <text x=\"{{ b.lx }}\" y=\"128\" style=\"font:10px Tahoma;fill:#55524c\">{{ b.type }}<\/text>\n            <text x=\"{{ b.lx }}\" y=\"146\" style=\"font:10px Tahoma;fill:#55524c\">ORDERINCM {{ b.ord }}<\/text>\n            <text x=\"{{ b.lx }}\" y=\"162\" style=\"font:10px Tahoma;fill:#31548F\">{{ b.note }}<\/text>\n          <\/sc-for>\n          <sc-for list=\"{{ dpt.cmWires }}\" as=\"w\" hint-placeholder-count=\"3\">\n            <path d=\"{{ w.d }}\" style=\"stroke:#31548F;stroke-width:2;fill:none\"><\/path>\n            <text x=\"{{ w.tx }}\" y=\"{{ w.ty }}\" style=\"font:10px Tahoma;fill:#31548F\">{{ w.label }}<\/text>\n          <\/sc-for>\n        <\/svg>\n        <div style=\"margin-top:8px;font-size:11px;color:#55524c;line-height:1.5\">{{ dpt.cmNote }}<\/div>\n      <\/div>\n    <\/sc-if>\n\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isInstr }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Instructor Station\" style=\"position:absolute;inset:0;display:flex;flex-direction:column\">\n  <div style=\"display:flex;align-items:center;gap:8px;padding:5px 8px;background:#41608A;color:#FFFFFF;border-bottom:1px solid #22344e;user-select:none\">\n    <div style=\"font-weight:700;font-size:13px\">INSTRUCTOR STATION<\/div>\n    <div style=\"font-size:10.5px;padding:1px 8px;background:#D4D0C8;color:#000\">{{ instr.authT }}<\/div>\n    <div style=\"font-size:11px\">SIM {{ instr.run.simT }} · UPTIME {{ instr.run.upT }} · {{ instr.run.stateT }}<\/div>\n    <div style=\"flex:1\"><\/div>\n    <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#000;background:{{ instr.hidden.bg }};border:2px solid;border-color:{{ instr.hidden.bc }}\" onClick=\"{{ instr.hidden.cb }}\">{{ instr.hidden.label }}<\/div>\n    <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#000;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ instr.close }}\">TRAINEE VIEW<\/div>\n    <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#000;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ instr.lock }}\">LOCK<\/div>\n  <\/div>\n  <div style=\"font-size:10.5px;color:#3c3c3c;padding:4px 10px;background:#CCC8C0;border-bottom:1px solid #9a968e\">{{ instr.hiddenNote }}<\/div>\n  <div style=\"flex:1;overflow-y:auto;padding:10px 12px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:10px;max-width:1400px\">\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">RUN CONTROL<\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">\n          <div style=\"padding:4px 12px;font-weight:700;cursor:pointer;background:{{ instr.run.freeze.bg }};border:2px solid;border-color:{{ instr.run.freeze.bc }}\" onClick=\"{{ instr.run.freeze.cb }}\">{{ instr.run.freeze.label }}<\/div>\n          <div style=\"padding:4px 12px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ instr.run.stepOne.cb }}\">{{ instr.run.stepOne.label }}<\/div>\n          <div style=\"padding:4px 12px;font-weight:700;cursor:pointer;background:{{ instr.run.runBtn.bg }};border:2px solid;border-color:{{ instr.run.runBtn.bc }}\" onClick=\"{{ instr.run.runBtn.cb }}\">{{ instr.run.runBtn.label }}<\/div>\n          <sc-for list=\"{{ instr.run.speeds }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"padding:4px 10px;font-weight:700;cursor:pointer;background:{{ s.bg }};border:2px solid;border-color:{{ s.bc }}\" onClick=\"{{ s.cb }}\">{{ s.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11.5px\">\n          <div>Random seed <b>{{ instr.seedT }}<\/b><\/div>\n          <input value=\"{{ instr.seedVal }}\" onChange=\"{{ instr.seedChange }}\" onKeyDown=\"{{ instr.seedKey }}\" placeholder=\"new seed\" style=\"width:110px;padding:2px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none;font-size:11.5px\" />\n          <div style=\"padding:2px 10px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ instr.seedGo }}\">SET SEED<\/div>\n        <\/div>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:4px\">Every random draw (measurement noise, drill timing) comes from this seed. Snapshots store the seed and the generator position, so a restore or a replay repeats the same run.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">BACKTRACK<\/div>\n        <div style=\"font-size:11.5px;margin-bottom:6px\">{{ instr.back.count }} automatic snapshots, one every 30 s of sim time, covering the last {{ instr.back.spanT }} (oldest {{ instr.back.oldestT }}).<\/div>\n        <div style=\"display:flex;gap:6px\">\n          <sc-for list=\"{{ instr.back.btns }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ b.cb }}\">{{ b.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">A backtrack restores the process, the alarm list, the trends and the journal to that moment; the trainee's later actions are dropped.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">SNAPSHOTS<\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:11.5px\">\n          <div>Name for the next save:<\/div>\n          <input value=\"{{ instr.snapName }}\" onChange=\"{{ instr.snapNameChange }}\" placeholder=\"optional\" style=\"flex:1;padding:2px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none;font-size:11.5px\" />\n        <\/div>\n        <sc-for list=\"{{ instr.slots }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:1px solid #B6B6B2;font-size:11.5px\">\n            <div style=\"width:16px;font-weight:700\">{{ s.n }}<\/div>\n            <div style=\"flex:1\">{{ s.name }}<\/div>\n            <div style=\"width:60px;color:#55524c\">{{ s.t }}<\/div>\n            <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ s.save }}\">SAVE<\/div>\n            <sc-if value=\"{{ s.has }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#B8C4D4;border:1px solid #31548F\" onClick=\"{{ s.restore }}\">RESTORE<\/div>\n              <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ s.replay }}\">REPLAY<\/div>\n              <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ s.clear }}\">✕<\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">INITIAL CONDITIONS<\/div>\n        <sc-for list=\"{{ instr.presets }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:4px 4px;border-bottom:1px solid #B6B6B2\">\n            <div style=\"flex:1\"><div style=\"font-size:11.5px;font-weight:700\">{{ p.label }}<\/div><div style=\"font-size:10.5px;color:#55524c\">{{ p.desc }}<\/div><\/div>\n            <div style=\"padding:3px 12px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ p.cb }}\">LOAD<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">Loading an initial condition resets the process, runs it to the stated condition with the current seed and loads the result as a snapshot. Saved slots are kept.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"display:flex;align-items:center;margin-bottom:6px\"><div style=\"font-weight:700;font-size:12px;flex:1\">UPSETS<\/div>\n          <div style=\"padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ instr.clearUpsets }}\">CLEAR ALL<\/div><\/div>\n        <sc-for list=\"{{ instr.upsets }}\" as=\"u\" hint-placeholder-count=\"12\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:2px 4px;font-size:11.5px;border-bottom:1px solid rgba(0,0,0,0.06)\">\n            <input type=\"checkbox\" checked=\"{{ u.on }}\" onChange=\"{{ u.cb }}\" />\n            <div style=\"width:26px;font-size:10px;color:#55524c\">{{ u.unit }}<\/div>\n            <div style=\"flex:1\">{{ u.label }}<\/div>\n            <sc-if value=\"{{ u.hasMag }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:10.5px;color:#55524c\">{{ u.magLabel }}<\/div>\n              <input type=\"range\" min=\"{{ u.magMin }}\" max=\"{{ u.magMax }}\" step=\"{{ u.magStep }}\" value=\"{{ u.magVal }}\" onChange=\"{{ u.magChange }}\" style=\"width:90px\" />\n              <div style=\"width:74px;font-size:10.5px;font-weight:700\">{{ u.magT }}<\/div>\n            <\/sc-if>\n            <div style=\"width:48px;text-align:right;font-size:10px;font-weight:700;color:#A00000\">{{ u.stateT }}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">INSTRUCTOR VARIABLES<\/div>\n        <sc-for list=\"{{ instr.vars }}\" as=\"v\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:3px 4px;font-size:11.5px;border-bottom:1px solid rgba(0,0,0,0.06)\">\n            <div style=\"width:150px\">{{ v.label }}<\/div>\n            <input type=\"range\" min=\"{{ v.min }}\" max=\"{{ v.max }}\" step=\"{{ v.step }}\" value=\"{{ v.val }}\" onChange=\"{{ v.change }}\" style=\"flex:1\" />\n            <div style=\"width:96px;font-weight:700\">{{ v.valT }}<\/div>\n            <div style=\"padding:1px 6px;font-size:10px;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ v.reset }}\">DESIGN<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">Plant conditions the trainee cannot see: the models read them directly, and they travel with snapshots and initial conditions.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"display:flex;align-items:center;margin-bottom:6px\"><div style=\"font-weight:700;font-size:12px;flex:1\">ACTION JOURNAL ({{ instr.journal.count }})<\/div>\n          <sc-if value=\"{{ instr.journal.replayOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:10.5px;font-weight:700;color:#31548F;margin-right:8px\">{{ instr.journal.replayT }}<\/div>\n            <div style=\"padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E;margin-right:4px\" onClick=\"{{ instr.journal.toEnd }}\">TO END<\/div>\n            <div style=\"padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E;margin-right:4px\" onClick=\"{{ instr.journal.stop }}\">STOP<\/div>\n          <\/sc-if>\n          <div style=\"padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ instr.journal.clear }}\">CLEAR<\/div><\/div>\n        <sc-if value=\"{{ instr.journal.empty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11px;color:#55524c\">No actions journaled yet.<\/div><\/sc-if>\n        <sc-for list=\"{{ instr.journal.rows }}\" as=\"j\" hint-placeholder-count=\"8\">\n          <div style=\"font-family:Consolas,Menlo,monospace;font-size:11px;padding:1px 4px;border-bottom:1px solid rgba(0,0,0,0.05)\">{{ j.txt }}<\/div>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">{{ instr.journal.note }}<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">ASSESSMENT<\/div>\n        <div style=\"font-size:11.5px;font-weight:700\">{{ instr.assess.name }}<\/div>\n        <sc-if value=\"{{ instr.assess.on }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;font-size:11px;color:#55524c;margin:2px 0 6px\"><div>Elapsed {{ instr.assess.tm }} · {{ instr.assess.phase }}<\/div><div style=\"flex:1\"><\/div>\n            <div style=\"padding:2px 10px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E;color:#000\" onClick=\"{{ instr.assess.end }}\">END DRILL<\/div><\/div>\n          <sc-for list=\"{{ instr.assess.rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;padding:2px 4px;font-size:11.5px;border-bottom:1px solid #B6B6B2\"><div style=\"width:200px;color:#3c3c3c\">{{ r.k }}<\/div><div style=\"font-weight:700;color:{{ r.fg }}\">{{ r.v }}<\/div><\/div>\n          <\/sc-for>\n        <\/sc-if>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">{{ instr.assess.stats }}<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">INSTRUCTOR LOG<\/div>\n        <sc-if value=\"{{ instr.logEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11px;color:#55524c\">Nothing yet.<\/div><\/sc-if>\n        <sc-for list=\"{{ instr.log }}\" as=\"e\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;gap:8px;font-size:11px;padding:1px 4px;border-bottom:1px solid rgba(0,0,0,0.05)\"><div style=\"width:60px;color:#55524c\">{{ e.t }}<\/div><div>{{ e.txt }}<\/div><\/div>\n        <\/sc-for>\n      <\/div>\n\n    <\/div>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isSys }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"System Status\" style=\"position:absolute;inset:0;overflow-y:auto;padding:16px\">\n  <div style=\"font-weight:700;font-size:14px;margin-bottom:12px\">SYSTEM STATUS<\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:12px;max-width:1100px\">\n    <sc-for list=\"{{ sysPanels }}\" as=\"p\" hint-placeholder-count=\"6\">\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:10px\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n          <div style=\"width:10px;height:10px;border-radius:50%;background:{{ p.led }};border:1px solid #55524c\"><\/div>\n          <div style=\"font-weight:700;font-size:12px\">{{ p.title }}<\/div>\n        <\/div>\n        <sc-for list=\"{{ p.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;font-size:11.5px;padding:2px 0\"><div style=\"width:150px;color:#55524c\">{{ r.k }}<\/div><div style=\"font-weight:700\">{{ r.v }}<\/div><\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n  <div style=\"margin-top:16px;max-width:1100px;background:#CFCFCB;border:1px solid #B6B6B2;padding:10px;font-size:11.5px;color:#3c3c3c;line-height:1.55\">\n    This is an independent, browser-based training simulator that reproduces the behavior, layout, and color logic of an Experion PKS operator station for education. It contains no Honeywell software or artwork and is not affiliated with, endorsed by, or a product of Honeywell. Alarm colors, summary columns, and key legends are representative defaults — real sites configure these. Experion® is a trademark of Honeywell International Inc.\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isKpi }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Alarm KPI\" style=\"position:absolute;inset:0;display:flex;flex-direction:column\">\n  <div style=\"display:flex;align-items:center;gap:4px;padding:5px 8px;background:#CCC8C0;border-bottom:1px solid #9a968e;user-select:none\">\n    <div style=\"font-weight:700;font-size:13px;margin-right:8px\">ALARM SYSTEM PERFORMANCE<\/div>\n    <sc-for list=\"{{ kpi.spans }}\" as=\"s\" hint-placeholder-count=\"3\">\n      <div style=\"padding:3px 10px;font-size:11px;cursor:pointer;border:2px solid;border-color:{{ s.bc }};background:{{ s.bg }}\" onClick=\"{{ s.cb }}\">{{ s.label }}<\/div>\n    <\/sc-for>\n    <div style=\"flex:1\"><\/div>\n    <div style=\"padding:3px 14px;font-weight:700;font-size:12px;background:{{ kpi.verdictBg }};color:{{ kpi.verdictFg }};border:1px solid #55524c\">{{ kpi.verdict }}<\/div>\n  <\/div>\n  <div style=\"flex:1;overflow-y:auto;padding:12px 16px\">\n    <div style=\"font-size:11px;color:#55524c;margin-bottom:8px\">{{ kpi.windowTxt }}<\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:8px;max-width:1240px;margin-bottom:12px\">\n      <sc-for list=\"{{ kpi.tiles }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n          <div style=\"font-size:10.5px;color:#55524c;text-transform:uppercase\">{{ t.label }}<\/div>\n          <div style=\"font-size:20px;font-weight:700;color:{{ t.fg }}\">{{ t.value }}<\/div>\n          <div style=\"font-size:10.5px;color:#55524c\">{{ t.sub }}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1240px\">\n      <div style=\"background:#CFCFCB;border:1px solid #B6B6B2;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">HEALTH CHECKS (ISA-18.2 / EEMUA 191 TARGETS)<\/div>\n        <div style=\"display:flex;font-size:10.5px;font-weight:700;color:#55524c;border-bottom:1px solid #B6B6B2;padding-bottom:2px\"><div style=\"flex:1\">Metric<\/div><div style=\"width:80px;text-align:right\">Value<\/div><div style=\"width:80px;text-align:right\">Target<\/div><div style=\"width:60px;text-align:right\">Result<\/div><\/div>\n        <sc-for list=\"{{ kpi.checks }}\" as=\"c\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;font-size:11.5px;padding:3px 0;border-bottom:1px solid rgba(0,0,0,0.05)\"><div style=\"flex:1\">{{ c.label }}<\/div><div style=\"width:80px;text-align:right;font-weight:700\">{{ c.value }}<\/div><div style=\"width:80px;text-align:right;color:#55524c\">{{ c.limit }}<\/div><div style=\"width:60px;text-align:right;font-weight:700;color:{{ c.fg }}\">{{ c.res }}<\/div><\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"background:#CFCFCB;border:1px solid #B6B6B2;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">PRIORITY DISTRIBUTION vs 80 / 15 / 5<\/div>\n        <sc-for list=\"{{ kpi.prio }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;font-size:11.5px;padding:3px 0\"><div style=\"width:70px;font-weight:700\">{{ p.label }}<\/div><div style=\"flex:1;height:12px;background:#BDBDB9;position:relative\"><div style=\"height:12px;width:{{ p.w }}%;background:{{ p.color }}\"><\/div><\/div><div style=\"width:110px;text-align:right\">{{ p.txt }}<\/div><\/div>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:4px\">{{ kpi.prioNote }}<\/div>\n        <div style=\"font-weight:700;font-size:12px;margin:12px 0 6px\">FLOODS · CHATTERING · STANDING<\/div>\n        <sc-for list=\"{{ kpi.lists }}\" as=\"l\" hint-placeholder-count=\"3\">\n          <div style=\"font-size:11.5px;padding:2px 0\"><span style=\"font-weight:700;color:#55524c\">{{ l.k }}<\/span> {{ l.v }}<\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"background:#CFCFCB;border:1px solid #B6B6B2;padding:8px 10px;grid-column:1 / span 2\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">TOP-10 BAD ACTORS (SHARE OF ALARM LOAD)<\/div>\n        <sc-if value=\"{{ kpi.actorsEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:#55524c\">No alarms in the window.<\/div><\/sc-if>\n        <sc-for list=\"{{ kpi.actors }}\" as=\"a\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;fo
