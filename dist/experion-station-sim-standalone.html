 // Sub-priority 0..15 per condition (Experion LX HMI spec, RESOURCES 2.1); trip-class alarms sit at the top of their priority band.\n\n\n\n  // Alarm Help (RESOURCES 2.2 pane, PAS rationalisation fields 2.10): priority and setting come from the live configuration.\n  alarmHelpFor(tag,cond){\n    const l=this.L[tag]; const tup=l&&l.alm&&l.alm[cond]; const rec=this.alarmEngine.get(tag+'.'+cond);\n    const cfg={tripPoint:this.tripPointOf(tag,cond), eu:l?l.eu:(rec?rec.eu:''), prio:tup?tup[1]:(rec?rec.prio:''), subprio:this.subprioOf(tag,cond)};\n    return ESS.AlarmHelp.resolve(tag,cond,cfg);\n  }\n  helpFields(h){ return [['Priority',h.priority],['Setting',h.setting],['Response time',h.responseTime],['Consequence',h.consequence],['Probable cause',h.probableCause],['Corrective action',h.correctiveAction]].map(x=>({k:x[0],v:x[1]})); }\n  // ---------- asset / location tree (RESOURCES 2.2) ----------\n\n  assetOf(tag){ const n=this.assetTree().find(x=>x.tags&&x.tags.includes(tag)); return n?n.id:null; }\n\n  // active = annunciated live alarms (UNACK/ACKED); unack = UNACK + RTNUN, matching the status-bar counter\n  assetCounts(){\n    const out={}; const recs=this.alarmEngine.list();\n    for(const n of this.assetTree()){\n      let active=0, unack=0;\n      for(const a of recs){ if(!this.assetMatch(n.id,a.tag)) continue; if(a.state==='UNACK'||a.state==='ACKED') active++; if(a.state==='UNACK'||a.state==='RTNUN') unack++; }\n      out[n.id]={active,unack};\n    }\n    return out;\n  }\n  // Live value column: the point PV (PV−SP for DEVHI); equipment trips read the model variable they protect.\n  liveValueOf(a){\n    const l=this.L[a.tag], P=this.P;\n    if(l){ if(l.kind==='motor') return l.run?1:0; return a.cond==='DEVHI'?(l.pv-l.sp):l.pv; }\n    if(a.tag==='H-310' && a.cond==='TUBE SKIN TRIP') return Math.max(P.h.ts1,P.h.ts2);\n    return ({'TK-101':P.tankL,'R-201':P.rT,'V-401':P.drumP,'R-202':P.b.T,'R-310':P.h.bed,'H-310':P.h.pre})[a.tag];\n  }\n  liveDec(a){ const l=this.L[a.tag]; return l?l.dec:(({'V-401':0,'R-310':0,'H-310':0})[a.tag]??1); }\n  // ---------- saved views ----------\n  builtinViews(){ return ['U1','U2','U3','U4'].map(u=>({name:u+' ALL',asset:u,view:'MAIN',builtin:true})); }\n  savedViewName(){ return (this.state.almAsset||'PLANT')+' '+(this.state.shelfView==='MAIN'?'ALL':this.state.shelfView); }\n  saveView(){\n    const v={name:this.savedViewName(),asset:this.state.almAsset||'PLANT',view:this.state.shelfView};\n    if(this.builtinViews().concat(this.state.savedViews).some(x=>x.name===v.name)){ this.msgZone('VIEW ALREADY SAVED: '+v.name); return; }\n    this.setState({savedViews:this.state.savedViews.concat([v])});\n    this.addEvent('OPERATOR','STN01','ALARM VIEW SAVED: '+v.name,'','');\n    this.msgZone('VIEW SAVED: '+v.name);\n  }\n  applyView(v){ this.setState({almAsset:v.asset,shelfView:v.view,display:'alarms'}); }\n  // ---------- per-alarm comment (RESOURCES 2.2), OPER+ ----------\n  openComment(){\n    const a=this.alarmEngine.get(this.state.selAlm); if(!a){ this.msgZone('NO ALARM SELECTED'); return; }\n    if(!this.can('OPER')) return;\n    this.setState({dlg:{type:'comment'},dlgReason:a.comment||''});\n  }\n  commentAlarm(text){ return this.commentAlarmKey(this.state.selAlm,text); }\n\n  // ---------- alarm KPI over the raise/rtn/ack log (ESS.Kpi; exida and alarm-performance-analyser thresholds, RESOURCES 2.7, 2.8) ----------\n  kpiSpans(){ return [10,30,60,0]; }   // minutes; 0 = whole session\n  kpiMetrics(span){\n    if(span==null) span=this.state.kpiSpan;\n    const t1=this.P.t, t0=span>0?t1-span*60000:this.t0;\n    // stale threshold scaled for a training session: 10 min standing instead of the 24 h plant figure\n    return ESS.Kpi.computeMetrics(this.alarmLog,{t0,t1,staleAfterMs:10*60000});\n  }\n  // Alarm Tracker (RESOURCES 2.2): raises per minute per unit over the last `mins` minutes\n  trackerLanes(mins){\n    const t1=this.P.t, t0=t1-mins*60000, lanes={U1:[],U2:[],U3:[],U4:[]};\n    for(const u in lanes) lanes[u]=new Array(mins).fill(0);\n    for(const e of this.alarmLog){ if(e.type!=='raise'||e.prio==='Journal'||e.t<t0||e.t>t1) continue; const u=this.unitOf(e.tag); if(!lanes[u]) continue; const i=Math.min(mins-1,Math.floor((e.t-t0)/60000)); lanes[u][i]++; }\n    return lanes;\n  }\n  // Dynamic Alarm Suppression map (Experion Alarming PIN, RESOURCES 2.2): a live trigger parks its consequential alarms in DSUPR.\n  // Dynamic Alarm Suppression map: trigger alarm key -> consequential alarm keys\n  // (Experion Alarming PIN, RESOURCES 2.2). Deviation from the v2 plan: the\n  // plan names FIC211 PVLO under M202 TRIP, but the monomer feed idles at zero\n  // flow outside the FEED phase, so a fixed PVLO would be a standing alarm.\n  // The agitator trip therefore suppresses the jacket-temperature consequence\n  // (TIC213 PVHI) until state-based limits arrive in B4.\n\n  // A source under a disabled asset is parked BEFORE the engine sees the raise: a condition with no record yet is created\n  // straight in OOSRV from the raise arguments, and the engine's raise on an OOSRV record only marks the condition live\n  // (no ALARM descriptor, so no horn, no ALARM journal line, no KPI alarm-log row); re-enable then annunciates it.\n\n\n\n  shelfScan(){ this.alarmTick(); }\n  // Journal every engine descriptor through addEvent: ALARM on entry, RTN on return (two events per alarm, RESOURCES 2.1)\n  // plus ACK / SHELVE / UNSHELVE / SUPPRESS / OOS. The horn re-arms only when something lands in UNACK.\n\n\n  // Out of service needs an electronic signature (RESOURCES 2.12); return to service is an ENGR action. Both are CONFIG changes.\n\n\n  beep(freq,dur){ try{ if(!this.actx) this.actx=new (window.AudioContext||window.webkitAudioContext)(); const c=this.actx; if(c.state==='suspended') c.resume(); const o=c.createOscillator(), g=c.createGain(); o.type='square'; o.frequency.value=freq; g.gain.value=0.05; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur); }catch(e){} }\n\n  // ---------- simulation ----------\n  tick(){\n    if(!this.L) this.initSim();\n    const n=this.state.speed;\n    for(let i=0;i<n;i++) this.step(0.5);\n    if(this.state.msg && this.P.t-this.state.msgT>9000) this.state.msg='';\n    const aud=(this.props.audible??true)&&this.state.aud;\n    const top=this.hornTop();\n    if(aud && top && !this.state.silenced){\n      if(top.prio==='Urgent'){ this.beep(880,0.12); setTimeout(()=>this.beep(880,0.12),200); }\n      else if(top.prio==='High'){ this.beep(640,0.14); }\n      else if((this.state.tk%4)===0){ this.beep(460,0.1); }\n    }\n    this.setState(s=>({tk:s.tk+1, blink:!s.blink}));\n  }\n  topUnack(){ return this.alarmEngine.topUnack(); }\n  // audible only while UNACK; RTNUN flashes but stays silent (RESOURCES 2.6)\n  hornTop(){ const E=this.alarmEngine; return E.unacked().filter(a=>E.indication(a.state,a.prio).audible).sort(E.compare)[0]||null; }\n\n  // Tags with history (trends, sparkline, assistant slope); one list so initSim and step cannot drift apart.\n\n  // Callback bundle for ESS.Models: the module never touches the Component, it reports through these.\n\n\n\n\n  // Valve response watch for the assistant: seconds each valve has failed to follow the position its controller (or an\n  // active trip) asks for. A stuck valve shows on one valve; an instrument-air loss shows on several at once.\n\n\n\n  laggingValves(){ const out=[]; for(const id in this.vLag) if(this.vLag[id]>=10) out.push(id); return out; }\n  // U2: Lucia/Engell semi-batch model + SCM202 (ESS.Models), then the station-side additions: the adiabatic end\n  // temperature indication and the state-based alarm limit set that follows the sequence phase (ISA-TR18.2.6, RESOURCES 2.19).\n\n  // Sequence prompts that need an operator confirm (Message Summary confirm, RESOURCES 2.12): charge complete, batch complete.\n\n  // U3: Badgwell two-pass fired heater + fixed bed (ESS.Models), then the tube-skin and excess-O2 indications.\n  // Unit 04 (two-chamber weir separator): the whole unit lives in ESS.Models.stepU4, including its\n  // own measurements from ctx.rand4 and the PSV-502 trip; nothing here reads the shared stream.\n\n\n  // Station-side interlocks evaluated after the alarm scan (they act on alarm conditions, not raw values, so\n  // deadband and on-delay apply): TI216 Urgent sheds the monomer feed and holds the sequence; TI314/TI315\n  // Urgent shuts off the fuel gas exactly like the bed trip.\n\n  // TI216 Urgent: the interlock owns FIC211 (MAN, OP 0, MV-211 closed) for as long as the condition stands, and holds\n  // the sequence when it is feeding. It is level-held, not edge-triggered: operator MODE/OP/SP stores on FIC211 and\n  // RESUME are refused while it is active (operatorMayWrite / seqCmd), and enforceTadShed re-asserts the shed every scan.\n\n\n\n  // The button reads HOLD (not RESUME) while the TI216 interlock holds the sequence: pressing it is the operator's\n  // hold order, so it is journaled and credited to a drill even though the interlock got there first; RESUME is not\n  // offered until the interlock releases (releaseTadShed), so it can never be refused.\n\n  // Interlock ownership of FIC211 (operator stores refused with a callout while the TI216 shed stands).\n\n  // The SCM restores the mode of a loop it takes ownership of: when FIC211 becomes PROGRAM (FEED entered or resumed)\n  // and the loop was left in MAN (after a shed, or by the operator), the sequence puts it back in AUTO and journals it.\n\n  // ---------- state-based alarm limits (ISA-TR18.2.6 pattern, InTech state-based limit table; RESOURCES 2.19, ISA-88 phases) ----------\n  // One limit set per SCM202 phase; HELD is its own state (feed stopped on purpose). A condition mapped to null is\n  // disabled for that phase (removed from the point, any active alarm returned to normal).\n\n\n  phaseSetTags(){ return Object.keys(this.phaseSets().IDLE); }\n\n\n\n\n\n  diagnose(){\n    const P=this.P,L=this.L,V=this.V,S=this.state,out=[];\n    const gFp=(tag)=>()=>{ this.setState({display:'graphic'}); this.openFp(tag); };\n    const gDet=(tag)=>()=>this.nav('detail',tag);\n    const gAlm=()=>this.nav('alarms');\n    const gTg=(g)=>()=>{ this.setState({tg:g}); this.nav('trend'); };\n    const gSeq=()=>{ this.setState({unit:'U2'}); this.nav('graphic'); };   // SCM202 START / HOLD / ABORT live on the U2 graphic\n    const slope=(tag,sec)=>{ const hh=this.hist[tag]; if(!hh||hh.length<5) return 0; const nn=Math.min(hh.length-1,Math.round(sec*2)); const a=hh[hh.length-1-nn], b2=hh[hh.length-1]; const dts=(b2[0]-a[0])/1000; return dts>0?(b2[1]-a[1])/dts:0; };\n    if(P.trips.rx) out.push({id:'trip.rx',sev:'URGENT',title:'R-201 high-temperature trip active',why:'The reactor exceeded 185 °C and the trip closed feed valve FV-102. It resets below 160 °C.',steps:[{t:'Silence and acknowledge the trip alarms.',go:()=>gAlm()},{t:'Verify maximum cooling — TIC202 in CAS, TV-202 open.',go:gFp('TIC202')},{t:'Watch TIC201 fall on trend TG01.',go:gTg('TG01')},{t:'Re-establish feed slowly after the trip clears.',go:gFp('FIC102')}]});\n    if(P.trips.batch) out.push({id:'trip.b',sev:'URGENT',title:'R-202 batch overtemp trip',why:'Batch temperature reached 110 °C. Monomer feed is cut and the jacket driven full cold until T < 70 °C.',steps:[{t:'Acknowledge alarms; confirm monomer feed is zero.',go:gFp('FIC211')},{t:'Keep the agitator running for heat removal.',go:gFp('M202')},{t:'The sequence resumes in COOL when the trip clears.'}]});\n    if(P.trips.bed) out.push({id:'trip.bed',sev:'URGENT',title:'R-310 bed overtemp trip — fuel shut off',why:'The hotspot reached 480 °C; fuel gas is isolated until the bed cools below 400 °C.',steps:[{t:'Acknowledge; verify quench flow is available.',go:gFp('FIC313')},{t:'Lower the TIC311 SP before relight to avoid a repeat.',go:gFp('TIC311')}]});\n    if(P.trips.ovf) out.push({id:'trip.ovf',sev:'URGENT',title:'TK-101 overflow protection active',why:'Tank level reached 98% and unit feed was isolated.',steps:[{t:'Increase outlet flow to draw the level down.',go:gFp('FIC102')},{t:'Acknowledge alarms; feed restores below 90%.',go:()=>gAlm()}]});\n    if(P.trips.skin) out.push({id:'trip.skin',sev:'URGENT',title:'H-310 tube-skin trip — fuel shut off',why:'A tube skin (TI314 / TI315) reached its Urgent limit; fuel gas is isolated until both skins are below 400 °C. Keep feed flowing through the tubes so the metal cools.',steps:[{t:'Acknowledge; confirm FV-311 closed and FIC310 flow present.',go:gFp('FIC310')},{t:'Lower the TIC311 SP before relight; watch the skins on TG05.',go:gTg('TG05')}]});\n    if(this.tadShed) out.push({id:'shed.tad',sev:'URGENT',title:'Monomer feed shed by TI216'+(P.b.held?' — sequence HELD':''),why:'The adiabatic end temperature reached its Urgent limit ('+this.fmt(L.TI216.alm.PVHH?L.TI216.alm.PVHH[0]:106,0)+' °C): the unreacted monomer alone could carry the batch to the 110 °C trip. The interlock holds FIC211 in MAN with MV-211 closed and refuses RESUME until the Urgent alarm clears.',steps:[{t:'Confirm M-202 running and the jacket on full cooling.',go:gFp('TIC213')},{t:'Wait for the monomer inventory and TI216 to fall.',go:gTg('TG04')},{t:'When the Urgent alarm clears, RESUME the sequence — the SCM returns FIC211 to AUTO itself.',go:gSeq}]});\n    if(P.trips.psv) out.push({id:'trip.psv',sev:'URGENT',title:'V-401 relief valve lifted',why:'Drum pressure exceeded 950 kPa and is venting to flare.',steps:[{t:'Verify PIC401 is in AUTO and the vent is opening.',go:gFp('PIC401')},{t:'Reduce heat input at TIC301.',go:gFp('TIC301')}]});\n    for(const mt of ['P101','M202']){ const m=L[mt]; if(m.trip) out.push({id:'mtrip.'+mt,sev:'URGENT',title:(mt==='P101'?'P-101 pump tripped':'M-202 agitator tripped')+(m.lock>0?' — lockout '+Math.ceil(m.lock)+' s':''),why:(m.tripWhy||'Uncommanded stop')+'. '+(mt==='M202'?'Without agitation heat transfer collapses and unreacted monomer accumulates — it reacts all at once on restart.':'Downstream flow is lost and affected controllers wind up.'),steps: mt==='M202'?[{t:'Cut monomer feed first — HOLD the sequence (FIC211 is program-owned during FEED; its faceplate refuses MAN / OP stores).',go:gSeq},{t:'Watch TIC212 and the monomer inventory bar.',go:gFp('TIC212')},{t:'Restart the agitator only after the feed is stopped.',go:gFp('M202')}]:[{t:'Put FIC102 in MAN, OP 0 to prevent windup.',go:gFp('FIC102')},{t:'Wait out the lockout, then START.',go:gFp('P101')},{t:'Restore AUTO / CAS and bring flow back gently.'}]}); }\n    if(!P.trips.rx && P.rT>162 && slope('TIC201',20)>0.04) out.push({id:'risk.rx',sev:'URGENT',title:'R-201 temperature rising — runaway risk',why:'Reaction heat rises exponentially with temperature while jacket cooling is only linear. Act before the 185 °C trip.',steps:[{t:'Check TV-202 position against TIC202 output.',go:gFp('TIC202')},{t:'Cut feed — FIC102 to MAN, OP about 20 % — to arrest the exotherm.',go:gFp('FIC102')},{t:'Track the exotherm on trend TG01; wait for TIC201 to turn down.',go:gTg('TG01')},{t:'Feed cut fills TK-101: before LIC101 reaches high level (80 %) and once TIC201 is falling, restore feed — FIC102 OP back toward 60 % or CAS so LIC101 draws the tank down.',go:gFp('LIC101')},{t:'Confirm R-201 is cooling before returning TIC201 / TIC202 to normal operation.',go:gFp('TIC201')}]});\n    if(!P.trips.bed && P.h.bed>435) out.push({id:'risk.bed',sev:'WARN',title:'R-310 bed hotspot climbing ('+Math.round(P.h.bed)+' °C)',why:'The bed exotherm grows with temperature; the fuel trip operates at 480 °C.',steps:[{t:'Raise quench flow FIC313.',go:gFp('FIC313')},{t:'Lower the preheater SP at TIC311.',go:gFp('TIC311')}]});\n    if(!this.tadShed && !P.trips.batch && (P.b.phase==='FEED'||P.b.phase==='REACT') && L.TI216.alm.PVHI && P.b.Tad>L.TI216.alm.PVHI[0]-4) out.push({id:'risk.tad',sev:'WARN',title:'R-202 adiabatic end temperature '+Math.round(P.b.Tad)+' °C',why:'If cooling were lost now, the unreacted monomer would take the batch to about '+Math.round(P.b.Tad)+' °C. Reduce the inventory before it reaches the Urgent limit, where the station sheds the feed automatically.',steps:[{t:'Reduce the monomer feed or HOLD the sequence.',go:gFp('FIC211')},{t:'Confirm the agitator is running.',go:gFp('M202')},{t:'Watch TI216 against TIC212 on TG04.',go:gTg('TG04')}]});\n    const skinHi=Math.max(P.h.ts1,P.h.ts2);\n    if(!P.trips.skin && L.TI315.alm.PVHI && skinHi>L.TI315.alm.PVHI[0]) out.push({id:'risk.skin',sev:'WARN',title:'H-310 tube skin high ('+Math.round(skinHi)+' °C)',why:'Tube metal is running hotter than its continuous rating — usually firing raised faster than the feed can absorb, or low flow through the passes. The fuel trips at the Urgent limit.',steps:[{t:'Reduce the TIC311 setpoint or, in MAN, lower the output.',go:gFp('TIC311')},{t:'Confirm FIC310 feed flow through the tubes.',go:gFp('FIC310')},{t:'Watch TI314 / TI315 against the outlet on TG05.',go:gTg('TG05')}]});\n    if(L.AI316._as.PVLO) out.push({id:'o2.low',sev:'WARN',title:'H-310 excess O2 low — air register lagging',why:'Fuel was raised faster than the combustion air followed; sub-stoichiometric firing wastes fuel and drives the tube skins up.',steps:[{t:'Hold the TIC311 output until AI316 recovers above 2 %.',go:gFp('TIC311')},{t:'Watch the skins on TG05.',go:gTg('TG05')}]});\n    if(!L.M202.trip && !L.M202.run && (P.b.phase==='FEED'||P.b.Cm>15)) out.push({id:'risk.acc',sev:'URGENT',title:'Agitator stopped — monomer accumulating',why:'With no mixing the reaction nearly stops but feed keeps charging monomer, which will react all at once when mixing resumes.',steps:[{t:'HOLD the sequence to stop the FIC211 feed (program-owned during FEED).',go:gSeq},{t:'Restart M-202 only after the feed is stopped.',go:gFp('M202')}]});\n    for(const k in L){ const l=L[k]; if(l.badPv) out.push({id:'badpv.'+k,sev:'WARN',title:k+' PV is BAD — loop shed to MAN',why:'The transmitter signal failed. Shed option '+l.shed+' put the loop in MAN holding the last good output (crosshatch on the graphic).',steps:[{t:'Keep the loop in MAN; control on related measurements.',go:gFp(k)},{t:'Review the input on Point Detail.',go:gDet(k)},{t:'Have maintenance check the transmitter — the PV restores here once the signal is repaired.'}]}); }\n    const vmap={FIC102:'FV102',TIC202:'TV202',TIC301:'TV301',PIC401:'PV401',LIC401:'LV401',FIC211:'MV211',TIC213:'JV213',FIC310:'FV310',TIC311:'FV311',FIC313:'QV313',TIC502:'TV502',LIC503:'LV503',LIC504:'WV504',PIC505:'PV505'};\n    const lagging=this.laggingValves(), airLoss=lagging.length>=3;\n    if(!airLoss){ for(const k in vmap){ const l=L[k], v=V[vmap[k]]; if(l&&v&&(this.vLag[vmap[k]]||0)>=20) out.push({id:'stuck.'+k,sev:'WARN',title:vmap[k]+' not following '+k+' output',why:'The controller output is moving but the valve (and PV) is not responding — classic stiction or a jammed actuator.',steps:[{t:'Compare OP vs PV on the trend.',go:gTg(this.unitOf(k)==='U2'?'TG04':this.unitOf(k)==='U3'?'TG05':'TG01')},{t:'Put '+k+' in MAN and stroke the output firmly (±10%).',go:gFp(k)},{t:'If it will not move, flag the valve for maintenance.'}]}); } }\n    for(const k in L){ const l=L[k]; if(l.kind==='pid'&&l.mode!=='MAN'&&!l.badPv&&(l.op>=l.ophilm-0.2||l.op<=l.oplolm+0.2)){ const inAlm=Object.keys(l.alm).some(c=>l._as[c]); if(inAlm) out.push({id:'sat.'+k,sev:'WARN',title:k+' output saturated at '+Math.round(l.op)+'%',why:'The controller has no more range — the disturbance exceeds this loop. Windup is prevented, but the PV cannot be held.',steps:[{t:'Address the disturbance at its source (feed rate, heat input).'},{t:'Consider MAN with a sensible fixed output while conditions recover.',go:gFp(k)}]}); } }\n    for(const k in L){ const l=L[k]; if(l.kind==='pid'&&l.slave&&l.init) out.push({id:'init.'+k,sev:'INFO',title:k+' in INITMAN — cascade broken',why:'Its secondary '+l.slave+' is not in CAS, so the primary is initialized and tracks for a bumpless return.',steps:[{t:'Return '+l.slave+' to CAS when ready.',go:gFp(l.slave)}]}); }\n    const un=this.alarmEngine.counts().unack;\n    if(un>=6) out.push({id:'flood',sev:'WARN',title:'Alarm flood — '+un+' unacknowledged',why:'Do not blind-acknowledge. Triage by priority: Urgent first, then High. Look for a common cause.',steps:[{t:'Silence the horn (F1).'},{t:'Work the summary Urgent-first.',go:()=>gAlm()},{t:'Check for a common cause: pump, air, cooling.'}]});\n    if(airLoss) out.push({id:'air',sev:'URGENT',title:'Instrument air loss suspected — '+lagging.length+' valves not following their outputs',why:'Several control valves have stopped following their controllers at once and sit at their fail positions; a common cause (instrument air) is far more likely than several valve failures. Controllers are ineffective until air returns.',steps:[{t:'Recognize the common cause — do not chase individual loops.'},{t:'Note which valves failed open vs closed on the graphics.'},{t:'Triage alarms by priority.',go:()=>gAlm()}]});\n    if(L.PIC401.mode==='MAN'&&P.drumP>700) out.push({id:'man401',sev:'WARN',title:'PIC401 in MAN while pressure rises',why:'The vent will not move in MAN.',steps:[{t:'Put PIC401 back in AUTO.',go:gFp('PIC401')}]});\n    for(const mt of ['P101','M202']){ const m=L[mt]; if(!m.trip&&!m.run&&m.lock>0) out.push({id:'lock.'+mt,sev:'INFO',title:(mt==='P101'?'P-101':'M-202')+' restart lockout — '+Math.ceil(m.lock)+' s remaining',why:'A lockout timer protects the motor after a stop or trip.',steps:[{t:'Wait for the lockout, then START from the faceplate.',go:gFp(mt)}]}); }\n    const sevR={URGENT:2,WARN:1,INFO:0};\n    out.sort((a,b)=>sevR[b.sev]-sevR[a.sev]);\n    if(!out.length) out.push({id:'ok',sev:'INFO',title:'No abnormal conditions detected',why:'All loops near setpoint, no trips, no bad measurements. Use the Drills menu to practice an upset, or start a batch on Unit 02.',steps:[{t:'Review trends for slow drift.',go:gTg('TG01')},{t:'Start a scored drill.',go:()=>this.setState({dlg:{type:'drills'}})}]});\n    return out.slice(0,8);\n  }\n  topics(){ return [\n    // Orientation (P2L-EXPANSION-SPEC section 2.2): the first three chips used to match no\n    // keyword and fell straight through to the model, which had nothing to say either.\n    {k:['looking at','what am i looking','this screen','what is this screen','which screen','what display','what screen'],t:'What am I looking at?',a:'The title bar names the display and the unit tabs say which unit you are on. UNIT 01 is receipt and conversion: TK-101 feed tank, R-201 stirred reactor, E-301 flash preheater and V-401 flash drum. UNIT 02 is the R-202 batch reactor under SCM202 sequence control. UNIT 03 is the H-310 fired heater and the R-310 fixed catalyst bed. A faceplate shows PV, SP and OP for one loop; the Alarm Summary lists what is abnormal. Help → Plant orientation (command PROCESS) explains what each unit makes and why its trip points are where they are.'},\n    {k:['plant make','does the plant','does this plant','what is made','the product','feedstock','what the plant','process description','orientation','overview'],t:'What does this plant make?',a:'A finished liquid hydrocarbon blendstock, from a crude oxygenate intermediate and hydrogen that arrive at the battery limit. Unit 01 condenses and dehydrates the intermediate over a catalyst and flashes light ends and reaction water overhead in V-401. Unit 03 finishes the crude liquid over a second catalyst with hydrogen. Unit 02 is a batch campaign reactor that shares the board but is not in that path. Water is a co-product of both reactions. The full orientation document is under Help → Plant orientation, command PROCESS.'},\n    {k:['drive this station','how do i drive','navigate','get around','command zone','command line','commands','which command','station'],t:'How do I drive this station?',a:'Type a display name or a tag in the command zone and press Enter: U1, U2, U3 for the unit graphics, ALM for the Alarm Summary, EVT for events, TRN for trends, KPI for alarm performance, ARCH for the signal path, PROCESS for the plant orientation, HELP for the keys. Typing a tag opens its Point Detail; clicking a tag on a graphic opens its faceplate. F1 silences, F2 acknowledges. The View menu and the display buttons do the same by mouse.'},\n    {k:['op','output','invalid mode','man','change op'],t:'Why can I not change OP?',a:'OP entry is only permitted in MAN. In AUTO the PID computes OP; in CAS the SP comes from the primary. Click MAN on the faceplate first — the Message Zone shows INVALID MODE when the rule blocks you.'},\n    {k:['sp','setpoint','rejected','limit','entry'],t:'SP entry rejected',a:'SP must be inside SPLOLM…SPHILM and the loop must be in AUTO (CAS setpoints are primary- or program-driven). Out-of-range entries are rejected with the limits shown in the Message Zone. Limits live on Point Detail → Loop Tune (ENGR to change).'},\n    {k:['initman','init','cascade','track','bkcal'],t:'What is INITMAN?',a:'When a cascade secondary leaves CAS, the primary initializes (INITMAN) and its output tracks the secondary SP via back-calculation, so the return to CAS is bumpless. Fix: put the secondary back in CAS.'},\n    {k:['crosshatch','bad','badpv','hatch','stale','quality'],t:'PV shows crosshatch',a:'Crosshatch means bad or uncertain PV quality. A BADPV alarm raises and the PID sheds per its option — default SHEDHOLD: MODE to MAN, output held at the last good value. Keep it in MAN until the input is repaired.'},\n    {k:['shelve','shelving','nuisance','hide'],t:'How do I shelve an alarm?',a:'Select the alarm row, press SHELVE, pick a duration (max 60 min) and a reason — the reason is mandatory. The alarm goes SHLVD: silent, no flashing, listed under the SHELVED view with its remaining time. When the timer runs out it re-annunciates if the condition is still present. Shelve nuisance alarms only.'},\n    {k:['pump','start','won','lockout','permissive','agitator','motor'],t:'Motor will not start',a:'Check the Message Zone: a start needs its permissive met (P-101 needs tank level above 5%) and the restart lockout expired (30 s after a trip, 15 s after a stop). Failed starts raise CMDFAIL.'},\n    {k:['color','colours','flash','red','yellow','cyan','blink'],t:'What do alarm colors mean?',a:'Urgent = red, High = yellow (representative), Low = cyan. Flashing = UNACK; steady = ACKED with the cause still present; inverse flashing = RTNUN (returned to normal, never acknowledged). Grey = shelved, suppressed by DAS or out of service — those never sound. Journal alarms only log to the journal.'},\n    {k:['ack','silence','acknowledge','horn'],t:'Ack vs Silence',a:'SILENCE (F1) stops the horn only. ACK (F2) claims the alarm: flashing stops and it goes steady while the cause remains, or drops off the summary if it already returned to normal. Sequence: Silence → Ack → read → trend → act → verify.'},\n    {k:['tuning','tune','gain','t1','t2','engr','action'],t:'Cannot change tuning',a:'K, T1, T2, limits and control action need ENGR level or above: Station menu → Security Level, password engr. Experion PID uses overall gain K with T1 and T2 in minutes.'},\n    {k:['batch','sequence','scm','phase','stuck','hold','charge'],t:'Batch sequence control',a:'SCM202 on Unit 02 runs CHARGE → HEATUP → FEED → REACT → COOL → DRAIN. START begins a batch; HOLD stops the monomer feed without losing the phase; ABORT forces COOL. During FEED the FIC211 SP is program-driven (MODEATTR = PROGRAM).'},\n    {k:['raise','lower','arrow','keys','select'],t:'RAISE / LOWER keys',a:'The raise/lower buttons act on the auto-selected target: SP in AUTO, OP in MAN (dashed highlight on the faceplate). In an entry field, arrow keys nudge the typed value; Enter stores, Esc cancels.'},\n    {k:['drill','score','practice','scenario'],t:'Running drills',a:'Drills menu → Start Drill. An upset begins unannounced 8–15 s later. You are scored on time to acknowledge, correct action, trip avoidance, stabilization and diagnosis; the debrief shows your timeline.'},\n    {k:['runaway','exotherm','cooling','reactor','temperature','hot'],t:'Reactor temperature runaway',a:'Reaction heat grows exponentially with temperature; cooling only linearly. If cooling is lost: maximize what cooling remains, CUT FEED to remove the heat source, and never raise SP to chase the PV. Then, once the reactor is falling, restore feed before the feed tank reaches high level (a cut feed fills TK-101) and confirm the reactor keeps cooling. Trips: R-201 at 185 °C, R-202 at 110 °C, R-310 fuel at 480 °C.'},\n    {k:['program','modeattr','owned','sequence owns','rejected','callout'],t:'Write rejected — MODEATTR PROGRAM',a:'While SCM202 drives a loop its mode attribute is PROGRAM: the sequence owns SP, OP and MODE, so operator stores are rejected with a red callout on the faceplate and a journal entry. TIC212 is PROGRAM for the whole batch, FIC211 during FEED. HOLD the sequence to take the monomer feed back (the attribute returns to OPERATOR), or wait for the sequence to end.'},\n    {k:['pv tracking','pvtrack','track','bumpless','bump'],t:'PV tracking and bumpless transfer',a:'With PV tracking ON (Loop Tune, ENGR) the SP follows the PV while the loop is in MAN, so a return to AUTO starts at zero error and the output does not step. The integrator is re-initialised on every mode change so MAN → AUTO and AUTO → CAS are bumpless either way. Default ON for the cascade secondaries FIC102, TIC202 and TIC213.'},\n    {k:['state','phase set','limit set','state-based','disabled','batch alarm'],t:'State-based alarm limits',a:'Unit 02 alarm limits follow the SCM202 phase: the level low alarm is off during CHARGE, DRAIN and IDLE, the monomer flow low alarm is active only in FEED, and the temperature limits tighten in REACT. Every phase change journals the limit set applied; Point Detail → Alarms shows the phase set in force and any conditions it disabled.'},\n    {k:['assistant','guide','coach','panel','granite','ai'],t:'About this assistant',a:'The COACH at the top of this panel is the local board model when you start with Launch Station.command. LIVE DIAGNOSIS below is rule-based and always on. The coach does not move valves or change modes. On a real console, follow site procedures.'}\n  ]; }\n  // Cascade maps (master OP -> slave SP and the inverse for INITMAN back-calculation) shared by the PID step and mode transfers.\n\n\n  // ESS.Pid: anti-windup with integral back-calculation, INITMAN, PV tracking (Kantor CBE30338 PID notes, RESOURCES 4.6).\n\n\n\n\n  // Per-point deadband (EU, default 1 % of span, override l.almDb) and on-delay (s, override l.almDelay):\n  // flow loops 15 s, level loops 60 s, others 0, after the Siemens examples (RESOURCES 2.6); limit logic per loxalarm (2.9).\n\n\n\n\n\n\n  // ---------- drills ----------\n\n  // W1 (CONVERGENCE-SPEC item 6, contract docs/dev/W1-BOUNDARY-DOF-CONTRACT.md §4): the pre-drill\n  // DOF check. Runs on the initial condition the trainee will actually meet -- after applyPreset\n  // and after the drill's own setup() -- and BEFORE the drill arms, because a refusal after arming\n  // is too late. Three constraints, each for a reason the repo has already paid for once:\n  //   1. In startDrill it must run BEFORE the rand() draw for the injection delay. Refusing after\n  //      that draw would advance the seeded cursor without arming anything and shift every\n  //      downstream trajectory -- the failure class rand4 was introduced for in 3.1.0. The goldens\n  //      staying byte-identical is the proof, not this comment.\n  //   2. Inert under replay. A refusal there would break deterministic replay, which release\n  //      gate 3 exists to protect (cf. src/dispatch.js skipping gates when ctx.replaying).\n  //   3. Reads P.t only, never the wall clock -- see the 3.1.0 clock re-basing fix.\n  // The specification-integrity NOTES. dofPreflight acted on refusals only, so every note the\n  // check computed -- CASCADE_OPEN above all, \"the cascade is open and the master is not in\n  // control\" -- was computed and dropped on the floor. Found by a second seat running it rather\n  // than reading it. Anthony, 2026-09-13: \"Wire notes to the instructor log and the debrief,\n  // nowhere else. Trainee sees the board.\"\n  //\n  // They go to instr.log and instr.dofNotes and NOWHERE ELSE. NOT to this.events, NOT to the\n  // journal, NOT to P -- and that is not fastidiousness, it is the only golden-safe route.\n  // tests/_fixture.js endState() digests the v2 event COUNT, and its inV2() filter excludes only\n  // Unit 04 sources, so a 'DOF' event IS digested; BOUNDARY_SPEC_STRUCTURAL emits on EVERY drill\n  // start, so one event here would move every golden in the set. `instr` is in neither endState()\n  // nor P, so this path is inert by construction rather than by luck.\n\n  // Instructor-only debrief rows for the notes above. Rendered ONLY under DEBRIEF_REVEALED --\n  // the trainee's TRAINEE_SAFE debrief never carries them, matching how root-location rows are\n  // already handled two functions down.\n  // Debrief rows for the notes. THE TRAINEE SEES THESE TOO, in both projections, and that is a\n  // deliberate ruling (Anthony, 2026-09-13): \"trainee's post-exercise debrief too, always. The\n  // reveal switch is for hidden truth; the cascade note reads the board.\"\n  //\n  // That distinction is the whole point and it is worth not blurring. DEBRIEF_REVEALED exists to\n  // gate things the trainee could not have known -- the active fault id, the changed topology\n  // node, the answer key. A specification note is the opposite: it is derived entirely from the\n  // faceplates the trainee was looking at the whole time. \"LIC101 is AUTO with its slave FIC102\n  // in MAN\" is a reading of the board, not a disclosure about it. Gating it behind reveal would\n  // have hidden a fair lesson behind a switch built for unfair ones. Lane is SYSTEM, not\n  // INSTRUCTOR, for the same reason: nothing here is instructor-privileged.\n  //\n  // PRE-DRILL STAYS SILENT FOR THE TRAINEE. Notes never reach msgZone; dofPreflight messages the\n  // operator only on a REFUSAL, where the drill did not start and they are owed the reason. The\n  // note is a debrief observation, not a nag at arming time.\n  dofNoteRows(){\n    const ring=(this.instr&&this.instr.dofNotes)||[];\n    const rows=[];\n    for(const e of ring) for(const n of e.notes) rows.push({\n      rel:this.mmss(Math.max(0,(e.t-(this.t0||e.t)))),\n      lane:'SYSTEM', actor:'SYSTEM', kind:'SPEC',\n      text:e.what+' — '+n.code+': '+n.detail,\n      pvT:'', hasPv:false, fg:'#1c1c1c'\n    });\n    return rows;\n  }\n\n\n  // The trainee menu makes the initial-condition choice explicit. Canonical starts load\n  // the drill's declared preset; live-state starts deliberately preserve the plant as-is.\n  // Direct/replay callers keep startDrill's fail-honest LIVE STATE default.\n  startDrillFromMenu(d,mode){\n    if(this.P.aDrill){ this.msgZone('AN ARCHITECTURE DRILL IS ACTIVE — END IT FIRST'); return; }\n    if(this.state.drill){ this.msgZone('DRILL ALREADY ACTIVE'); return; }\n    if(mode==='live'){ this.startDrill(d,{startMode:'LIVE STATE'}); return; }\n    const preset=d&&d.basePreset;\n    if(!preset||!ESS.Instructor.presets().some(p=>p.id===preset)){ this.msgZone('NO CANONICAL INITIAL CONDITION FOR '+(d&&d.id||'DRILL')); return; }\n    // The preset is seeded from the SIMULATION clock, never Date.now(). A wall-clock seed\n    // re-based P.t mid-exercise, so a snapshot taken before this start and the journal\n    // entry written after it sat on opposite sides of a gap the replay could not step\n    // across (release gate 3, tests/release-gates.test.js). presetBaseT is the receipt the\n    // DRILL journal entry carries so a replay rebuilds the identical plant at the identical t.\n    const presetBaseT=this.P.t;\n    this.applyPreset(preset,{baseTime:presetBaseT});\n    this.startDrill(d,{startMode:'CANONICAL',preset,presetBaseT,applySetup:true});\n  }\n  // A snapshot carries the armed / running drill as plain data; the definition is looked up again on restore.\n\n\n\n\n\n\n  // Equipment trip during a drill. A drill definition may list the trip keys of its own equipment (`trips`, e.g. D4 →\n  // ['rx']); a trip on that list is the drill's trip (the 'Trip avoided' criterion), any other trip is counted in\n  // m.otherTrips and deducted separately, so a trainee who floods TK-101 while handling an R-201 exotherm is not scored\n  // as if the reactor had tripped, and not rewarded either. Without a list every trip is the drill's trip.\n\n\n\n\n  // Standards-based scorer (ESS.Kpi.scoreDrill): acknowledge latency, correct action and latency, trip avoided,\n  // stabilisation, alarm load during the drill (KPI module over the alarm journal) and the debrief question.\n  // Returns {score, pass, passMark, passLabel, breakdown}; the pass mark is the sim's own 80 % (RESOURCES 2.7, 2.8, 2.12).\n  scoreDrill(d,ans){\n    const m=d.m, t0=d.t0, t1=d.tEnd||this.P.t;\n    const load=ESS.Kpi.computeMetrics(this.alarmLog,{t0,t1:Math.max(t1,t0+1)}).per10min.avg;\n    return ESS.Kpi.scoreDrill({tAlarm:m.tAlarm,tAck:m.tAck,tAct:m.tAct,tStable:m.tStable,trip:!!m.trip,otherTrips:m.otherTrips||0,actionCorrect:!!m.tAct,quizCorrect:ans===d.def.a,alarmsPer10min:load},{passMark:ESS.Training.PASS_MARK,allowProactive:!!d.def.proactive});\n  }\n  // Debrief submit: score, journal, training record (last 20 per session, keyed by the trainee's logon name).\n  submitDebrief(d,ans){\n    const sc=this.scoreDrill(d,ans);\n    this.setState({dlg:{...this.state.dlg,scored:true,score:sc.score,result:sc}});\n    this.addEvent('SYSTEM','STN01','DRILL '+d.def.id+' SCORE '+sc.score+'/100 — '+(sc.pass?'PASS':'NOT PASSED')+' ('+sc.passMark+' % MARK)','',this.operName());\n    ESS.Training.addRecord(this.trainingRecords,ESS.Training.recordFor(this.operName(),d.def.id,d.def.name,sc,d.tEnd||this.P.t,d.reason),20);\n    this.taskDone('abn.drill'); if(sc.pass) this.taskDone('abn.pass');\n    return sc;\n  }\n\n  // ---------- instructor station (Forge PTS instructor features, RESOURCES 2.14; seeded replay / snapshot / backtrack per the cstr-ots notes, RESOURCES 4.9) ----------\n  // Instructor state lives in this.instr, never in a trainee display. Entry needs the instructor password ('instr') or\n  // the MNGR level; a trainee at OPER / SUPV is sent to the logon dialog and the display falls back to the graphic.\n\n  openInstructor(){\n    if(this.instructorAllowed()){ this.nav('instr'); return; }\n    this.msgZone('INSTRUCTOR STATION — PASSWORD REQUIRED');\n    this.setState({dlg:{type:'logon',instr:true},dlgPw:'',menu:null});\n  }\n  lockInstructor(){\n    this.instr.auth=false;\n    ESS.Instructor.logAdd(this.instr,this.P.t,'INSTRUCTOR STATION LOCKED');\n    if(this.state.display==='instr') this.nav('graphic');\n  }\n  effDisplay(){ const d=this.state.display; return d==='instr'&&!this.instructorAllowed()?'graphic':d; }\n  // Instructor-only log; mirrored into the station journal only while upsets are not hidden.\n\n  // Instructor-only note: never mirrored. Instructor variables, magnitudes and the seed are plant conditions the\n  // trainee is not told about, whatever the hidden switch says.\n\n\n  // --- run control: FREEZE stops the clock (speed 0), STEP advances exactly one 0.5 s tick, RUN / 2 / 5 / 10 set the speed\n  setSpeed(v){ this.setState({speed:v}); }\n  freeze(){ this.setSpeed(0); }\n  stepOnce(){ if(this.state.speed!==0) this.setState({speed:0}); this.step(0.5); this.setState(s=>({tk:s.tk+1})); }\n\n  // --- snapshots: the full process state (P, L, V, alarm records, interlock flags, seed and generator cursor)\n  // Returns null (and tells the instructor) when the process state holds a non-finite number; such a snapshot could\n  // not be restored faithfully.\n  // `wall` is display metadata an instructor-initiated save may stamp; it is never read back.\n  // The ring (backtrackTick, inside step()) and the preset IC snapshot pass none, so no\n  // exercise path reads the wall clock (release gate 3).\n\n\n  // The disabled-asset set travels with the snapshot so it agrees with the restored records' disabledBy flags; a\n  // snapshot without the list (older ring entries) derives it from the flags. Any flag left over for an asset that is\n  // not disabled in the restored state is cleared and the record returned to service, so nothing stays parked unseen.\n\n  saveSlot(i,name){\n    const nm=(name||'').trim()||('SNAP '+(i+1)+' '+this.fT(this.P.t));\n    const snap=this.snapshotData(nm,Date.now()); if(!snap) return;\n    this.instr.snapshots[i]=snap;\n    this.instrLog('SNAPSHOT SAVED: '+nm);\n    this.setState({instrSnapName:''});\n  }\n  // A restore during a drill discards the trainee's run so far, so it is signed. The request carries the instructor's\n  // own authority (instructorAllowed()): the station level is not pre-checked and 'instr' signs at manager rank.\n  restoreSlot(i){\n    const s=this.instr.snapshots[i]; if(!s){ this.msgZone('SNAPSHOT SLOT '+(i+1)+' IS EMPTY'); return; }\n    const go=()=>{ this.instr.replay=null; this.restoreSnapshot(s,'SNAPSHOT RESTORED: '+s.name); };\n    // the restore truncates the journal to the snapshot time, so the signed CONFIG entry (name, level, reason) is written after it\n    if(this.state.drill){ const id=this.state.drill.def.id; this.withSignature('SNAPSHOT RESTORE DURING DRILL '+id+' — '+s.name,'MNGR',(reason)=>{ go(); this.configChange('INSTR','SNAPSHOT RESTORED DURING DRILL '+id+' — SIGNED BY '+this.operName(),id,s.name,reason); },{instr:true}); }\n    else go();\n  }\n  clearSlot(i){ this.instr.snapshots[i]=null; }\n  // --- backtrack: an automatic snapshot every 30 sim-seconds covering the last 10 sim-minutes (taken after the step so it carries that step's history row)\n\n  backtrack(ms){\n    const s=ESS.Instructor.ringPick(this.instr,this.P.t,ms);\n    if(!s){ this.msgZone('NO BACKTRACK POINT YET'); return; }\n    this.instr.replay=null;\n    this.restoreSnapshot(s,'BACKTRACK '+this.mmss(ms));\n  }\n  // --- initial conditions: fresh process + preset data, run to the stated condition, loaded through a snapshot restore\n\n  // --- upsets (the faults) with a hidden switch and magnitudes; instructor variables through the P fields the models read\n\n  // Registers the FAULT_INJECT dispatch handler once (guarded alongside this.dispatcher in\n  // initSim). D1: apply() calls the EXISTING injectFault(k,on) unchanged -- physics is\n  // byte-identical by construction, not by hope (tests/app-fault-parity.test.js). The\n  // custom journal() reshapes the entry back to the pre-existing {op:'UPSET',tag,arg,instr}\n  // shape so journalText's 'UPSET' case, applyJournalEntry's 'UPSET' case and every replay\n  // fixture keep working without touching src/instructor.js (advisory Q1/Q5).\n\n  // Routed through ESS.Dispatch (V3-PLAN S2, decision D1): every injection becomes an\n  // ActionEvent with actor INSTRUCTOR and journals exactly once. The physics path\n  // (injectFault) and the journal shape are unchanged from before S2 -- see\n  // registerDispatchHandlers() above.\n\n  clearUpsets(){ for(const d of ESS.Instructor.upsetDefs()) if(this.upsetOn(d.k)) this.setUpset(d.k,false); }\n  // Fresh architecture-fault state for THIS INSTANT: any instructor-scheduled engine\n  // faults (this.P.archFaults -- empty until a later stage's panel injects one) chained\n  // with per-call DERIVED instances for the three ARCHITECTURE-class legacy upsets\n  // (ESS.UpsetBridge, decision D2). Deliberately NOT persisted for the derived half\n  // (advisory Q3(A)): P.faults/P.faultT/V.TV202.stuck stay the single physics authority,\n  // so a trainee action that frees TV202 outside setUpset (the TIC202 manual-stroke path)\n  // or a drill that calls injectFault('xmtr'/'stick', ...) directly, bypassing setUpset,\n  // is reflected correctly because this is recomputed from those flags on every call,\n  // never cached or drifted. Read-only: never mutates this.P, this.topo or any flag.\n\n  // ---------- Architecture panel (V3-PLAN S2, DO item 1): the topology fault matrix ----------\n  // Everything below configures and fires ENGINE faults the panel targets directly, on\n  // topology nodes none of the twelve legacy upsets already own. archFaultState() above\n  // already folds this.P.archFaults into every health/truth projection, so nothing here\n  // needs to touch archFaultState(), healthProjection or truthProjection -- activating one\n  // of these is indistinguishable, to the rest of S1/S2, from a legacy upset's derived\n  // instance. D1 still holds: this never writes P.faults/P.faultT/V[x].stuck and never\n  // touches src/models.js, so it can only ever affect ARCH-layer health/truth, never the\n  // physics goldens (tests/_fixture.js endState() does not read P.archFaults/archPending/\n  // archMeta at all -- advisory Q3).\n  //\n  // The three (faultId, targetNodeId) pairs the legacy xmtr/drift/stick upsets already\n  // derive (decision D2) are RESERVED here: the panel must not let the instructor layer a\n  // second, physics-disconnected engine fault onto the one node whose legacy upset DOES\n  // move the physics, which would show the trainee a symptom with no matching trend.\n\n\n  // Registered faults legally targetable at this node (kind + the narrower targetIds\n  // allow-list some defs carry, e.g. HISTORIAN_GAP only on SVC-HISTORY), minus the reserved\n  // pairs above. Mirrors FaultEngine's own validateActivation rules rather than re-deriving\n  // them, so a future FAULT_DEFS addition needs no change here.\n  archApplicableFaults(node){\n    const FE=ESS.FaultEngine;\n    return FE.FAULT_IDS.filter(id=>{\n      const d=FE.FAULT_DEFS[id];\n      if(d.targets.indexOf(node.kind)<0) return false;\n      if(d.targetIds&&d.targetIds.indexOf(node.id)<0) return false;\n      if(this.archIsReserved(id,node.id)) return false;\n      return true;\n    });\n  }\n\n  // Verification-round fix (S2, leakage check item 4): the raw faultId (a FAULT_IDS\n  // constant, e.g. 'NOISY_MEASUREMENT') and the raw topology node id (e.g. 'XMTR-FIC211',\n  // src/topology.js's internal id() scheme) are FaultEngine-internal identifiers, not\n  // trainee-facing text -- unlike the legacy setUpset() precedent, which only ever mirrors\n  // a project-authored prose label (def.label, e.g. \"Cooling water loss\"). instrLog()\n  // mirrors its argument to the trainee event stream whenever HIDDEN UPSETS is off\n  // (self.instr.hidden===false), so the four ARCH-fault instrLog call sites below use\n  // these two formatters instead of the raw ids -- display-only, never used for the\n  // journal, instrNote's instructor-only CONFIG line, or archTruth, all of which keep the\n  // precise raw identifiers. archFaultTargetLabel reuses this.topo's own node.label, the\n  // same string the trainee-safe ARCH view already renders for that node; nothing new is\n  // disclosed by using it here that Learn/Trace mode does not already show once a fault is\n  // active. archFaultDisplayName is a pure display transform of already-public data (which\n  // fault KIND is active), never a new fact -- matching the level of detail (not the exact\n  // wording) of the legacy upsets' own revealed label under the same HIDDEN=OFF switch.\n\n\n  // Every check that can make the command fail: unknown fault/node, reserved pair, already\n  // active/pending, an out-of-range or missing magnitude, a non-positive ramp/onset/duration\n  // -- and finally a TRIAL activation against a snapshot copy of the real engine state, which\n  // reuses FaultEngine's own kind/targetIds/conflict rules instead of re-deriving them. The\n  // magnitude value used for the trial does not affect accept/reject (resolveMagnitude never\n  // range-checks an explicit number), so it is safe even though the real activation may start\n  // a RAMP at 0 instead of the requested target (archFireFault).\n\n\n  // apply()-side only: everything that can fail already ran in validate() above, so this is\n  // a mutation that cannot itself throw (dispatch.js's CONTRACT note on apply()).\n\n  // Actually activates one engine-fault instance NOW, at simTimeNow. A RAMP starts its\n  // magnitude at 0 -- archFaultTick() below walks it up to the target over rampSec -- a STEP\n  // starts at the target immediately. Health does not scale with magnitude (FaultEngine's\n  // healthEffect is fixed per fault, V3-PLAN section 3), so ramp-vs-step never changes\n  // WHETHER the ARCH view shows a symptom, only the magnitude number the instructor's truth\n  // view reports while it climbs -- exactly the split D1/D4's physics-authority principle\n  // implies for a fault with no models.js hook to ramp for real. Returns false, silently, on\n  // a rejection at fire time (state changed since scheduling); the caller decides what to log.\n\n\n\n  // Dispatch entry points the panel and applyJournalEntry's replay cases both call.\n\n\n  // Called once per step(dt), regardless of dt or whether the panel has ever been opened --\n  // cheap (P.archPending/archMeta are empty unless the panel was used) and purely a function\n  // of P.t, so it draws nothing from this.rand and cannot move a golden trajectory by one\n  // extra sample (MEASURED FACTS). Fires due onsets, then walks every active RAMP's magnitude\n  // and every active instance's optional duration expiry.\n\n  // ---------- S3: evidence/hypothesis training commands + the A-drill lane ----------\n  // V3-PLAN section 6 (\"Evidence and hypothesis are first-class commands, journaled and\n  // scored\") and DO items 1-4 of this stage: wire TRAINING.MARK_EVIDENCE, TRAINING.\n  // PIN_COMPARE, TRAINING.SUBMIT_HYPOTHESIS and TRAINING.VERIFY to real controls through\n  // ESS.Dispatch, keep evidence fail-closed on explicit inspection, and make the safety\n  // gate live and outcome-based. Every control here dispatches fresh -- no cached ctx\n  // object survives a snapshot restore by accident.\n\n  // RETAINS the RETURNED ActionEvent, never re-reads the journal -- dispatch() journals a\n  // legacy {t,op,tag,arg} entry (what journalText/replayPlan consume) and RETURNS an\n  // ActionEvent {seq,simTime,actor,actionType,target,payload,accepted} (what drill-arch's\n  // matchAction/scoreDrill consume); feeding the journal to the scorer scores ZERO with no\n  // error (tests/dispatch-training.test.js, \"THE TRAP\"). Only kept when an A-drill is\n  // active -- there is nothing to score against otherwise, and the array must not grow\n  // unbounded across an ordinary training session with no drill running.\n\n\n  // Safety gate live (V3-PLAN section 6, DO item 4): a synthesized ActionEvent for one of\n  // drill-arch's own safety-gate/expected-action vocabularies (MODE.SET, POINT.SUPPRESS,\n  // ACK), appended ONLY when an A-drill is active and ONLY from a call site that already\n  // mutated real state -- outcome-based by construction, since a refused attempt never\n  // reaches the line that calls this. NEVER journaled: the underlying legacy op (MODE/OOS/\n  // ASSET/ACK) already journals once elsewhere; a second entry here would double-apply on\n  // replay. drill-arch's own matchAction is untouched -- this only ever feeds it data.\n\n  // The ONE explicit-open site (advisory Q5): selecting a node in the ARCH view is what\n  // \"explicitly inspected\" means. Records it in P.archInspected (survives snapshot/\n  // restore/replay for free -- a Set would not) BEFORE opening the inspector, so\n  // MARK_EVIDENCE/VERIFY's fail-closed wasInspected check is already satisfied by the time\n  // their buttons are reachable.\n  archSelectNode(id){ if(!id) return; this.P.archInspected[id]=true; this.setState({archSel:id}); }\n  markEvidence(id){\n    if(!id) return;\n    const ev=this.dispatchTraining(ESS.Dispatch.TYPES.MARK_EVIDENCE,id,null);\n    this.msgZone(ev.accepted?('EVIDENCE MARKED: '+id):('REFUSED: '+ev.reason));\n    this.setState(s=>({tk:s.tk+1}));\n  }\n  verifyNode(id){\n    if(!id) return;\n    const ev=this.dispatchTraining(ESS.Dispatch.TYPES.VERIFY,id,null);\n    this.msgZone(ev.accepted?('VERIFIED: '+id):('REFUSED: '+ev.reason));\n    this.setState(s=>({tk:s.tk+1}));\n  }\n  // Pin-compare tray: view-only staging (like archStageNode for the instructor panel) for\n  // \"two or three points pinned side by side\" (V3-PLAN section 6) -- PIN_COMPARE's own\n  // validate() enforces the 2-3/distinct/known-node rules; this tray only ever hands it a\n  // candidate list, never bypasses the dispatch validation.\n  togglePin(id){\n    if(!id) return;\n    const tray=this.state.archPinTray||[];\n    const i=tray.indexOf(id);\n    if(i>=0){ this.setState({archPinTray:tray.filter(x=>x!==id)}); return; }\n    if(tray.length>=3){ this.msgZone('PIN TRAY HOLDS AT MOST THREE POINTS'); return; }\n    this.setState({archPinTray:tray.concat([id])});\n  }\n  comparePins(){\n    const tray=this.state.archPinTray||[];\n    if(tray.length<2){ this.msgZone('PIN AT LEAST TWO POINTS TO COMPARE'); return; }\n    const ev=this.dispatchTraining(ESS.Dispatch.TYPES.PIN_COMPARE,null,{targets:tray.slice()});\n    if(ev.accepted){ this.msgZone('PINNED FOR COMPARISON: '+tray.join(', ')); this.setState({archPinTray:[]}); }\n    else { this.msgZone('REFUSED: '+ev.reason); this.setState(s=>({tk:s.tk+1})); }\n  }\n  // A hypothesis names a topology LAYER, never a fault id -- a trainee has no fault ids in\n  // their world (dispatch.js's own validate refuses anything outside ESS.Dispatch.LAYERS).\n  // NEUTRAL acknowledgment only: never correctness feedback mid-drill, which would leak\n  // the answer by binary search across repeated tries -- the score is revealed at drill\n  // end, the same rule submitDebrief follows for the legacy D-series.\n  submitHypothesis(domain){\n    const events=this.P.aDrill&&Array.isArray(this.P.aDrill.events)?this.P.aDrill.events:[];\n    const onset=events.filter(e=>e.accepted!==false&&e.actionType===ESS.DrillArch.ACTION.FAULT_PRESENT&&\n      e.target===this.P.aDrill.id&&typeof e.simTime==='number')\n      .sort((a,b)=>a.simTime-b.simTime||(a.seq||0)-(b.seq||0))[0];\n    // The first accepted POST-ONSET hypothesis binds. An early hypothesis is retained as\n    // part of the trainee record but cannot lock out the first causally eligible answer.\n    if(onset&&events.some(e=>e.accepted!==false&&e.actionType===ESS.Dispatch.TYPES.SUBMIT_HYPOTHESIS&&\n      typeof e.simTime==='number'&&e.simTime>=onset.simTime)){\n      this.msgZone('HYPOTHESIS ALREADY RECORDED FOR THIS DRILL'); return;\n    }\n    const ev=this.dispatchTraining(ESS.Dispatch.TYPES.SUBMIT_HYPOTHESIS,null,{domain});\n    this.msgZone(ev.accepted?('HYPOTHESIS RECORDED: '+domain):('REFUSED: '+ev.reason));\n    this.setState(s=>({tk:s.tk+1}));\n  }\n\n  // ---------- A-drills A1-A12: a PARALLEL lane to the legacy D-series this.state.drill.\n  // drillWatch/dHook/dAct/dTrip/endDrill/scoreDrill all read D-shaped def fields (rel,\n  // act, stable, trips, q, a) an A-series DrillDefinition does not carry, so reusing that\n  // slot mis-scores or crashes (architect addendum Q4) -- P.aDrill is its own lane.\n  // Injection is driven from the drill's own faultTimeline tSec offsets relative to drill\n  // start, deterministic, no rand draw: the three legacy-upset-reserved (faultId, node)\n  // pairs go through injectFault(k,true) exactly as the panel's archFaultState() already\n  // expects; every other fault fires through archFireFault(...) DIRECTLY -- never\n  // setArchFault/setUpset, which mirror to trainee surfaces via instrLog.\n\n\n\n  // Mutual exclusion is enforced HERE and at the legacy drills-dialog callback\n  // (renderVals' `dg.drills`/`randomDrill`), never by editing startDrill()/drillWatch --\n  // those read D-shaped fields an A-drill does not have.\n\n  // Trainee-menu entry: load the drill's own basePreset (initSim wipes aDrill, so this\n  // MUST run before startADrill), arm the drill, then open ARCH in Diagnose. startADrill\n  // itself does none of this -- fixture scripts and ADRILL replay call it on an already\n  // settled plant and must not jump the display.\n  startADrillFromMenu(id){\n    const def=ESS.DrillArch.drillById(id);\n    if(!def){ this.msgZone('UNKNOWN ARCHITECTURE DRILL '+id); return; }\n    if(this.state.drill){ this.msgZone('A DRILL IS ALREADY ACTIVE — END IT FIRST'); return; }\n    if(this.P.aDrill){ this.msgZone('AN ARCHITECTURE DRILL IS ALREADY ACTIVE'); return; }\n    const presetBaseT=this.P.t;   // simulation clock, not Date.now() -- see startDrillFromMenu\n    this.applyPreset(def.basePreset,{baseTime:presetBaseT});\n    this.startADrill(id,{preset:def.basePreset,presetBaseT});\n    // applyPreset() reset P.archInspected/training but view state intentionally survives\n    // process resets. Clear the old view selection too, or a highlighted inspector appears\n    // \"already inspected\" while the new drill's fail-closed inspection map says otherwise.\n    this.setState({display:'arch',archMode:'diagnose',archSel:null,archTag:null,archPinTray:[],dlg:null});\n  }\n  runCompoundScript(id){\n    const s=(ESS.Instructor.compoundScripts()||[]).find(x=>x.id===id);\n    if(!s){ this.msgZone('UNKNOWN COMPOUND SCRIPT '+id); return; }\n    (s.steps||[]).forEach(step=>{\n      this.setArchFault(step.faultId,step.target,{delaySec:step.tSec||0,\n        durationSec:step.durationSec==null?null:step.durationSec,mode:'STEP',\n        magnitude:step.magnitude==null?null:step.magnitude});\n    });\n    this.instrNote('COMPOUND SCRIPT '+id+' ARMED — '+s.title.toUpperCase());\n    this.setState(x=>({tk:x.tk+1}));\n  }\n\n\n\n  submitADrillDebrief(){\n    if(!this.P.aDrill){ this.msgZone('NO ARCHITECTURE DRILL ACTIVE'); return; }\n    this.setState({archMode:'debrief'});\n    const id=this.P.aDrill.id, events=this.P.aDrill.events;\n    const workflow=ESS.DrillArch.workflowState(id,events);\n    if(!workflow.debriefReady){\n      this.msgZone('DEBRIEF NOT READY — GATHER EVIDENCE, BIND A HYPOTHESIS, THEN VERIFY'); return;\n    }\n    const def=ESS.DrillArch.drillById(id);\n    const loc=def.expectedActions.find(a=>a.id==='LOC');\n    const named=workflow.firstHypothesis&&workflow.firstHypothesis.payload&&workflow.firstHypothesis.payload.domain;\n    const correct=!!(loc&&loc.payloadMatch&&named===loc.payloadMatch.domain);\n    const ev=this.dispatchTraining(ESS.Dispatch.TYPES.DEBRIEF,null,{correct:!!correct});\n    if(ev.accepted) this.taskDone('arch.debrief');\n    this.msgZone(ev.accepted?'DEBRIEF RECORDED — DIAGNOSIS WILL BE SCORED AT EXERCISE END':('REFUSED: '+ev.reason));\n    this.setState(s=>({tk:s.tk+1}));\n  }\n  // ---------- Architecture panel view model (instructorView() below merges this in) ----------\n  archStageSelect(nodeId,faultId){\n    const def=ESS.FaultEngine.getFaultDef(faultId);\n    let mid='';\n    if(def&&def.magnitudeRange){\n      const r=def.magnitudeRange, raw=(r.min+r.max)/2, stepped=Math.round(raw/r.step)*r.step;\n      mid=String(Math.round(stepped*1000)/1000);\n    }\n    this.setState({archStageNode:nodeId,archStageFault:faultId,archStageDelay:'0',archStageDuration:'',archStageMode:'STEP',archStageRamp:'15',archStageMag:mid});\n  }\n  archStageView(){\n    const S=this.state, G=this.topo;\n    if(!S.archStageNode||!S.archStageFault||!G) return null;\n    const node=G.nodes[S.archStageNode]; if(!node) return null;\n    const def=ESS.FaultEngine.getFaultDef(S.archStageFault); if(!def) return null;\n    const status=this.archLedgerStatus(S.archStageFault,S.archStageNode);\n    const bump=()=>this.setState(s=>({tk:s.tk+1}));\n    return {\n      nodeId:S.archStageNode, nodeLabel:node.label, nodeLayer:node.layer, nodeKind:node.kind,\n      faultId:S.archStageFault, domain:def.domain, recoveryT:def.recovery,\n      statusT:status||'NOT ACTIVE',\n      hasMag:!!def.magnitudeRange,\n      magMin:def.magnitudeRange?String(def.magnitudeRange.min):'0', magMax:def.magnitudeRange?String(def.magnitudeRange.max):'1',\n      magStep:def.magnitudeRange?String(def.magnitudeRange.step):'1', magEu:def.magnitudeRange?def.magnitudeRange.eu:'',\n      magVal:S.archStageMag, magChange:(e)=>this.setState({archStageMag:e.target.value}),\n      delayVal:S.archStageDelay, delayChange:(e)=>this.setState({archStageDelay:e.target.value}),\n      durationVal:S.archStageDuration, durationChange:(e)=>this.setState({archStageDuration:e.target.value}),\n      modeStep:{label:'STEP',bg:S.archStageMode!=='RAMP'?'#B8C4D4':'#D4D0C8',bc:S.archStageMode!=='RAMP'?'#31548F':'#FFFFFF #6E6E6E #6E6E6E #FFFFFF',cb:()=>this.setState({archStageMode:'STEP'})},\n      modeRamp:{label:'RAMP',bg:S.archStageMode==='RAMP'?'#B8C4D4':'#D4D0C8',bc:S.archStageMode==='RAMP'?'#31548F':'#FFFFFF #6E6E6E #6E6E6E #FFFFFF',cb:()=>this.setState({archStageMode:'RAMP'})},\n      isRamp:S.archStageMode==='RAMP',\n      rampVal:S.archStageRamp, rampChange:(e)=>this.setState({archStageRamp:e.target.value}),\n      visibilityT:'Follows the HIDDEN UPSETS switch above -- currently '+(this.instr.hidden?'ON: this injection leaves no trace in the trainee journal.':'OFF: this injection is mirrored into the trainee journal, same as an upset.')+' The ARCH view shows the resulting symptom either way (V3-PLAN addendum).',\n      canActivate:!status, showClear:!!status,\n      activate:()=>{ this.setArchFault(S.archStageFault,S.archStageNode,{delaySec:Number(S.archStageDelay)||0,\n        durationSec:S.archStageDuration===''?null:Number(S.archStageDuration), mode:S.archStageMode,\n        rampSec:Number(S.archStageRamp)||0, magnitude:def.magnitudeRange?Number(S.archStageMag):null}); bump(); },\n      clear:()=>{ this.clearArchFault(S.archStageFault,S.archStageNode); bump(); },\n      close:()=>this.setState({archStageNode:null,archStageFault:null})\n    };\n  }\n  // Instructor-only summary of every currently active or pending panel-injected engine\n  // fault: ro n\n    // S3 training controls (V3-PLAN section 6, DO items 1-3). MARK EVIDENCE, VERIFY and PIN\n    // target the open inspector's node; all three are offered only once a node is selected,\n    // which is also the one explicit-open event that satisfies dispatch's fail-closed\n    // wasInspected check (archSelectNode marks it BEFORE these buttons are even reachable)\n    // -- clicking one here can never be \"marking a node you never opened\".\n    //\n    // DIAGNOSE-ONLY, MATCHING dispatch.js's OWN GATE (src/dispatch.js requireMode(),\n    // \"every command that can earn rubric points is gated to the mode in which earning it\n    // means something\" -- Learn shows blast radius, so marking/pinning/verifying there\n    // would bank rubric points for reading the answer key rather than inferring it).\n    // dispatch.js enforces this as the BINDING rule regardless of what the UI shows (the\n    // scorer reads the journal, not the DOM); hiding these controls outside Diagnose here\n    // is belt-and-braces so a trainee is never shown a button that can only ever refuse.\n    const diagnoseOn=S.archMode==='diagnose';\n    const debriefOn=S.archMode==='debrief';\n    const debrief=debriefOn?this.archDebriefView():{rows:[],empty:true,summary:'',projection:''};\n    const evidenceChip=(diagnoseOn&&selNode)?{label:'MARK EVIDENCE',cb:()=>this.markEvidence(selNode)}:null;\n    const verifyChip=(diagnoseOn&&selNode)?{label:'VERIFY',cb:()=>this.verifyNode(selNode)}:null;\n    const pinTray=S.archPinTray||[];\n    const pinChip=(diagnoseOn&&selNode)?{label:pinTray.indexOf(selNode)>=0?'UNPIN':'PIN',cb:()=>this.togglePin(selNode)}:null;\n    const pinTrayView=pinTray.map(id=>({id,label:(G.nodes[id]&&G.nodes[id].label)||id,cb:()=>this.togglePin(id)}));\n    const compareChip={label:'COMPARE PINNED ('+pinTray.length+')',cb:()=>this.comparePins()};\n    // SUBMIT HYPOTHESIS: seven chips, one per ESS.Dispatch.LAYERS domain (identical to\n    // ESS.Topology.LAYERS -- tests/dispatch-training.test.js pins the two lists equal),\n    // rendered only in Diagnose mode (V3-PLAN addendum Q3). A trainee names a failure\n    // DOMAIN, never a fault id -- dispatch.js's own validate refuses anything else.\n    const hypothesisChips=diagnoseOn?ESS.Dispatch.LAYERS.map(dom=>({label:dom,cb:()=>this.submitHypothesis(dom)})):[];\n\n    const inspector=view.inspector?{\n      title:view.inspector.title, layer:view.inspector.layer, kind:view.inspector.kind,\n      rows:view.inspector.rows, traceActions, evidenceChip, verifyChip, pinChip\n    }:null;\n\n    const branches=(view.path&&view.path.branches||[]).map(b=>({\n      type:b.type, available:b.available, unavailable:!b.available,\n      label:(b.type||'').toUpperCase(), describeText:b.describeText,\n      nodes:b.nodes.map(n=>({id:n.id,label:n.label,cb:selectNode(n.id)}))\n    }));\n\n    return {\n      banner:view.banner, modeChips, profileChips, beginnerChip,\n      hasObservations:observations.length>0, observations,\n      profileHelp:S.archProfile==='flex'\n        ? 'FLEX profile: this simulator has one physical station; FLEX is a view profile reading the data server’s cache on that same station, not a second machine.'\n        : 'CONSOLE profile: this simulator has one physical station; CONSOLE is a view profile reading the controller directly on that same station, not a second machine.',\n      tagT:tag||'(none selected — use a SIGNAL PATH action, or trace a point from its inspector)',\n      svgW, svgH, layers, edges,\n      inspector, hasInspector:!!inspector, inspectorEmpty:!inspector,\n      showPath:modeForBuild!=='learn',\n      pathEmpty:!!view.empty, pathEmptyText:view.emptyText,\n      branches,\n      hasPins:diagnoseOn&&pinTray.length>0, pinTrayView, pinCount:String(pinTray.length), compareChip,\n      diagnoseOn, hypothesisChips,\n      debriefOn, debrief\n    };\n  }\n  // S4: ESS.Debrief timeline for ARCH Debrief mode / replay. The module is pure; this\n  // only packages live journals. Replay and instructor sessions may reveal architecture\n  // truth; a trainee reviewing without replay gets TRAINEE_SAFE (no fault ids).\n  archFaultTimeline(){\n    if(this.P.archFaultLog&&this.P.archFaultLog.length) return this.P.archFaultLog.slice();\n    const list=(this.P.archFaults&&this.P.archFaults.activeFaults)||[];\n    return list.map(f=>({\n      t:f.activatedAt!=null?f.activatedAt:this.t0,\n      faultId:f.faultId, targetNodeId:f.targetNodeId, phase:'ACTIVE', health:f.health\n    }));\n  }\n\n  // LEAKAGE FIX (adversarial verify, S3 round): ESS.Debrief's own journal pass is\n  // unconditional -- it renders every journal row's text regardless of projection\n  // (src/debrief.js's own header: \"the module cannot know which prose does\" name a\n  // fault, so filtering PROSE is the CALLER's job, explicitly). Three journaled ops\n  // carry a fault identity directly in {tag,arg} and all three stamp instr:true:\n  // legacy 'UPSET' (tag IS the reserved upset key, e.g. 'xmtr'/'drift'/'stick' --\n  // I.journalText renders literally \"UPSET xmtr ON\"), and 'ARCHFAULT'/'ARCHCLEAR'\n  // (arg IS the literal FaultEngine faultId, e.g. \"ARCHFAULT SVC-SERVER\n  // SERVER_SERVICE_DEGRADED\"). Left unfiltered, a plain trainee session (no replay,\n  // no instructor auth -- projection TRAINEE_SAFE) that opens ARCH Debrief sees the\n  // root cause verbatim the moment any fault has ever been injected, hidden switch\n  // or not -- the same shape of leak S2 found in the instructor-log mirror. Strip\n  // just these three ops when not revealing, matching the \"no trace\" guarantee\n  // hiddenNote already promises elsewhere, rather than editing the locked module or\n  // touching any row this method does not itself compose.\n  archDebriefJournalSafe(reveal){\n    if(reveal) return this.instr.journal;\n    return this.instr.journal.filter(e=>!(e&&e.instr&&(e.op==='UPSET'||e.op==='ARCHFAULT'||e.op==='ARCHCLEAR')));\n  }\n  archDebriefView(){\n    const I=ESS.Instructor;\n    const reveal=!!(this.instructorAllowed()||(this.instr&&this.instr.replay));\n    let score=null;\n    if(this.P.aDrill) score=this.aDrillRecordShape(ESS.DrillArch.scoreDrill(this.P.aDrill.id,this.P.aDrill.events.slice()));\n    else if(this._lastADrill) score=this._lastADrill;\n    const out=ESS.Debrief.build({\n      journal:this.archDebriefJournalSafe(reveal), alarmLog:this.alarmLog, events:this.events,\n      // A TRAINEE_SAFE timeline that names the exact changed topology node still reveals\n      // the answer. Live debrief remains available for its required response, but root\n      // location rows are instructor/replay-only.\n      hist:this.hist, faultTimeline:reveal?this.archFaultTimeline():[], score:score, t0:this.t0\n    },{\n      projection:reveal?'DEBRIEF_REVEALED':'TRAINEE_SAFE',\n      journalText:e=>I.journalText(e,t=>this.fT(t)),\n      tags:['FIC102','TIC201','LIC101']\n    });\n    const counts=out.summary&&out.summary.counts||{};\n    const aDrillOn=!!this.P.aDrill;\n    return {\n      rows:this.dofNoteRows().concat((out.rows||[]).map(r=>{\n        const pv=r.process||{};\n        const pvT=Object.keys(pv).map(k=>k+' '+(pv[k].pv!=null?this.fmt(pv[k].pv,1):'')).join(' · ');\n        return {\n          rel:this.mmss(r.rel||0), lane:r.lane, actor:r.actor, kind:r.kind, text:r.text,\n          pvT:pvT, hasPv:!!pvT,\n          fg:r.kind==='REFUSED'?'#7A2E0E':(r.kind==='SCORE'?'#0a3a12':'#1c1c1c')\n        };\n      })),\n      empty:!out.rows.length&&!this.dofNoteRows().length,\n      summary:(counts.operator||0)+' operator · '+(counts.instructor||0)+' instructor · '+(counts.refused||0)+' refused'+(score?(' · score '+score.score+'/100'):''),\n      projection:out.projection,\n      ask:aDrillOn, submit:()=>this.submitADrillDebrief()\n    };\n  }\n  // Alarm and display philosophy page (ESS.Philosophy; sources ISA-18.2, EEMUA 191, ASM gray-background paper, Rockwell style guide — RESOURCES 2.4, 2.11, 2.19)\n  // The PROC dialog (P2L-EXPANSION-SPEC section 2.2): ESS.Process is the single copy of the\n  // orientation document the operator reads here and PIP reads through tools/coach/serve.py.\n  // Built only while the dialog is open: renderVals() runs at every setState, not just 2 Hz.\n  cloudKeyView(open){\n    if(!open) return {key:'',model:'',status:'',note:'',live:false,keyChange:null,keyKey:null,modelChange:null,save:null,useLocal:null,forget:null};\n    const S=this.state, live=!!S.coachLive;\n    const status=live\n      ?('Sidecar: '+(S.coachProvider||'local').toUpperCase()+' · model '+(S.coachModel||'?')+' · credential: '+({session:'a key entered at a station',env:\"the sidecar's environment\",profile:\"this machine's ant auth login sign-in\",none:'none'}[S.coachCred]||(S.coachCred||'none')))\n      :'Sidecar OFFLINE — this page was not launched with Launch Station.command, so there is nowhere to hold a key.';\n    return {key:S.dlgKey,model:S.dlgKeyModel,status,live,\n      note:'The key goes only to the local coach sidecar on this machine and is held in its memory for this session. It is never written to disk, never journaled, never snapshotted, never logged and never shown to the model. Restarting the sidecar forgets it. FORGET KEY also returns PIP to the local model. One sidecar holds one key: the last key entered wins for every station it serves. Without a key, PIP can use the cloud only if the sidecar\\'s environment or this machine\\'s ant auth login sign-in supplies a credential, and the status line above says which one is in use.',\n      keyChange:(e)=>this.setState({dlgKey:e.target.value}),keyKey:(e)=>{if(e.key==='Enter')this.saveCloudKey();},\n      modelChange:(e)=>this.setState({dlgKeyModel:e.target.value}),\n      save:()=>this.saveCloudKey(),useLocal:()=>this.coachCredential({provider:'ollama'},'local model selected'),\n      forget:()=>this.coachCredential({clear:true,provider:'ollama'},'cloud key forgotten')};\n  }\n  processView(open){\n    if(!open) return {lede:'',sections:[],sources:[]};\n    // The document is hard-wrapped at ~70 columns for its plain-text reader (PIP). For the\n    // dialog, running lines of a paragraph are re-joined; a paragraph whose lines are\n    // indented (the route diagram, the numbered list) is kept verbatim under pre-wrap.\n    const reflow=(body)=>body.split('\\n\\n').map(par=>{ const lines=par.split('\\n'); return lines.some(l=>/^\\s{2,}\\S/.test(l))?par:lines.map(l=>l.trim()).join(' '); }).join('\\n\\n');\n    return {lede:'Our own prose about our own plant. The plant does not exist and nothing here derives from any real facility. Command PROCESS opens this page; PIP reads the same text.',\n      sections:ESS.Process.sections().map(sec=>({title:sec.title,body:reflow(sec.body)})),sources:ESS.Process.sources()};\n  }\n  // W2 (CONVERGENCE-SPEC item 2, contract docs/dev/W2-CAUSE-EFFECT-CONTRACT.md): the C&E chart.\n  //\n  // VISIBILITY FAILS CLOSED, which is the opposite of dofPreflight's fail-open, and deliberately:\n  // there the risk was a drill wrongly blocked, here it is a surface shown too early. A chart that\n  // tells an operator which cause drives which final element is making a claim about the plant with\n  // a console display's authority, so it stays instructor-only until the coverage gate has proved\n  // the matrix equals the code across all six seam rows. Promotion is one word in\n  // src/cause-effect.js (CHART_VISIBILITY), and demotion is the same word back.\n  ceVisibleToOperator(){ return !!(typeof ESS!=='undefined'&&ESS.CauseEffect&&ESS.CauseEffect.CHART_VISIBILITY==='operator'); }\n  ceAllowed(){ return this.ceVisibleToOperator()||this.instructorAllowed(); }\n  ceView(open){\n    if(!open||typeof ESS==='undefined'||!ESS.CauseEffect) return {rows:[],cols:[],note:'',locked:true,empty:true};\n    if(!this.ceAllowed()) return {rows:[],cols:[],locked:true,empty:true,\n      note:'CAUSE AND EFFECT CHART — INSTRUCTOR ONLY. The chart becomes operator-visible once the coverage gate has verified every declared row against the code.'};\n    const CE=ESS.CauseEffect, cols=CE.effects(), cells=CE.cells();\n    const rows=CE.causes().map(c=>({\n      id:c.id, src:c.src, cond:c.cond, seam:c.seam,\n      trip:c.threshold==null?'':(c.comparator+' '+c.threshold+(c.eu?' '+c.eu:'')),\n      reset:c.reset||'', desc:c.desc||'',\n      seamNote:c.seam==='onTrip'?'':'raised by the station, not by the process models',\n      cells:cols.map(col=>({id:col.id,mark:cells.some(x=>x.causeId===c.id&&x.effectId===col.id)?'X':'·'}))\n    }));\n    return {\n      rows, cols:cols.map(col=>({id:col.id,target:col.target,action:col.action})),\n      locked:!this.ceVisibleToOperator(), empty:!rows.length,\n      note:this.ceVisibleToOperator()?'Declared cause and effect. The chart states what the plant does; it does not make it happen.'\n        :'INSTRUCTOR VIEW — not yet released to the operator. The chart states what the plant does; it does not make it happen.'\n    };\n  }\n  philosophyView(){\n    const name=this.paletteName(), C=this.colours();\n    const ctx={paletteName:this.paletteLabel(name),urgentPct:5,highPct:10,lowPct:85,isaLow:80,isaHigh:15,isaUrgent:5,shelveMaxMin:60,defaultDeadbandPct:1};\n    return {sections:ESS.Philosophy.sections(ctx),sources:ESS.Philosophy.sources(),ladder:ESS.Philosophy.limitLadder(),\n      palettes:ESS.Palette.list().map(pn=>({label:this.paletteLabel(pn),bg:name===pn?'#B8C4D4':'#D4D0C8',bc:name===pn?'#31548F':'#FFFFFF #6E6E6E #6E6E6E #FFFFFF',cb:()=>this.setPalette(pn)})),\n      swatches:['Urgent','High','Low','Journal'].map(p=>({label:p.toUpperCase(),bg:C.prio[p],fg:C.prioText[p],bd:C.prioDim[p]}))};\n  }\n  // Step-response sparkline for the Loop Tune tab: PV, SP and OP over the last `mins` minutes of history on a 320×90 box.\n  stepSparkline(l,mins){\n    const h=this.hist[l.tag]||[], W=320, H=90, t1=this.P.t, t0=t1-mins*60000, span=(l.hi-l.lo)||1;\n    const start=Math.max(0,h.length-Math.ceil(mins*120)), stride=Math.max(1,Math.floor((h.length-start)/160));\n    const line=(idx,lo,sp)=>{ const pts=[]; for(let i=start;i<h.length;i+=stride){ const r=h[i]; if(r[0]<t0) continue; const x=(r[0]-t0)/(t1-t0)*W, y=H-((r[idx]-lo)/sp)*H; pts.push(x.toFixed(1)+','+Math.max(1,Math.min(H-1,y)).toFixed(1)); } return pts.join(' '); };\n    let lastStep=null; for(let i=Math.max(start,1);i<h.length;i++){ if(h[i][0]>=t0&&Math.abs(h[i][2]-h[i-1][2])>span*0.005) lastStep=h[i][0]; }\n    const note=h.length<4?'History is collecting — the response draws as samples arrive.':(lastStep?'Last SP step at '+this.fT(lastStep)+'; watch how PV settles against SP. Vertical axis is the PV range for PV/SP and 0–100 % for OP.':'No SP step in the window; change the SP (AUTO) to see a step response. Vertical axis is the PV range for PV/SP and 0–100 % for OP.');\n    return {span:mins+' MIN',pv:line(1,l.lo,span),sp:line(2,l.lo,span),op:line(3,0,100),note};\n  }\n  mmss(ms){ const s=Math.max(0,Math.floor(ms/1000)); return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2); }\n}\n<\/script>\n<\/body>\n<\/html>\n"</script>
