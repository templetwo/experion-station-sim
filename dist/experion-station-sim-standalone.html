document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<!-- @artifact production -->\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e8b556e5-cf05-5069-8651-aa7bac686187\"><\/script>\n<script src=\"c0aee55e-13b8-5937-bc7c-745b064f0d5c\"><\/script>\n<script src=\"5e72f3e6-3420-5519-9879-60ef12e9ace8\"><\/script>\n<script src=\"6a79b040-1fc7-5a2b-8e50-89cb58f70026\"><\/script>\n<script src=\"c372eb14-5019-542e-a3ab-c1a5b70d81ff\"><\/script>\n<script src=\"3e1b45aa-0217-5c09-a124-6dead5d78d7a\"><\/script>\n<script src=\"9298b6b8-5034-51f9-a2ad-6384ceab24cf\"><\/script>\n<script src=\"a0b61971-d33b-57a0-b5b3-61ea2c3fa3b1\"><\/script>\n<script src=\"fbfa1fd7-0ed6-5110-8b15-0c7b1d411c34\"><\/script>\n<script src=\"2d592a0d-108e-5b77-8b53-55ecb58c63d7\"><\/script>\n<script src=\"931c8de2-aae3-5f03-8eb6-5ec67356b21d\"><\/script>\n<script src=\"6f6cc63a-9190-5b97-8113-dd965766f032\"><\/script>\n<script src=\"5b523ea2-6365-5955-ab73-d39fce2670d4\"><\/script>\n<script src=\"db57dbe0-fda5-5a06-ac84-6ed13303eb76\"><\/script>\n<script src=\"487ecabf-6f81-5509-9896-c4d72f43bfaa\"><\/script>\n<script src=\"c012a3a1-fa0a-57bf-8692-d73aee244ae9\"><\/script>\n<script src=\"c483f5a2-6cb9-5234-9e81-4af3d49c54b1\"><\/script>\n<script src=\"396e0950-89ec-53e6-9bb3-1dbd0b687c6a\"><\/script>\n<script src=\"6c2fd92d-a3af-53b4-83f3-58b9f90c0b67\"><\/script>\n<script src=\"e44f5863-11bb-5f44-a60c-62dc65c15e04\"><\/script>\n<script src=\"292801af-cdde-5c4c-82f7-ee81474eb6c8\"><\/script>\n<script src=\"33467304-8f3d-53ce-945e-33c1fe37ba64\"><\/script>\n<script src=\"0167892e-0591-5986-97f2-4bede93e36b3\"><\/script>\n<script src=\"7060d1f6-79d4-5ed3-99fc-ea3609687b4b\"><\/script>\n<script src=\"aa3b1aea-14b0-5d56-be30-cbb85dd1ee0f\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<template id=\"__bundler_thumbnail\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"#41608A\"><\/rect><rect x=\"30\" y=\"34\" width=\"40\" height=\"26\" fill=\"#D4D0C8\"><\/rect><rect x=\"34\" y=\"38\" width=\"14\" height=\"8\" fill=\"#FF0000\"><\/rect><rect x=\"52\" y=\"38\" width=\"14\" height=\"8\" fill=\"#00D8D8\"><\/rect><rect x=\"34\" y=\"50\" width=\"32\" height=\"6\" fill=\"#41608A\"><\/rect><rect x=\"44\" y=\"60\" width=\"12\" height=\"6\" fill=\"#D4D0C8\"><\/rect><\/svg><\/template>\n<helmet>\n<style>\nhtml,body{margin:0;padding:0;height:100%;background:#8f8f8f;overflow:hidden}\n*{box-sizing:border-box}\na{color:#1a4a7a;text-decoration:none}a:hover{color:#0a3a6a;text-decoration:underline}\ninput,select,button{font-family:Tahoma,Verdana,'Segoe UI',sans-serif}\n::-webkit-scrollbar{width:14px;height:14px;background:#D4D0C8}\n::-webkit-scrollbar-thumb{background:#B4B0A8;border:2px solid #D4D0C8}\n.ess-pip{position:fixed;z-index:920;bottom:46px;width:108px;cursor:pointer;user-select:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.28));transition:right .22s ease,transform .18s ease}\n.ess-pip:hover{transform:translateY(-5px) rotate(-4deg)}\n.ess-pip[data-mood=idle]{animation:ess-pip-idle 2.8s ease-in-out infinite}\n.ess-pip[data-mood=think]{animation:ess-pip-bob .7s ease-in-out infinite}\n.ess-pip[data-mood=talk]{animation:ess-pip-talk .34s ease-in-out infinite}\n.ess-pip[data-mood=alarm]{animation:ess-pip-alarm .5s steps(2) infinite}\n.ess-pip[data-mood=off]{filter:grayscale(.85) drop-shadow(2px 3px 0 rgba(0,0,0,.2));opacity:.78}\n.ess-pip-svg{display:block;margin:0 auto}\n.ess-pip[data-mood=think] .ess-pip-eye{animation:ess-pip-blink .7s infinite}\n.ess-pip[data-mood=talk] .ess-pip-needle{transform-origin:44px 58px;animation:ess-pip-needle .28s ease-in-out infinite}\n.ess-pip-tag{margin-top:2px;text-align:center;font:700 10px Tahoma,Verdana,sans-serif;color:#1a1a1a;background:#FFE000;border:2px solid #3c3c3c;padding:1px 4px}\n.ess-pip-cloud{position:absolute;bottom:118px;right:0;width:196px;background:#F4F0D8;border:2px solid #3c3c3c;padding:7px 8px 9px;font:10px Tahoma,Verdana,sans-serif;color:#2c2c2c;line-height:1.35;box-shadow:3px 3px 0 #6E6E6E}\n.ess-pip-cloud:after{content:\"\";position:absolute;bottom:-12px;right:34px;width:0;height:0;border:12px solid transparent;border-top-color:#3c3c3c}\n.ess-pip-cloud-k{font-weight:700;font-size:9px;letter-spacing:.08em;color:#6E4000;margin-bottom:3px}\n.ess-pip-cloud-t{max-height:48px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}\n.ess-pip-dots{display:flex;gap:5px;padding:6px 2px 2px}\n.ess-pip-dots span{width:7px;height:7px;border-radius:50%;background:#3c3c3c;animation:ess-pip-dot 1s infinite}\n.ess-pip-dots span:nth-child(2){animation-delay:.15s}\n.ess-pip-dots span:nth-child(3){animation-delay:.3s}\n.ess-coach-feed{margin:4px 8px;max-height:210px;overflow-y:auto;background:#E8E4D8;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E}\n.ess-coach-row{padding:6px 8px;border-bottom:1px solid #C8C4B8}\n.ess-coach-row:last-child{border-bottom:0}\n.ess-coach-who{font-size:9px;font-weight:700;letter-spacing:.06em;margin-bottom:2px}\n.ess-coach-body{font-size:10.5px;line-height:1.45;color:#2c2c2c;white-space:pre-wrap}\n.ess-coach-live .ess-coach-body:after{content:\"▍\";animation:ess-pip-caret 1s steps(1) infinite}\n@keyframes ess-pip-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}\n@keyframes ess-pip-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(3deg)}}\n@keyframes ess-pip-talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}\n@keyframes ess-pip-alarm{0%{filter:drop-shadow(2px 3px 0 rgba(0,0,0,.28))}50%{filter:drop-shadow(0 0 6px #CC0000)}}\n@keyframes ess-pip-blink{0%,100%{opacity:1}50%{opacity:.12}}\n@keyframes ess-pip-needle{0%{transform:rotate(-22deg)}50%{transform:rotate(26deg)}100%{transform:rotate(-22deg)}}\n@keyframes ess-pip-dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}\n@keyframes ess-pip-caret{0%,49%{opacity:1}50%,100%{opacity:0}}\n@media (prefers-reduced-motion:reduce){\n.ess-pip,.ess-pip[data-mood],.ess-pip-eye,.ess-pip-needle,.ess-pip-dots span,.ess-coach-live .ess-coach-body:after{animation:none}\n}\n/* ---------------------------------------------------------------------------\n   NIGHT THEME -- the dark console. Facelift review item 1 (docs/dev/FACELIFT-REVIEW-MEMO.md).\n\n   Scoped to .ess-night on the root: today's look is the default AND the fallback, and the switch\n   is the Station menu's existing alarm-colour-philosophy control. Nothing loads from the network\n   -- no font file, no external sheet (Rule 7). Remove the class and the shipped look returns\n   byte for byte; no markup carries a theme decision.\n\n   SELECTORS MATCH rgb(), NOT HEX, and that is not cosmetic. React normalises inline styles, so a\n   template literal of #D4D0C8 reaches the DOM as \"background: rgb(212, 208, 200)\". A first cut of\n   this file matched on hex and silently selected NOTHING -- the page rendered unchanged and looked\n   like a CSS specificity problem. Verified by dumping the rendered DOM: 0 hex occurrences, 35 rgb.\n   If a colour is ever added here, take the value from the rendered DOM, not from the template.\n\n   Every text pair was measured before it was written: worst 6.63, best 15.66 (AA needs 4.5).\n   Borders use #6B7684 (3.78 on chrome) to clear WCAG 1.4.11 non-text contrast at 3.0.\n--------------------------------------------------------------------------- */\n.ess-night{background:#161A20 !important;color:#E6EAF0 !important}\n/* chrome, panels, lists -- the big surfaces */\n.ess-night [style*=\"rgb(212, 208, 200)\"]{background-color:#161A20 !important}\n.ess-night [style*=\"rgb(207, 207, 203)\"]{background-color:#1C232C !important}\n.ess-night [style*=\"rgb(198, 198, 198)\"]{background-color:#12161C !important}\n.ess-night [style*=\"rgb(191, 191, 191)\"]{background-color:#0E1116 !important}\n.ess-night [style*=\"rgb(205, 205, 205)\"]{background-color:#1C232C !important}\n.ess-night [style*=\"rgb(216, 216, 216)\"]{background-color:#222A34 !important}\n.ess-night [style*=\"rgb(204, 200, 192)\"]{background-color:#1A1F26 !important}\n.ess-night [style*=\"rgb(201, 197, 189)\"]{background-color:#1A1F26 !important}\n.ess-night [style*=\"background: rgb(255, 255, 255)\"]{background-color:#0E1218 !important}\n.ess-night [style*=\"rgb(184, 196, 212)\"]{background-color:#24303F !important}\n/* remaining surfaces found by dumping the night DOM: assistant chips, panel headers */\n.ess-night [style*=\"rgb(250, 250, 248)\"]{background-color:#161A20 !important}\n.ess-night [style*=\"rgb(196, 193, 186)\"]{background-color:#1A1F26 !important}\n.ess-night [style*=\"rgb(255, 255, 255)\"]{background-color:#12161C !important}\n/* the white 3D highlight: glaring on a dark ground, and it is the single biggest\n   remaining tell of the Win95 bevel. Border colours are UI-component boundaries, so the\n   replacement clears WCAG 1.4.11 non-text contrast at 3.0 rather than AA text contrast. */\n.ess-night [style*=\"border-color: rgb(255, 255, 255)\"],\n.ess-night [style*=\"border: 1px solid rgb(255, 255, 255)\"],\n.ess-night [style*=\"border: 2px solid rgb(255, 255, 255)\"]{border-color:#39424E !important}\n.ess-night [style*=\"rgb(110, 110, 110)\"]{border-color:#6B7684 !important}\n/* the Win95 bevels: white highlight and grey shadow become one quiet rule */\n.ess-night [style*=\"rgb(154, 150, 142)\"]{background-color:#2A313B !important;border-color:#39424E !important}\n/* text */\n.ess-night [style*=\"color: rgb(0, 0, 0)\"]{color:#E6EAF0 !important}\n.ess-night [style*=\"color: rgb(44, 44, 44)\"]{color:#D6DCE4 !important}\n.ess-night [style*=\"color: rgb(60, 60, 60)\"]{color:#C5CCD6 !important}\n.ess-night [style*=\"color: rgb(85, 82, 76)\"]{color:#A8B0BC !important}\n.ess-night [style*=\"color: rgb(106, 102, 94)\"]{color:#A8B0BC !important}\n.ess-night [style*=\"color: rgb(110, 110, 110)\"]{color:#A8B0BC !important}\n.ess-night [style*=\"color: rgb(92, 88, 80)\"]{color:#A8B0BC !important}\n/* inputs and focus -- the app ships no focus style at all, in either theme (review item 12) */\n.ess-night input,.ess-night select,.ess-night textarea{background:#0E1218 !important;color:#E6EAF0 !important;border:1px solid #6B7684 !important}\n.ess-night input::placeholder{color:#8C94A0 !important}\n.ess-night :focus-visible,.ess-night input:focus,.ess-night select:focus{outline:2px solid #7EB6D6 !important;outline-offset:1px}\n/* the P&ID: muted steel, so saturation stays available to mean abnormal (ISA-101).\n   SVG text carries its colour as an INLINE style (\"fill: rgb(85, 82, 76)\"), so every rule below\n   needs !important -- a plain `svg text{fill:...}` loses to the inline value and leaves the\n   graphic labels unreadably dark on the new ground. That was the visible defect in the first\n   render. Attribute fills (fill=\"#4a4a4a\") do NOT need it; both forms are present. */\n.ess-night svg [fill=\"#BFBFBF\"],.ess-night svg [fill=\"#CDCDCD\"],.ess-night svg [fill=\"#C4C4C4\"]{fill:#0E1116}\n.ess-night svg [fill=\"#D4D0C8\"],.ess-night svg [fill=\"#D8D8D8\"]{fill:#1C232C}\n.ess-night svg [fill=\"#FFFFFF\"]{fill:#C5CCD6}\n.ess-night svg [fill=\"#4a4a4a\"],.ess-night svg [fill=\"#4A4A4A\"]{fill:#8C96A4}\n.ess-night svg [fill=\"#41608A\"],.ess-night svg [fill=\"#4a6a8a\"],.ess-night svg [fill=\"#93A8B8\"]{fill:#2E4257}\n.ess-night svg [stroke=\"#4a4a4a\"],.ess-night svg [stroke=\"#6a6a6a\"],.ess-night svg [stroke=\"#7a7a7a\"]{stroke:#6B7684}\n/* inline fills on <text>, measured against the #0E1116 canvas:\n   #E6EAF0 15.66 · #C5CCD6 11.69 · #A8B0BC 8.65 · #7EB6D6 8.60 -- AA needs 4.5 */\n.ess-night svg [style*=\"fill: rgb(60, 60, 60)\"],\n.ess-night svg [style*=\"fill: rgb(0, 0, 0)\"]{fill:#E6EAF0 !important}\n.ess-night svg [style*=\"fill: rgb(85, 82, 76)\"],\n.ess-night svg [style*=\"fill: rgb(68, 65, 60)\"],\n.ess-night svg [style*=\"fill: rgb(74, 74, 74)\"],\n.ess-night svg [style*=\"fill: rgb(58, 58, 58)\"]{fill:#C5CCD6 !important}\n.ess-night svg [style*=\"fill: rgb(106, 102, 94)\"]{fill:#A8B0BC !important}\n.ess-night svg [style*=\"fill: rgb(49, 84, 143)\"]{fill:#7EB6D6 !important}\n/* red and amber fills are left alone: on this board they already mean abnormal */\n.ess-night ::-webkit-scrollbar{background:#12161C}\n.ess-night ::-webkit-scrollbar-thumb{background:#39424E;border:2px solid #12161C;border-radius:8px}\n<\/style>\n<\/helmet>\n<div class=\"ess-root {{ themeClass }}\" style=\"position:fixed;inset:0;display:flex;flex-direction:column;font:12px Tahoma,Verdana,'Segoe UI',sans-serif;background:#D4D0C8;color:#000;font-variant-numeric:tabular-nums\" onMouseMove=\"{{ rootMove }}\" onMouseUp=\"{{ rootUp }}\">\n\n<div style=\"display:flex;align-items:center;gap:2px;padding:1px 4px;border-bottom:1px solid #9a968e;user-select:none\">\n  <sc-for list=\"{{ menus }}\" as=\"m\" hint-placeholder-count=\"5\">\n    <div style=\"position:relative\">\n      <div style=\"padding:3px 9px;cursor:default;background:{{ m.bg }};color:{{ m.fg }}\" onClick=\"{{ m.toggle }}\">{{ m.name }}<\/div>\n      <sc-if value=\"{{ m.open }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;top:100%;left:0;z-index:800;min-width:230px;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF;box-shadow:3px 3px 6px rgba(0,0,0,0.35);padding:2px\">\n          <sc-for list=\"{{ m.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <sc-if value=\"{{ it.sep }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"height:1px;background:#9a968e;margin:3px 6px\"><\/div><\/sc-if>\n            <sc-if value=\"{{ it.label }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:4px 18px;cursor:default;white-space:nowrap\" style-hover=\"background:#31548F;color:#FFFFFF\" onClick=\"{{ it.cb }}\">{{ it.label }}<\/div>\n            <\/sc-if>\n          <\/sc-for>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n  <\/sc-for>\n  <div style=\"flex:1\"><\/div>\n  <sc-if value=\"{{ showBadge }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"font-size:10px;color:#5c5850;padding-right:4px\">INDEPENDENT TRAINING SIMULATOR — representative of Experion® conventions · not a Honeywell product<\/div>\n  <\/sc-if>\n<\/div>\n\n<div style=\"display:flex;align-items:stretch;gap:3px;padding:3px 4px;border-bottom:1px solid #9a968e;user-select:none;flex-wrap:nowrap\">\n  <sc-for list=\"{{ tbtns }}\" as=\"b\" hint-placeholder-count=\"8\">\n    <sc-if value=\"{{ b.sep }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:1px;background:#9a968e;margin:1px 2px\"><\/div><\/sc-if>\n    <sc-if value=\"{{ b.label }}\" hint-placeholder-val=\"{{ false }}\">\n      <div title=\"{{ b.title }}\" style=\"padding:4px 8px;background:{{ b.bg }};border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF;font-size:11px;font-weight:700;color:#2c2c2c;cursor:pointer;white-space:nowrap;display:flex;align-items:center\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;background:#C8C4BC\" onClick=\"{{ b.cb }}\">{{ b.label }}<\/div>\n    <\/sc-if>\n  <\/sc-for>\n<\/div>\n\n<div style=\"display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:2px solid #9a968e;user-select:none\">\n  <div style=\"font-size:11px;color:#3c3c3c\">Command:<\/div>\n  <input value=\"{{ cmdVal }}\" onChange=\"{{ onCmd }}\" onKeyDown=\"{{ onCmdKey }}\" spellcheck=\"false\" style=\"width:170px;padding:3px 5px;font-size:12px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none\" />\n  <div style=\"width:270px;padding:4px 6px;background:#C9C5BD;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;font-size:11px;color:#7a1a00;font-weight:700;height:24px;overflow:hidden;white-space:nowrap\">{{ msgTxt }}<\/div>\n  <div style=\"flex:1;display:flex;align-items:center;padding:0 6px;background:{{ al.bg }};color:{{ al.fg }};border:2px solid;border-color:#6 >\n    <div style=\"font-size:12px;color:#3c3c3c\">{{ dpt.desc }}<\/div>\n    <div style=\"flex:1\"><\/div>\n    <div style=\"font-size:11px;color:#55524c\">CM: {{ dpt.cm }} · EXEC PERIOD 500 mS (SIM) · {{ dpt.kindT }}<\/div>\n    <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ dpt.sigPath }}\">SIGNAL PATH<\/div>\n  <\/div>\n  <div style=\"display:flex;gap:2px;padding:4px 8px 0 8px;background:#CCC8C0;user-select:none\">\n    <sc-for list=\"{{ dpt.tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n      <div style=\"padding:5px 16px;font-size:12px;font-weight:700;cursor:pointer;background:{{ t.bg }};border:1px solid #9a968e;border-bottom:{{ t.bb }}\" onClick=\"{{ t.cb }}\">{{ t.label }}<\/div>\n    <\/sc-for>\n    <div style=\"flex:1;border-bottom:1px solid #9a968e\"><\/div>\n  <\/div>\n  <div style=\"flex:1;overflow-y:auto;background:#C6C6C6;padding:14px\">\n\n    <sc-if value=\"{{ dpt.isMain }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:20px;align-items:flex-start\">\n        <div style=\"width:520px\">\n          <sc-for list=\"{{ dpt.mainRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;align-items:center;padding:4px 8px;border-bottom:1px solid #B6B6B2;font-size:12.5px;background:{{ r.rowBg }}\">\n              <div style=\"width:170px;color:#3c3c3c\">{{ r.label }}<\/div>\n              <div style=\"width:110px;font-weight:700;color:#55524c;font-size:11px\">{{ r.param }}<\/div>\n              <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                <input value=\"{{ entryText }}\" onChange=\"{{ entryChange }}\" onKeyDown=\"{{ entryKey }}\" ref=\"{{ entryRef }}\" style=\"width:110px;padding:2px 5px;font-size:12.5px;font-weight:700;background:#FFFFFF;border:2px solid #31548F;outline:none\" />\n              <\/sc-if>\n              <sc-if value 00;margin-bottom:6px\">OPERATION NOTES<\/div>\n            <div style=\"line-height:1.5\">SP entry permitted in AUTO only. OP entry permitted in MAN only. CAS setpoint is driven by the primary controller. Entries are clamped to configured limits and rejected with a Message Zone notice. Tuning and limit changes require ENGR level or above.<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ dpt.isAlm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:820px\">\n        <div style=\"display:flex;padding:3px 8px;background:#C8C5BE;font-weight:700;font-size:11px;border:1px solid #9a968e\">\n          <div style=\"width:100px\">Condition<\/div><div style=\"width:130px\">Trip point<\/div><div style=\"width:110px\">Priority<\/div><div style=\"width:90px\">State<\/div><div style=\"width:70px\">Service<\/div><div style=\"flex:1\">Note<\/div>\n        <\/div>\n        <sc-for list=\"{{ dpt.almRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;padding:4px 8px;font-size:12.5px;background:#CFCFCB;border:1px solid #B6B6B2;border-top:none\">\n            <div style=\"width:100px;font-weight:700\">{{ r.cond }}<\/div>\n            <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:130px\"><input value=\"{{ entryText }}\" onChange=\"{{ entryChange }}\" onKeyDown=\"{{ entryKey }}\" ref=\"{{ entryRef }}\" style=\"width:100px;padding:2px 5px;font-weight:700;background:#FFFFFF;border:2px solid #31548F;outline:none\" /><\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ r.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:130px;font-weight:700;cursor:pointer;text-decoration:underline dotted\" onClick=\"{{ r.cb }}\">{{ r.tp }}<\/div>\n            <\/sc-if>\n            <div style=\"width:110px;cursor:pointer;font-weight:700;color:{{ r.prioFg }}\" onClick=\"{{ r.prioCb }}\" nunciates until RTS. Deadband and on-delay are ENGR-editable and journaled the same way. {{ dpt.almNote }} Journal alarms are logged only — no annunciation.<\/div>\n        <div style=\"margin-top:12px;background:#CFCFCB;border:1px solid #B6B6B2;padding:8px 10px\">\n          <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:6px\">\n            <div style=\"font-weight:700;font-size:12px;flex:1\">ALARM HELP<\/div>\n            <sc-for list=\"{{ dpt.helpConds }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"padding:2px 9px;font-size:11px;font-weight:700;cursor:pointer;background:{{ h.bg }};border:2px solid;border-color:{{ h.bc }}\" onClick=\"{{ h.cb }}\">{{ h.label }}<\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:11.5px;line-height:1.5\">\n            <sc-for list=\"{{ dpt.help.fields }}\" as=\"h\" hint-placeholder-count=\"6\">\n              <div style=\"font-weight:700;color:#55524c\">{{ h.k }}<\/div><div>{{ h.v }}<\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">Priority and setting come from the live point configuration; consequence, cause and action are this simulator's rationalisation for the condition.<\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ dpt.isTune }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:640px\">\n        <sc-for list=\"{{ dpt.tuneRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:center;padding:4px 8px;border-bottom:1px solid #B6B6B2;font-size:12.5px\">\n            <div style=\"width:230px;color:#3c3c3c\">{{ r.label }}<\/div>\n            <div style=\"width:110px;font-weight:700;color:#55524c;font-size:11px\">{{ r.param }}<\/div>\n            <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n              <input value=\"{{ entryText }}\" onChange=\"{{ entryChange }}\" onKeyDown=\"{{ entryKey }}\" ref=\"{{ entryRef }}\" style=\"width:100px;padding:2px 5px;font-weight:700;background:#FFFFFF;border:2px solid #31548F;outline:none\" />\n            <\/sc-if>\n            <sc-if value=\"{{ r.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:110px;font-weight:700;cursor:{{ r.cur }};text-decoration:{{ r.und }}\" onClick=\"{{ r.cb }}\">{{ r.value }}<\/div>\n            <\/sc-if>\n            <div style=\"flex:1;font-size:11px;color:#55524c\">{{ r.note }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"margin-top:10px;font-size:11px;color:#7a1a00;font-weight:700\">{{ dpt.tuneGate }}<\/div>\n        <div style=\"margin-top:4px;font-size:11px;color:#55524c\">Experion PID form: OP = K·e% + K/(T1·60)·∫e%·dt − K·T2·60·dPV%/dt, with back-calculation anti-windup and bumpless transfer. T1, T2 in minutes.<\/div>\n        <div style=\"margin-top:4px;font-size:11px;color:#55524c\">ISA standard form: OP = Kc·( e + (1/Ti)·∫e·dt + Td·de/dt ) with Kc = K, Ti = T1, Td = T2 (minutes); the parallel gains are Kp = K, Ki = K/(Ti·60) per second, Kd = K·Td·60 seconds.<\/div>\n        <div style=\"margin-top:12px;background:#CFCFCB;border:1px solid #B6B6B2;padding:8px\">\n          <div style=\"display:flex;font-size:11px;font-weight:700;margin-bottom:4px\"><div style=\"flex:1\">STEP RESPONSE — LAST {{ dpt.spark.span }}<\/div><div style=\"color:#C00000\">PV<\/div><div style=\"color:#0050C0;margin-left:8px\">SP<\/div><div style=\"color:#008000;margin-left:8px\">OP<\/div><\/div>\n          <svg viewBox=\"0 0 320 90\" preserveAspectRatio=\"none\" style=\"width:100%;height:90px;background:#FFFFFF;border:1px solid #9a968e;display:block\">\n            <line x1=\"0\" y1=\"45\" x2=\"320\" y2=\"45\" stroke=\"#DDDDDD\" stroke-width=\"1\"><\/line>\n            <polyline points=\"{{ dpt.spark.op }}\" fill=\"none\" stroke=\"#008000\" stroke-width=\"1.2\"><\/polyline>\n            <polyline points=\"{{ dpt.spark.sp }}\" fill=\"none\" stroke=\"#0050C0\" stroke-width=\"1.2\" stroke-dasharray=\"4,3\"><\/polyline>\n            <polyline points=\"{{ dpt.spark.pv }}\" fill=\"none\" stroke=\"#C00000\" stroke-width=\"1.6\"><\/polyline>\n          <\/svg>\n          <div style=\"font-size:10.5px;color:#55524c;margin-top:4px\">{{ dpt.spark.note }}<\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ dpt.isChart }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"height:100%;display:flex;flex-direction:column;gap:8px\">\n        <svg viewBox=\"0 0 1060 360\" style=\"width:100%;flex:1;min-height:220px;background:#FAFAF8;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" preserveAspectRatio=\"none\">\n          <sc-for list=\"{{ dpt.chartGrid }}\" as=\"gl\" hint-placeholder-count=\"5\">\n            <line x1=\"44\" x2=\"1050\" y1=\"{{ gl.y }}\" y2=\"{{ gl.y }}\" style=\"stroke:#DDDDD8;stroke-width:1\"><\/line>\n            <text x=\"8\" y=\"{{ gl.ty }}\" style=\"font:10px Tahoma;fill:#7a766e\">{{ gl.label }}<\/text>\n          <\/sc-for>\n          <sc-for list=\"{{ dpt.chartPens }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <polyline points=\"{{ p.pts }}\" style=\"fill:none;stroke-width:1.7;stroke:{{ p.color }};stroke-dasharray:{{ p.dash }}\"><\/polyline>\n          <\/sc-for>\n        <\/svg>\n        <div style=\"display:flex;gap:22px;font-size:12px;font-weight:700\">\n          <sc-for list=\"{{ dpt.chartPens }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:18px;height:4px;background:{{ p.color }}\"><\/div>{{ p.label }} = {{ p.val }}<\/div>\n          <\/sc-for>\n          <div style=\"flex:1\"><\/div><div style=\"color:#55524c;font-weight:400\">15 minute span · % of range<\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ dpt.isCm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:900px\">\n        <div style=\"font-weight:700;font-size:13px;margin-bottom:8px\">CONTROL MODULE {{ dpt.cm }} — chart view (as built in Control Builder)<\/div>\n        <svg viewBox=\"0 0 900 260\" style=\"width:100%;background:#EDEDE8;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\">\n          <rect x=\"10\" y=\"10\" width=\"880\" height=\"240\" fill=\"none\" stroke=\"#8a867e\" stroke-width=\"1.5\" stroke-dasharray=\"6,4\"><\/rect>\n          <text x=\"22\" y=\"32\" style=\"font:700 12px Tahoma;fill:#55524c\">CM: {{ dpt.cm }} · CEE 50 mS BASE · PERIOD 500 mS (SIM) · C300-SIM<\/text>\n          <sc-for list=\"{{ dpt.cmBlocks }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <rect x=\"{{ b.x }}\" y=\"90\" width=\"150\" height=\"90\" fill=\"#D8D8D4\" stroke=\"#4a4a4a\" stroke-width=\"2\"><\/rect>\n            <text x=\"{{ b.lx }}\" y=\"112\" style=\"font:700 12px Tahoma;fill:#000\">{{ b.name }}<\/text>\n            <text x=\"{{ b.lx }}\" y=\"128\" style=\"font:10px Tahoma;fill:#55524c\">{{ b.type }}<\/text>\n            <text x=\"{{ b.lx }}\" y=\"146\" style=\"font:10px Tahoma;fill:#55524c\">ORDERINCM {{ b.ord }}<\/text>\n            <text x=\"{{ b.lx }}\" y=\"162\" style=\"font:10px Tahoma;fill:#31548F\">{{ b.note }}<\/text>\n          <\/sc-for>\n          <sc-for list=\"{{ dpt.cmWires }}\" as=\"w\" hint-placeholder-count=\"3\">\n            <path d=\"{{ w.d }}\" style=\"stroke:#31548F;stroke-width:2;fill:none\"><\/path>\n            <text x=\"{{ w.tx }}\" y=\"{{ w.ty }}\" style=\"font:10px Tahoma;fill:#31548F\">{{ w.label }}<\/text>\n          <\/sc-for>\n        <\/svg>\n        <div style=\"margin-top:8px;font-size:11px;color:#55524c;line-height:1.5\">{{ dpt.cmNote }}<\/div>\n      <\/div>\n    <\/sc-if>\n\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isInstr }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Instructor Station\" style=\"position:absolute;inset:0;display:flex;flex-direction:column\">\n  <div style=\"display:flex;align-items:center;gap:8px;padding:5px 8px;background:#41608A;color:#FFFFFF;border-bottom:1px solid #22344e;user-select:none\">\n    <div style=\"font-weight:700;font-size:13px\">INSTRUCTOR STATION<\/div>\n    <div style=\"font-size:10.5px;padding:1px 8px;background:#D4D0C8;color:#000\">{{ instr.authT }}<\/div>\n    <div style=\"font-size:11px\">SIM {{ instr.run.simT }} · UPTIME {{ instr.run.upT }} · {{ instr.run.stateT }}<\/div>\n    <div style=\"flex:1\"><\/div>\n    <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#000;background:{{ instr.hidden.bg }};border:2px solid;border-color:{{ instr.hidden.bc }}\" onClick=\"{{ instr.hidden.cb }}\">{{ instr.hidden.label }}<\/div>\n    <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#000;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ instr.close }}\">TRAINEE VIEW<\/div>\n    <div style=\"padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#000;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ instr.lock }}\">LOCK<\/div>\n  <\/div>\n  <div style=\"font-size:10.5px;color:#3c3c3c;padding:4px 10px;background:#CCC8C0;border-bottom:1px solid #9a968e\">{{ instr.hiddenNote }}<\/div>\n  <div style=\"flex:1;overflow-y:auto;padding:10px 12px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:10px;max-width:1400px\">\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">RUN CONTROL<\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">\n          <div style=\"padding:4px 12px;font-weight:700;cursor:pointer;background:{{ instr.run.freeze.bg }};border:2px solid;border-color:{{ instr.run.freeze.bc }}\" onClick=\"{{ instr.run.freeze.cb }}\">{{ instr.run.freeze.label }}<\/div>\n          <div style=\"padding:4px 12px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ instr.run.stepOne.cb }}\">{{ instr.run.stepOne.label }}<\/div>\n          <div style=\"padding:4px 12px;font-weight:700;cursor:pointer;background:{{ instr.run.runBtn.bg }};border:2px solid;border-color:{{ instr.run.runBtn.bc }}\" onClick=\"{{ instr.run.runBtn.cb }}\">{{ instr.run.runBtn.label }}<\/div>\n          <sc-for list=\"{{ instr.run.speeds }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"padding:4px 10px;font-weight:700;cursor:pointer;background:{{ s.bg }};border:2px solid;border-color:{{ s.bc }}\" onClick=\"{{ s.cb }}\">{{ s.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11.5px\">\n          <div>Random seed <b>{{ instr.seedT }}<\/b><\/div>\n          <input value=\"{{ instr.seedVal }}\" onChange=\"{{ instr.seedChange }}\" onKeyDown=\"{{ instr.seedKey }}\" placeholder=\"new seed\" style=\"width:110px;padding:2px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none;font-size:11.5px\" />\n          <div style=\"padding:2px 10px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ instr.seedGo }}\">SET SEED<\/div>\n        <\/div>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:4px\">Every random draw (measurement noise, drill timing) comes from this seed. Snapshots store the seed and the generator position, so a restore or a replay repeats the same run.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">BACKTRACK<\/div>\n        <div style=\"font-size:11.5px;margin-bottom:6px\">{{ instr.back.count }} automatic snapshots, one every 30 s of sim time, covering the last {{ instr.back.spanT }} (oldest {{ instr.back.oldestT }}).<\/div>\n        <div style=\"display:flex;gap:6px\">\n          <sc-for list=\"{{ instr.back.btns }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"padding:4px 14px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ b.cb }}\">{{ b.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">A backtrack restores the process, the alarm list, the trends and the journal to that moment; the trainee's later actions are dropped.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">SNAPSHOTS<\/div>\n        <div style=\"display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:11.5px\">\n          <div>Name for the next save:<\/div>\n          <input value=\"{{ instr.snapName }}\" onChange=\"{{ instr.snapNameChange }}\" placeholder=\"optional\" style=\"flex:1;padding:2px 6px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E;outline:none;font-size:11.5px\" />\n        <\/div>\n        <sc-for list=\"{{ instr.slots }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:1px solid #B6B6B2;font-size:11.5px\">\n            <div style=\"width:16px;font-weight:700\">{{ s.n }}<\/div>\n            <div style=\"flex:1\">{{ s.name }}<\/div>\n            <div style=\"width:60px;color:#55524c\">{{ s.t }}<\/div>\n            <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ s.save }}\">SAVE<\/div>\n            <sc-if value=\"{{ s.has }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#B8C4D4;border:1px solid #31548F\" onClick=\"{{ s.restore }}\">RESTORE<\/div>\n              <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ s.replay }}\">REPLAY<\/div>\n              <div style=\"padding:2px 8px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ s.clear }}\">✕<\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">INITIAL CONDITIONS<\/div>\n        <sc-for list=\"{{ instr.presets }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:4px 4px;border-bottom:1px solid #B6B6B2\">\n            <div style=\"flex:1\"><div style=\"font-size:11.5px;font-weight:700\">{{ p.label }}<\/div><div style=\"font-size:10.5px;color:#55524c\">{{ p.desc }}<\/div><\/div>\n            <div style=\"padding:3px 12px;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" style-active=\"border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" onClick=\"{{ p.cb }}\">LOAD<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">Loading an initial condition resets the process, runs it to the stated condition with the current seed and loads the result as a snapshot. Saved slots are kept.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"display:flex;align-items:center;margin-bottom:6px\"><div style=\"font-weight:700;font-size:12px;flex:1\">UPSETS<\/div>\n          <div style=\"padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ instr.clearUpsets }}\">CLEAR ALL<\/div><\/div>\n        <sc-for list=\"{{ instr.upsets }}\" as=\"u\" hint-placeholder-count=\"12\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:2px 4px;font-size:11.5px;border-bottom:1px solid rgba(0,0,0,0.06)\">\n            <input type=\"checkbox\" checked=\"{{ u.on }}\" onChange=\"{{ u.cb }}\" />\n            <div style=\"width:26px;font-size:10px;color:#55524c\">{{ u.unit }}<\/div>\n            <div style=\"flex:1\">{{ u.label }}<\/div>\n            <sc-if value=\"{{ u.hasMag }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:10.5px;color:#55524c\">{{ u.magLabel }}<\/div>\n              <input type=\"range\" min=\"{{ u.magMin }}\" max=\"{{ u.magMax }}\" step=\"{{ u.magStep }}\" value=\"{{ u.magVal }}\" onChange=\"{{ u.magChange }}\" style=\"width:90px\" />\n              <div style=\"width:74px;font-size:10.5px;font-weight:700\">{{ u.magT }}<\/div>\n            <\/sc-if>\n            <div style=\"width:48px;text-align:right;font-size:10px;font-weight:700;color:#A00000\">{{ u.stateT }}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n\n      <div style=\"grid-column:1 / -1;background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:4px\">\n          <div style=\"font-weight:700;font-size:12px\">ARCHITECTURE — TOPOLOGY FAULT MATRIX<\/div>\n          <div style=\"flex:1\"><\/div>\n          <sc-for list=\"{{ arch.layers }}\" as=\"ly\" hint-placeholder-count=\"8\">\n            <div style=\"padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;background:{{ ly.bg }};border:2px solid;border-color:{{ ly.bc }}\" onClick=\"{{ ly.cb }}\">{{ ly.label }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <div style=\"font-size:10.5px;color:#55524c;margin-bottom:6px\">Click a fault badge to stage an injection on that node. FIC102's transmitter failure, LIC101's drift and TV-202's stiction are the legacy upsets above and are not offered here again.<\/div>\n        <div style=\"max-height:200px;overflow-y:auto;border:1px solid #9a968e;background:#FFFFFF\">\n          <sc-for list=\"{{ arch.rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:10.5px;border-bottom:1px solid rgba(0,0,0,0.06);flex-wrap:wrap\">\n              <div style=\"width:104px;font-weight:700\">{{ r.id }}<\/div>\n              <div style=\"width:44px;color:#55524c;font-size:9.5px\">{{ r.layer }}<\/div>\n              <div style=\"flex:1;min-width:120px;color:#3c3c3c\">{{ r.label }}<\/div>\n              <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"padding:2px 6px;font-size:9px;font-weight:700;cursor:pointer;background:{{ c.bg }};border:{{ c.bc }}\" onClick=\"{{ c.cb }}\">{{ c.faultId }}<\/div>\n              <\/sc-for>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n\n        <sc-if value=\"{{ arch.stage }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:8px;padding:8px;background:#EDEDE9;border:1px solid #9a968e\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n              <div style=\"font-weight:700;font-size:11.5px;flex:1\">STAGE: {{ arch.stage.faultId }} @ {{ arch.stage.nodeId }} — {{ arch.stage.nodeLabel }}<\/div>\n              <div style=\"font-size:10px;font-weight:700;color:#A00000\">{{ arch.stage.statusT }}<\/div>\n              <div style=\"padding:2px 8px;font-size:10.5px;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ arch.stage.close }}\">✕<\/div>\n            <\/div>\n            <div style=\"font-size:10.5px;color:#55524c;margin-bottom:6px\">Domain {{ arch.stage.domain }} · Recovery condition: {{ arch.stage.recoveryT }}<\/div>\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:11px\">\n              <div>Onset delay <input value=\"{{ arch.stage.delayVal }}\" onChange=\"{{ arch.stage.delayChange }}\" style=\"width:46px;padding:1px 4px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" /> s (0 = now)<\/div>\n              <div>Duration <input value=\"{{ arch.stage.durationVal }}\" onChange=\"{{ arch.stage.durationChange }}\" placeholder=\"indefinite\" style=\"width:64px;padding:1px 4px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" /> s<\/div>\n              <div style=\"display:flex;gap:4px\">\n                <div style=\"padding:2px 10px;font-weight:700;cursor:pointer;background:{{ arch.stage.modeStep.bg }};border:2px solid;border-color:{{ arch.stage.modeStep.bc }}\" onClick=\"{{ arch.stage.modeStep.cb }}\">{{ arch.stage.modeStep.label }}<\/div>\n                <div style=\"padding:2px 10px;font-weight:700;cursor:pointer;background:{{ arch.stage.modeRamp.bg }};border:2px solid;border-color:{{ arch.stage.modeRamp.bc }}\" onClick=\"{{ arch.stage.modeRamp.cb }}\">{{ arch.stage.modeRamp.label }}<\/div>\n              <\/div>\n              <sc-if value=\"{{ arch.stage.isRamp }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>Ramp time <input value=\"{{ arch.stage.rampVal }}\" onChange=\"{{ arch.stage.rampChange }}\" style=\"width:46px;padding:1px 4px;background:#FFFFFF;border:2px solid;border-color:#6E6E6E #FFFFFF #FFFFFF #6E6E6E\" /> s<\/div>\n              <\/sc-if>\n              <sc-if value=\"{{ arch.stage.hasMag }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:4px\">Magnitude\n                  <input type=\"range\" min=\"{{ arch.stage.magMin }}\" max=\"{{ arch.stage.magMax }}\" step=\"{{ arch.stage.magStep }}\" value=\"{{ arch.stage.magVal }}\" onChange=\"{{ arch.stage.magChange }}\" style=\"width:90px\" />\n                  <div style=\"font-weight:700\">{{ arch.stage.magVal }} {{ arch.stage.magEu }}<\/div>\n                <\/div>\n              <\/sc-if>\n            <\/div>\n            <div style=\"font-size:10px;color:#55524c;margin:6px 0\">{{ arch.stage.visibilityT }}<\/div>\n            <sc-if value=\"{{ arch.stage.canActivate }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:3px 14px;display:inline-block;font-weight:700;cursor:pointer;background:#B8C4D4;border:2px solid;border-color:#31548F\" onClick=\"{{ arch.stage.activate }}\">ACTIVATE<\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ arch.stage.showClear }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:3px 14px;display:inline-block;font-weight:700;cursor:pointer;background:#D4D0C8;border:2px solid;border-color:#FFFFFF #6E6E6E #6E6E6E #FFFFFF\" onClick=\"{{ arch.stage.clear }}\">CLEAR<\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-if>\n\n        <div style=\"font-weight:700;font-size:11.5px;margin-top:8px\">ACTIVE / PENDING ARCHITECTURE FAULTS ({{ arch.activeCount }})<\/div>\n        <sc-if value=\"{{ arch.activeEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:11px;color:#55524c\">Nothing active or pending from this panel. (The three legacy upsets' architecture faults, if any, are shown above under UPSETS.)<\/div>\n        <\/sc-if>\n        <sc-for list=\"{{ arch.active }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <div style=\"padding:3px 4px;font-size:10.5px;border-bottom:1px solid rgba(0,0,0,0.06)\">\n            <div style=\"display:flex;align-items:center           <\/div>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">Every injection here routes through the same dispatch/journal boundary as UPSETS above (INSTRUCTOR actor, journaled once, replays deterministically) and honours the HIDDEN UPSETS switch. Blast radius and recovery condition are instructor-only; the trainee's ARCH view (Learn/Trace) sees only the resulting symptom, never this table.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"font-weight:700;font-size:12px;margin-bottom:6px\">INSTRUCTOR VARIABLES<\/div>\n        <sc-for list=\"{{ instr.vars }}\" as=\"v\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:3px 4px;font-size:11.5px;border-bottom:1px solid rgba(0,0,0,0.06)\">\n            <div style=\"width:150px\">{{ v.label }}<\/div>\n            <input type=\"range\" min=\"{{ v.min }}\" max=\"{{ v.max }}\" step=\"{{ v.step }}\" value=\"{{ v.val }}\" onChange=\"{{ v.change }}\" style=\"flex:1\" />\n            <div style=\"width:96px;font-weight:700\">{{ v.valT }}<\/div>\n            <div style=\"padding:1px 6px;font-size:10px;cursor:pointer;background:#D4D0C8;border:1px solid #6E6E6E\" onClick=\"{{ v.reset }}\">DESIGN<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"font-size:10.5px;color:#55524c;margin-top:6px\">Plant conditions the trainee cannot see: the models read them directly, and they travel with snapshots and initial conditions.<\/div>\n      <\/div>\n\n      <div style=\"background:#CFCFCB;border:2px solid;border-color:#FFFFFF #8a867e #8a867e #FFFFFF;padding:8px 10px\">\n        <div style=\"display:flex;align-items:center;margin-bottom:6px\"><div style=\"font-weight:700;font-size:12px;flex:1\">ACTION JOURNAL ({{ instr.journal.count }})<\/div>\n          <sc-if value=\"{{ instr.journal.replayOn }}\" hint-placehold
